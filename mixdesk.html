function updateBand(){const b=bands[lab.band];$('#bandDetail').innerHTML=`<div><h3>${b[2]} · ${b[1]}</h3><p>${b[3]}</p></div><div><h3>Try this listening check</h3><p>${b[4]}</p></div>`;document.querySelectorAll('[data-band]').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.band)===lab.band));}
function renderNotebook(){const s=session(),notes=lessons.filter(l=>NOTE_KEYS.some(k=>s.notes[l.id]?.[k]));return pageTitle('For Sophia & her mentor','Keep the decisions, not just the settings.','A notebook for each song or listening pass. Notes and ticks stay in this browser; export a backup to share or move them to another computer.')+`<div class="panel" style="margin-bottom:24px"><div class="bookrow"><label for="sessionSelect" class="small"><b>Current session</b></label><select id="sessionSelect">${state.sessions.map(x=>`<option value="${esc(x.id)}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn primary" id="newSession">New song</button></div><div class="note">The HTML file contains the guide. Your notes are stored separately in this browser and do not sync automatically. Export the notebook before changing computers or clearing browser data.</div><div class="btnrow" style="margin-top:19px"><button class="btn" id="exportNotebook">Export notebook</button><button class="btn" id="importNotebook">Import notebook</button><button class="btn" id="exportText">Download session notes</button><button class="btn" id="printPage">Print this session</button></div><p class="small muted" style="margin-top:13px">Import adds copies of sessions and keeps your existing notes. Export includes all songs in this browser.</p></div><div class="contentgrid"><div class="stack"><section class="panel"><h2>The session brief</h2><div class="print-only"><p><strong>${esc(s.name)}</strong><br>${esc(s.learner)} · ${esc(genre()?.name||'Any style')}</p><p style="white-space:pre-wrap">${esc(s.brief||'No brief recorded.')}</p><h3>References and delivery requirements</h3><p style="white-space:pre-wrap">${esc(s.reference||'None recorded.')}</p></div><div class="notefields notebookfields"><label class="field">Song / session name<input data-session-field="name" maxlength="120" value="${esc(s.name)}"></label><label class="field">Who’s at the desk?<input data-session-field="learner" maxlength="80" value="${esc(s.learner)}"></label><label class="field">What does the song need?<textarea data-session-field="brief" maxlength="8000" placeholder="Artist’s intention, today’s priority, and what you want to preserve…">${esc(s.brief)}</textarea></label><label class="field">References and delivery requirements<textarea data-session-field="reference" maxlength="3000" placeholder="A reference and what you like about it; required format, deadline, or version…">${esc(s.reference)}</textarea></label></div><p class="saved" style="margin-top:12px">${storageOK?'Saved in this browser':'Storage unavailable · export to keep notes'}</p></section><section class="panel"><h2>Listening notes by lesson</h2>${notes.length?notes.map(l=>`<div class="reportnote"><h3>${esc(l.short)}</h3>${NOTE_KEYS.filter(k=>s.notes[l.id]?.[k]).map(k=>`<p><strong>${NOTE_LABELS[NOTE_KEYS.indexOf(k)]}</strong>${esc(s.notes[l.id][k])}</p>`).join('')}<button class="textlink" data-lesson="${l.id}">Return to lesson</button></div>`).join(''):'<p class="muted">No listening notes yet. Each workflow lesson has a place to capture what you heard, what you tried, and what changed.</p><button class="btn primary" data-lesson="setup">Open the first lesson</button>'}</section></div><aside class="side stack"><section class="panel"><h2>Session progress</h2>${lessons.map(l=>`<div style="display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:.83rem"><button class="textlink" data-lesson="${l.id}">${esc(l.short)}</button><span>${checklistCount(l)} / ${l.checklist.length}</span></div>`).join('')}<button class="btn small noprint" id="resetChecks" style="margin-top:12px">Reset this song’s ticks</button></section><section class="panel experiment"><h2>One useful question</h2><p>“We hear ___ at ___. We tried ___, which changed ___. We want it to feel more ___.”</p><p class="small">Bring that description back to the chat with the relevant recording or screenshot when useful.</p></section></aside></div>`;}
function renderSources(){return pageTitle('About this edition','A reference you can question.','Built for hands-on learning in Logic Pro with Sophia and her mentor. Technical controls are grounded in Apple documentation; musical choices and practice ranges are teaching suggestions.')+`<div class="stack"><section class="panel"><h2>Use the desk alongside Logic</h2><ol class="bulletlist"><li>Choose a song in the Session notebook, then select a style or keep “Any style.”</li><li>Work through a lesson, or use Find a fix for a specific symptom.</li><li>Make one change in Logic, compare at matched loudness, and write a short observation.</li><li>Export your notebook to move notes between computers. This page does not hear your audio, control Logic, or synchronize notes.</li></ol><p class="small muted" style="margin-top:16px">Everything in the guide works offline. Reference links need an internet connection. Local browser storage can be unavailable in private modes or cleared by browser settings; keep exported backups.</p></section><section class="panel"><h2>Check your installed Logic version</h2><p class="muted">Logic Pro X spans many versions. Some menus say Preferences, newer versions say Settings; custom key commands may differ. Confirm exact version under Logic Pro > About Logic Pro.</p><div class="compatgrid"><p><strong>Core workflow</strong>Use Channel EQ, Compressor, Gain, sends, automation, and the stock reverb/delay tools available in your installation.</p><p><strong>Logic 10.4 and 10.4.5</strong>ChromaVerb and Vintage EQ arrived in 10.4; DeEsser 2 in 10.4.5. Older installations can use their available reverb, legacy de-esser, and manual edits.</p><p><strong>Logic 10.8</strong>Mastering Assistant is optional. Its available characters also depend on the computer and execution mode.</p><p><strong>Logic 11 and Apple silicon</strong>ChromaGlow requires Apple silicon and is unavailable when Logic runs in Rosetta. Ordinary EQ, gain, and dynamics lessons do not depend on it.</p></div><div class="linklist">${sourceLinks(['versions','compatibility','mastering'])}</div></section><section class="panel"><h2>Corrections and context</h2><p>This edition expands the original Vocal Mix Desk beyond its warm, intimate, guitar-led example. It replaces mandatory chains and targets with conditional decisions, corrects the two middle Flex Pitch hotspot labels, and separates mastering choices from platform playback normalization.</p><p>No genre profile is a rulebook. A duet is not automatically a lead with quiet backing vocals; a choir is not one monophonic voice; an average input level or LUFS number does not certify a good mix.</p></section><section class="panel"><h2>Primary references</h2><p class="small muted">Documentation reviewed for this edition on October 8, 2026. Some links point to a specific guide version; choose the version that matches your computer.</p>${sources.map(s=>`<div class="sourceitem"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><p>${esc(s.note)}</p></div>`).join('')}</section></div>`;}
function snippet(obj,q){const text=JSON.stringify(obj).replace(/[{}\[\]"]/g,' ').replace(/\s+/g,' ');const index=text.toLowerCase().indexOf(q.toLowerCase());return (index>65?'…':'')+text.slice(Math.max(0,index-65),Math.max(0,index-65)+170)+'…';}
function getSearch(q){if(!q.trim())return [];const needle=q.toLowerCase().trim();let rows=[];
 for(const l of lessons)if(JSON.stringify(l).toLowerCase().includes(needle))rows.push({kind:'Lesson',title:l.title,text:l.goal,view:'learn',id:l.id,score:l.title.toLowerCase().includes(needle)?0:2});
 for(const p of problems)if(JSON.stringify(p).toLowerCase().includes(needle))rows.push({kind:'Troubleshooting',title:p.title,text:p.symptom,view:'problems',id:p.id,score:p.title.toLowerCase().includes(needle)?0:1});
 for(const g of genres)if(JSON.stringify(g).toLowerCase().includes(needle))rows.push({kind:'Genre guide',title:g.name,text:g.tagline,view:'genres',id:g.id,score:g.name.toLowerCase().includes(needle)?0:3});
 for(const g of glossary)if(JSON.stringify(g).toLowerCase().includes(needle))rows.push({kind:'Glossary',title:g.term,text:g.definition,view:'glossary',id:g.term,score:g.term.toLowerCase().includes(needle)?0:4});
 return rows.sort((a,b)=>a.score-b.score);
}
function renderSearch(){const q=route.id,rows=getSearch(q);$('#search').value=q;return pageTitle('Search the whole desk',q?`Results for “${q}”`:'What do you want to understand?',q?`${rows.length} matching lessons, situations, styles, and terms.`:'Type a sound, control, or musical style in the search field.')+(rows.length?rows.map(r=>`<button class="result" data-view="${r.view}" data-id="${esc(r.id)}"><span class="eyebrow">${r.kind}</span><h2>${esc(r.title)}</h2><p>${esc(r.text)}</p></button>`).join(''):q?'<div class="empty">No matches yet. Try a simpler term such as “pitch,” “mud,” “delay,” or “noise.”</div>':'');}
function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function safeName(name){return name.replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').slice(0,70)||'session';}
function sessionText(){const s=session();let t=`# ${s.name}\n\nPeople: ${s.learner}\nStyle: ${genre()?.name||'Any style'}\n\n## Session brief\n${s.brief||'No brief yet.'}\n\n## References / delivery\n${s.reference||'None recorded.'}\n`;
 for(const l of lessons){t+=`\n## ${l.short}\n`;l.checklist.forEach((c,i)=>t+=`- [${s.checks[l.id+':'+i]?'x':' '}] ${c}\n`);NOTE_KEYS.forEach((k,i)=>{if(s.notes[l.id]?.[k])t+=`\n${NOTE_LABELS[i]}:\n${s.notes[l.id][k]}\n`;});}return t;}
function closeMenu(){const wasOpen=$('#rail').classList.contains('open');$('#rail').classList.remove('open');$('#veil').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');if(wasOpen)$('#menu').focus();}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.lesson){navigate('learn',b.dataset.lesson);return;}
 if(b.dataset.view){navigate(b.dataset.view,b.dataset.id||'');return;}
 if(b.dataset.useGenre){session().genre=b.dataset.useGenre;save();navigate('learn','setup');toast('Style notes now follow you through the workflow.');return;}
 if(b.dataset.styleLesson){session().genre=b.dataset.style;save();navigate('learn',b.dataset.styleLesson);return;}
 if(b.dataset.filter){filter=b.dataset.filter;const query=localQuery;$('#main').innerHTML=context()+renderProblems()+footer();localQuery=query;return;}
 if(b.dataset.band!==undefined){lab.band=Number(b.dataset.band);updateBand();return;}
 switch(b.id){
 case 'menu':{const open=!$('#rail').classList.contains('open');$('#rail').classList.toggle('open',open);$('#veil').classList.toggle('open',open);b.setAttribute('aria-expanded',open);if(open)$('#mainnav button').focus();break;}
 case 'newSession':$('#newDialog').showModal();$('#newname').focus();break;
 case 'cancelnew':$('#newDialog').close();break;
 case 'exportNotebook':download('Vocal-Mix-Desk-notebook.json',JSON.stringify({...state,exported:new Date().toISOString()},null,2));toast('Notebook downloaded. Share the JSON file to move notes.');break;
 case 'importNotebook':$('#importfile').click();break;
 case 'exportText':download(safeName(session().name)+'-notes.md',sessionText(),'text/markdown');toast('Session notes downloaded.');break;
 case 'printPage':render();window.print();break;
 case 'resetChecks':if(confirm('Reset checklist ticks for this song? Your notes will stay.')){session().checks={};save();render();toast('This song’s ticks have been reset.');}break;
 case 'resetComp':Object.assign(lab,{threshold:-18,ratio:4,makeup:0,input:-10});for(const k of ['threshold','ratio','makeup','input'])$('#lab-'+k).value=lab[k];updateLab();break;
 }
});
$('#veil').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.note){const l=el.dataset.noteLesson;session().notes[l]??={};session().notes[l][el.dataset.note]=el.value;save();}
 if(el.dataset.sessionField){session()[el.dataset.sessionField]=el.value;save();}
 if(el.dataset.lab){lab[el.dataset.lab]=Number(el.value);updateLab();}
 if(el.id==='bpm'){const v=Number(el.value);if(Number.isFinite(v)&&v>=20&&v<=300){lab.bpm=v;el.removeAttribute('aria-invalid');updateDelay();}else{el.setAttribute('aria-invalid','true');$('#delayValues').innerHTML='';$('#bpmMessage').textContent='Enter a tempo from 20 to 300 BPM.';}}
 if(el.id==='problemSearch'){localQuery=el.value;$('#problemResults').innerHTML=problemResults();}
 if(el.id==='glossarySearch'){localQuery=el.value;$('#glossaryResults').innerHTML=glossaryResults(el.value);}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.check){session().checks[el.dataset.check]=el.checked;save();renderNavigation();}
 if(el.id==='genreSelect'){session().genre=el.value;save();render();toast(el.value==='all'?'Exploring without a genre preset.':'Style notes updated for this song.');}
 if(el.id==='sessionSelect'){state.active=el.value;save();render();toast('Session loaded.');}
 if(el.dataset.sessionField){if(el.dataset.sessionField==='name'&&!el.value.trim()){session().name='Untitled session';el.value=session().name;save();}const c=$('.contextline button');if(c)c.textContent=session().name;const o=$('#sessionSelect option:checked');if(o)o.textContent=session().name;}
});
$('#newform').addEventListener('submit',e=>{e.preventDefault();if(state.sessions.length>=100){toast('This notebook supports up to 100 sessions. Export it to keep a backup.');return;}const f=new FormData(e.target),s=fresh(String(f.get('song')).trim(),String(f.get('learner')).trim()||'Sophia + mentor',session().genre);if(!s.name)return;state.sessions.push(s);state.active=s.id;save();$('#newDialog').close();$('#newname').value='';render();toast('New session ready.');});
$('#searchform').addEventListener('submit',e=>{e.preventDefault();navigate('search',$('#search').value.trim());});
$('#importfile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>50*1024*1024)throw Error('The notebook is too large. Choose a JSON export smaller than 50 MB.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.sessions)||!data.sessions.length)throw Error('Choose a notebook JSON file exported from this edition of Vocal Mix Desk.');const incoming=data.sessions.map(cleanSession).filter(Boolean);if(!incoming.length)throw Error('The file contains no valid sessions.');if(state.sessions.length+incoming.length>100)throw Error('Import would exceed the 100-session notebook limit.');for(const s of incoming){s.id=uid();s.name=(s.name.slice(0,108)+' (imported)').slice(0,120);}state.sessions.push(...incoming);state.active=incoming[0].id;save();navigate('notebook');toast(`Imported ${incoming.length} session${incoming.length===1?'':'s'} as copies.`);}catch(err){toast(err.message||'Could not read that notebook.');}finally{e.target.value='';}});
window.addEventListener('popstate',()=>{filter='All';localQuery='';readHash();});
readHash();save();

</script>
