 blend."}, {"label": "Output margin", "start": "No clipping", "adjust": "Leave useful peak margin. A number such as −6 dBFS is a convenient working margin, not a tone requirement."}], "listen": {"better": "The main idea is clear before you add processing. Muting any aux has the effect you expected.", "tooFar": "The track gets louder because it reaches the mix twice, or a routing loop creates rising feedback."}, "deep": [{"title": "An insert, a send, and an output", "text": "An insert processes audio along its main path. A send branches off a controllable amount. An output points the main path toward its next destination. Draw those paths if the mixer feels confusing."}, {"title": "Pre or post?", "text": "A post-fader send follows source fader changes; post-pan also follows its pan. A pre-fader send stays independent of the source fader. Post-fader or post-pan is a useful starting choice for reverb that should follow vocal rides."}, {"title": "One chain is not a requirement", "text": "Correction, tone, control, and effects are jobs. Use only the jobs this recording needs. EQ and de-essing can occur before or after compression for different reasons."}], "exercise": "Sophia traces the dry vocal path aloud; her mentor traces the reverb path. Swap roles and explain what happens when the vocal fader moves.", "checklist": ["Project and audio backed up", "One priority and reference chosen", "Dry and effect paths traced", "Fader-only rough balance saved"], "sources": ["routing"]}, {"id": "record", "title": "Get the sound before the plug-ins", "short": "Recording & monitoring", "goal": "Capture a performance with room to breathe, intelligible words, and dependable monitoring.", "why": "Placement, room sound, and performance consistency often change the result more than an elaborate chain. Fixing a distorted recording or a loud room reflection later is much harder than moving the microphone now.", "where": "Audio track input · interface gain · Logic Pro > Settings/Preferences > Audio > Devices", "steps": [{"title": "Listen to the room", "text": "Record ten seconds of room tone and a verse. Hear fans, traffic, reflections, and headphone spill. Change position or reduce the noise source before reaching for a gate."}, {"title": "Choose a position by listening", "text": "For a close vocal, try a pop filter and roughly 15–25 cm between mouth and mic as a comparison point. Try farther away and a little off-axis. Choose what suits the voice and room; mic type matters."}, {"title": "Set hardware gain on the loud part", "text": "Ask for the loudest expected line. Leave generous headroom at the interface and in the recorded signal. Turning down the Logic fader cannot repair a clipped mic preamp or converter."}, {"title": "Make monitoring comfortable", "text": "Use wired headphones for tracking. If monitoring through Logic feels late, lower the I/O buffer or use Low Latency Mode. If using interface direct monitoring, avoid hearing a second delayed copy through Logic."}, {"title": "Capture choices", "text": "Record complete musical phrases and a few alternate takes. Keep a consistent distance and label standout performances. Confirm the recorded take plays cleanly before moving on."}], "params": [{"label": "Recorded peaks", "start": "Try −18 to −10 dBFS", "adjust": "A practical rehearsal range, not a minimum. Leave more margin for unpredictable performers; never chase 0 dBFS."}, {"label": "Buffer while tracking", "start": "Try 64 or 128 samples", "adjust": "Use the lowest stable size for your computer; raise it if you hear dropouts."}, {"label": "Mic position", "start": "Compare two distances", "adjust": "Choose the better balance of body, plosives, room, and consistency rather than memorizing inches."}], "listen": {"better": "A relaxed performance, clear consonants, and a room sound you can work with.", "tooFar": "Clipped peaks, headphone doubling, booming close words, or audible room reflections that dominate the voice."}, "deep": [{"title": "Monitoring is not the recorded sound", "text": "Some effects are only on the playback path, while hardware processing may be printed. Know which is happening before committing. Low Latency Mode can bypass delay-producing plug-ins and change what the performer hears."}, {"title": "Proximity and plosives", "text": "Directional microphones can become bassier up close. A burst of air on P or B is a different problem from ordinary vocal body. Distance, angle, and a pop filter address the source."}, {"title": "More bits are not more emotion", "text": "At 24-bit recording, there is no musical reward for recording dangerously close to full scale. Choose the project sample rate for the production and keep it consistent."}], "exercise": "Record the same line twice at different distances with hardware gain adjusted to avoid clipping. Match playback loudness, then compare room, bass, and clarity.", "checklist": ["Loudest line tested without clipping", "One monitoring path chosen", "Room and mic position auditioned", "Alternate takes labeled"], "sources": ["latency"]}, {"id": "edit", "title": "Keep the performance; remove distractions", "short": "Comp & cleanup", "goal": "Build a convincing take, then remove noises and edits that interrupt it.", "why": "A technically perfect word can still be the wrong musical choice. Choose phrasing and emotional continuity first; edit noises second. Breaths, consonants, and spaces are part of the performance.", "where": "Take folders · Quick Swipe Comping · Region inspector > Gain · region fades", "steps": [{"title": "Comp in phrases", "text": "Choose complete phrases where possible. Compare transitions for tone, energy, and distance from the mic. Keep the source takes available when you commit the comp."}, {"title": "Find distraction, not silence", "text": "Listen in solo to locate clicks and thumps, then in the mix to decide which matter. Lower an over-loud breath; keep a useful inhale or expressive consonant."}, {"title": "Shape edits", "text": "Cut in a quiet moment when possible. Add short fades or crossfades and listen for a click, missing consonant, or smeared timing."}, {"title": "Repair a plosive locally", "text": "Try lowering just the burst or applying a localized low-frequency reduction. A long fade across the whole word may remove the consonant; check the start in context."}, {"title": "Use gates selectively", "text": "For isolated close drums or a clean rhythmic effect, a gate can help. For quiet vocal endings and uneven room noise, manual gain or a gentle expander may sound more natural."}], "params": [{"label": "Edit fades", "start": "Try 3–15 ms", "adjust": "Lengthen for a smoother join; shorten if attacks blur. Timing and waveform matter more than a fixed duration."}, {"label": "Distracting breath", "start": "Try −2 to −6 dB", "adjust": "Reduce only enough to restore the phrase. Some breaths should stay unchanged."}, {"label": "Noise between phrases", "start": "Reduce as needed", "adjust": "A fade into consistent room tone may be less distracting than abrupt silence."}], "listen": {"better": "You notice the lyric and emotional arc, not the location of the edits.", "tooFar": "Swallowed consonants, abrupt dead gaps, doubled syllables, or a comp that changes vocal tone every word."}, "deep": [{"title": "Why clicks happen", "text": "A sudden waveform discontinuity can create a broad-band click. Fades smooth the transition. A tiny crossfade is not a guarantee: audition the edit at normal speed."}, {"title": "Bleed changes editing choices", "text": "Live vocals with drum or guitar bleed cannot be moved freely without moving that spill too. Check the full band for flams or changes in room sound."}, {"title": "Preserve decisions", "text": "Make a recoverable version before flattening or rendering edits. Keep a short note about why a take was chosen so the next engineer can follow the intent."}], "exercise": "Each person comps one short phrase. Compare without revealing whose is whose; discuss delivery and continuity before discussing pitch.", "checklist": ["Comp approved in context", "Distracting noises addressed", "Edits checked at normal speed", "Original takes preserved"], "sources": []}, {"id": "arrange", "title": "Give every part a job", "short": "Arrangement & balance", "goal": "Create space by deciding what matters, what supports it, and what can step back.", "why": "Masking is not always an EQ problem. Two parts playing the same rhythm and register at the same level compete even when both sound great alone. Arrangement, register, rhythm, and level are powerful mixing tools.", "where": "Tracks area · Mixer faders and pan · Mute · arrangement markers", "steps": [{"title": "Name the focus", "text": "For each section, choose the voice or instrument that tells the story. A verse, chorus, instrumental break, and outro can have different priorities."}, {"title": "Build from the foundation", "text": "Balance the groove or main harmonic instrument, then add the lead. Introduce supporting parts one at a time at a level where their role is clear."}, {"title": "Test a mute", "text": "If a line is buried, mute a competing part for one phrase. If clarity returns, decide whether that part needs a quieter level, different rhythm, different register, or a brief absence."}, {"title": "Place in stereo", "text": "Pan to separate supporting parts, but check mono so essential information survives. A duplicated mono recording panned left and right is still the same performance; it does not become a true double."}, {"title": "Protect the section change", "text": "A chorus can lift with new texture, wider supporting layers, or changed rhythm. Simply pushing every fader up may just hit the limiter harder."}], "params": [{"label": "Level decisions", "start": "Try 1 dB moves", "adjust": "Small relative changes are easy to evaluate; make larger changes when the role is clearly wrong."}, {"label": "Stereo placement", "start": "Choose by role", "adjust": "Keep essential low-end and lead elements stable if the production calls for it; there is no mandatory pan map."}, {"label": "Density", "start": "One part at a time", "adjust": "A missing layer can create more impact than another processor."}], "listen": {"better": "You can point to the musical focus, and the section changes feel intentional.", "tooFar": "Everything demands attention, or the chorus becomes louder without becoming more exciting."}, "deep": [{"title": "Foreground and background", "text": "Level, brightness, transient detail, and dry-to-reverb ratio all influence perceived distance. Change one first so you understand why a part moved."}, {"title": "When you cannot change the arrangement", "text": "With a fixed stereo instrumental, your options are more limited. Ask for stems if available; use small vocal rides and restrained tonal moves before reshaping the entire backing track."}], "exercise": "Make two 20-second rough balances: one with every layer, one with one supporting layer muted. Match overall loudness and decide which tells the story.", "checklist": ["Section focus named", "Competing parts identified", "Stereo and mono balance checked", "One arrangement experiment compared"], "sources": []}, {"id": "pitch", "title": "Choose natural, polished, or deliberately tuned", "short": "Pitch & timing", "goal": "Correct what distracts while preserving the style of the performance.", "why": "Pitch is a musical relationship, not just a centered graphic. Scoops, blue notes, vibrato, bends, and the tuning of the instruments all change what sounds right. Decide the intended effect before correcting.", "where": "Show Flex (Command-F by default) · Flex Pitch · Audio Track Editor", "steps": [{"title": "Keep the original", "text": "Create a track alternative or duplicate before processing. Work on an isolated melodic voice; pitch detection on chords, a full mix, or heavy bleed may be unreliable."}, {"title": "Confirm the musical target", "text": "Listen against the harmony. Check the key and any borrowed notes rather than forcing every note into one scale."}, {"title": "Make one small correction", "text": "Use fine pitch for a small offset. Treat a sustained drift separately from the note center. Keep meaningful vibrato and transitions unless a stylized effect is wanted."}, {"title": "Check timing by feel", "text": "Line up obvious late words when needed. Preserve intentional laid-back phrasing and swing. Align harmony consonants only enough to make the ensemble speak together."}, {"title": "Compare and recover", "text": "Bypass Flex to compare the full phrase at matched level. If a repair turns watery or metallic, reduce it, improve note boundaries, or choose another take."}], "params": [{"label": "Natural correction", "start": "Selected notes only", "adjust": "Try the smallest move that resolves the distraction; there is no required correction percentage."}, {"label": "Hard-tuned effect", "start": "Intentional fast correction", "adjust": "Use Pitch Correction with a verified scale as an effect, then audition every transition."}, {"label": "Timing edits", "start": "Keep the groove", "adjust": "A syllable can look late and still feel right. Check against kick, snare, and phrase intent."}], "listen": {"better": "The melody feels secure and the singer still sounds like the singer—or the chosen effect sounds deliberate.", "tooFar": "Robotic transitions you did not intend, altered vowels, metallic tails, or a lifeless rhythm."}, "deep": [{"title": "The six Flex Pitch hotspots", "text": "Upper left: incoming pitch drift. Upper middle: vibrato. Upper right: outgoing pitch drift. Lower left: gain. Lower middle: fine pitch. Lower right: formant shift. The original desk reversed the two middle labels; these are corrected."}, {"title": "Pitch and formants", "text": "Pitch is the note; formants help shape the vowel character. Large shifts can change both the perceived identity and clarity. Leave formant controls alone until you hear a reason to adjust them."}, {"title": "Editing an ensemble", "text": "Avoid treating a choir or stereo ensemble as one monophonic vocal. Work with individual tracks if you have them; otherwise a better take may be the cleanest solution."}], "exercise": "Pick one uncertain note. Compare unchanged, gently corrected, and heavily corrected versions inside the same phrase. Describe what improved and what was lost.", "checklist": ["Original retained", "Harmony and intended style checked", "Edits auditioned in context", "Artifacts checked"], "sources": ["pitch"]}, {"id": "level", "title": "Feed the chain a manageable performance", "short": "Gain & manual leveling", "goal": "Control distracting level changes before the compressor, then leave room for musical dynamics.", "why": "Region gain changes how hard the following processors are driven. A normal channel fader is later in the path, so it usually changes the processed balance instead. Use the right control for the job.", "where": "Region inspector > Gain · Utility > Gain · channel meters", "steps": [{"title": "Listen without the chain", "text": "Find words that leap out or disappear even before compression. Compare the verse and chorus; some contrast may be intentional."}, {"title": "Adjust the outliers", "text": "Split or isolate a phrase carefully, change its region gain, and use fades where needed. Avoid flattening every syllable to an identical apparent size."}, {"title": "Check the processor input", "text": "After edits, play the loudest and quietest parts. Use Gain ahead of the chain if needed to keep input levels sensible; inspect any processor that can distort."}, {"title": "Restore processing", "text": "Re-enable processors one at a time and set thresholds again. Pre-compressor gain edits change how much compression happens."}, {"title": "Leave final rides for later", "text": "Once the sound is settled, use automation to place words against the changing accompaniment."}], "params": [{"label": "Phrase correction", "start": "Try 1–4 dB", "adjust": "An audition range for obvious outliers, not a limit or required move."}, {"label": "Track input level", "start": "Clean and consistent enough", "adjust": "No single average dBFS value makes every stock plug-in work best."}, {"label": "Meter type", "start": "Know peak vs loudness", "adjust": "Peaks report brief maxima; average energy and perceived loudness answer different questions."}], "listen": {"better": "Quiet words are easier to follow and the compressor no longer overreacts to a few syllables.", "tooFar": "Every line has the same intensity, breaths become huge, or a loud chorus loses its emotional lift."}, "deep": [{"title": "Why −18 is not magic", "text": "Some analog-style models or third-party tools use a nominal calibration near a given level. That does not make −18 dBFS a universal target for Logic processing. Listen, read the meter, and check the specific plug-in."}, {"title": "A useful order", "text": "Fix a few extreme input differences first, set compression next, and ride the processed result against the mix afterward. Revisit the early steps if later processing exposes a problem."}], "exercise": "Level three phrases by hand, then compare how one compressor responds before and after. Keep the output equally loud.", "checklist": ["Outlier phrases addressed", "Intentional dynamics preserved", "Processor inputs checked", "Compression thresholds revisited"], "sources": []}, {"id": "eq", "title": "Shape tone without losing the voice", "short": "EQ & masking", "goal": "Choose a frequency move because of a sound you hear, then prove that it helped.", "why": "EQ changes the balance of frequencies. A high-pass filter can remove rumble but also remove body. A presence boost may reveal words or exaggerate an abrasive microphone. Diagnose in the mix before drawing a familiar curve.", "where": "Audio FX > EQ > Channel EQ", "steps": [{"title": "Name the problem", "text": "Use a plain description: boomy on low notes, hollow, boxy, sharp, dull, or buried by the guitar. Decide whether it happens constantly or only on specific words."}, {"title": "Start flat", "text": "Compare one band at a time. If low rumble is present, raise a high-pass filter slowly and back off before the wanted voice loses weight."}, {"title": "Find the relevant band", "text": "Sweep at modest listening level if necessary, then return the boost to zero and try a small cut. A huge resonant boost makes almost any frequency sound unpleasant."}, {"title": "Choose the width", "text": "Use a broad band for a tonal tilt and a narrower band for a persistent resonance. A higher bell-filter Q means a narrower affected range."}, {"title": "Match and compare", "text": "Match the active and bypassed loudness. Check a low note, loud note, consonant-heavy phrase, and the full arrangement before keeping the move."}], "params": [{"label": "High-pass audition", "start": "Try 50–100 Hz first", "adjust": "Only if rumble exists. Voice range, proximity, and arrangement may call for lower, higher, or no filter."}, {"label": "Broad tonal move", "start": "Try ±1–3 dB, Q near 0.7–1.5", "adjust": "Adjust width and frequency by listening; the analyzer is evidence, not a required shape."}, {"label": "Intermittent problem", "start": "Edit or automate first", "adjust": "A permanent cut can thin all the good words to fix one bad word."}], "listen": {"better": "The part fits the arrangement while retaining the qualities you like.", "tooFar": "Thin vowels, missing chest tone, a hollow midrange, or clarity that becomes sharpness when played louder."}, "deep": [{"title": "Useful search zones, not prescriptions", "text": "About 100–250 Hz can hold body and boom; 250–600 Hz can hold warmth and boxiness; 1–2 kHz can sound nasal or present; 2–5 kHz often affects intelligibility and bite; 5–10 kHz can expose sibilance; higher shelves can suggest air. Boundaries overlap and depend on the source."}, {"title": "Before or after compression?", "text": "An EQ cut before compression changes what triggers the detector. EQ afterward reshapes the controlled signal. Try both when a low-frequency burst drives unwanted compression."}, {"title": "Static versus dynamic", "text": "Static EQ always applies its curve. Dynamic EQ changes a band with level; multiband compression controls wider frequency bands. If a tool is unavailable, word-level gain, EQ automation, or arrangement changes can still solve the problem."}], "exercise": "Make one broad cut, loudness-match it, and let your partner switch it on and off without telling you. Keep it only if the improvement repeats.", "checklist": ["Problem described before adjusting", "One band compared at a time", "Active/bypass level matched", "Low and loud notes rechecked"], "sources": ["eq"]}, {"id": "compress", "title": "Control motion, not just meters", "short": "Compression", "goal": "Shape peaks, sustain, and consistency while keeping the groove and vocal delivery.", "why": "A compressor turns down signal according to its detector and settings. Make-up gain can then bring the result up. The combination can make quiet detail feel closer, but it can also bring up breath, spill, and room noise.", "where": "Audio FX > Dynamics > Compressor", "steps": [{"title": "Choose one job", "text": "Decide whether you need peak control, smoother phrases, more density, or audible pumping. Try one compressor before stacking two."}, {"title": "Set a simple starting point", "text": "Use a clean model to learn. Turn Auto Gain off so loudness does not disguise the result. Start with a moderate ratio and lower threshold until the problem is controlled."}, {"title": "Listen to the front of words", "text": "Try faster and slower attack. Fast response can catch peaks but soften consonants; slower response lets more initial energy pass."}, {"title": "Listen between words", "text": "Adjust release so gain returns at a useful pace. Too slow can hold down the next phrase; very fast settings can exaggerate motion or distortion."}, {"title": "Match output and decide", "text": "Set Make Up or output for similar perceived loudness when bypassed. Add a second stage only if it solves a separate remaining problem."}], "params": [{"label": "Learning range", "start": "2:1–4:1 ratio", "adjust": "Try a few dB of reduction on stronger phrases. A gain-reduction meter is not a quality score."}, {"label": "Attack experiment", "start": "5–30 ms", "adjust": "Compare consonants and transient impact. Different models react differently at the same value."}, {"label": "Release experiment", "start": "60–200 ms or Auto", "adjust": "Listen to the phrase and tempo. Avoid forcing release to a rhythmic value merely because it calculates neatly."}], "listen": {"better": "The part stays where you put it, with a sense of movement that suits the music.", "tooFar": "Flattened expression, sucking room tone, dull word attacks, gritty sustained notes, or louder breaths."}, "deep": [{"title": "Threshold, ratio, knee", "text": "Threshold sets the level region where compression engages; ratio determines the input/output slope above it. A soft knee eases the transition around threshold. At steady state with a hard knee, 8 dB above threshold at 4:1 becomes 2 dB above threshold before make-up gain."}, {"title": "Attack is not a waiting timer", "text": "Attack describes how quickly reduction builds; release describes how quickly it relaxes. Real behavior depends on the detector, knee, model, and incoming sound. The lab shows only a simplified steady-state curve."}, {"title": "Serial and parallel", "text": "Serial compression feeds one stage into the next, perhaps for peaks then slower leveling. Parallel compression blends a processed path with a dry one for density. Both require level matching and a clear reason."}, {"title": "Side-chain thinking", "text": "The detector can listen to a different track or a filtered version of the signal. A kick can trigger bass ducking; a vocal can trigger reverb ducking. The side-chain trigger is not itself added to the processed audio."}], "exercise": "Loop a phrase. Set an exaggerated amount temporarily to hear attack and release, then reduce it to the smallest useful amount. Compare at equal loudness.", "checklist": ["Compressor has a named job", "Attack and release auditioned", "Make-up level matched", "Quiet and loud sections checked"], "sources": ["compress", "compress-use"]}, {"id": "deess", "title": "Keep consonants clear and comfortable", "short": "Sibilance & harshness", "goal": "Tame sharp S and SH sounds without removing the articulation of the singer.", "why": "Sibilance is brief high-frequency energy, while harshness can be a sustained upper-midrange problem. They need not share a treatment. Start by deciding which you hear.", "where": "Audio FX > Dynamics > DeEsser 2 · or word-level region gain", "steps": [{"title": "Find a representative phrase", "text": "Loop a line with both sibilants and ordinary vowels. Include a softer line too; a fix for one loud S should not dull all quiet words."}, {"title": "Locate the detector range", "text": "Use Filter Solo to locate the objectionable sound, then turn solo off. Do not choose frequency only from the singer’s gender or pitch range."}, {"title": "Set detection and limit", "text": "Relative mode is a useful first audition. Set Threshold so reduction follows the unwanted sounds; set Max Reduction to limit how much can be removed."}, {"title": "Compare range behavior", "text": "Try Split for a limited affected band or Wide for broader attenuation. Judge the result with full-band playback, not only the isolated detector."}, {"title": "Recheck later in the chain", "text": "Brightness boosts, saturation, and compression can bring the issue back. Change their settings or add a lighter later pass only when needed."}], "params": [{"label": "Search region", "start": "Often roughly 5–10 kHz", "adjust": "Explore outside it if the sound calls for it; the actual voice and mic decide."}, {"label": "Initial reduction", "start": "Try 1–3 dB on sibilants", "adjust": "Increase only if needed. Max Reduction is a ceiling, not the amount that always happens."}, {"label": "One stubborn consonant", "start": "Local gain edit", "adjust": "A targeted move can avoid dulling the rest of the take."}], "listen": {"better": "Words remain crisp while the sharp consonants stop jumping forward.", "tooFar": "A lisp, dull vowels, missing breath texture, or the whole phrase dropping around an S."}, "deep": [{"title": "Place by cause", "text": "Before a compressor, de-essing can stop bright bursts from triggering it. After brightening or saturation, it catches new emphasis. There is no mandatory single insert position."}, {"title": "Older Logic installations", "text": "DeEsser 2 arrived in Logic 10.4.5. If yours lacks it, use the available legacy DeEsser or manual edits; its controls will differ."}], "exercise": "Find a line without sibilance and compare processed to bypassed. If its vowels change, adjust detection or reduce the amount.", "checklist": ["Sibilance separated from harshness", "Filter Solo turned off", "Vowels stay intact", "Quiet line checked"], "sources": ["deess"]}, {"id": "tone", "title": "Add character with a purpose", "short": "Tone & saturation", "goal": "Choose clarity, warmth, edge, or texture without confusing louder with better.", "why": "Tone shaping emphasizes qualities you want. Saturation adds harmonics and can change peaks; it is not a repair for a clipped recording. A small amount can help a part be heard, while too much adds fizz, harshness, or a smaller sound.", "where": "Channel EQ · Compressor distortion options · optional newer color tools", "steps": [{"title": "State the intention", "text": "Choose one quality to change: more body, more diction, more air, more grit, or a deliberately restricted bandwidth."}, {"title": "Try broad tone first", "text": "Use a shelf or broad bell. Add only enough to hear the intended benefit in the mix; inspect low notes and sibilants again."}, {"title": "Audition color separately", "text": "Use a stock color tool you have. Start with low drive, keep the listening level comfortable, and compare with output loudness matched."}, {"title": "Preserve a clean alternative", "text": "For aggressive distortion or lo-fi effects, try a parallel path or a separate duplicate with a clearly named role."}, {"title": "Check the quieter playback", "text": "Color that sounds exciting alone can disappear or become abrasive against cymbals, guitars, and synths."}], "params": [{"label": "Broad EQ audition", "start": "Try ±1–2 dB", "adjust": "Small changes accumulate across the chain. Reduce an earlier move if later processing repeats it."}, {"label": "Drive", "start": "Start low; match output", "adjust": "Percentages are not portable between models or plug-ins."}, {"label": "Parallel blend", "start": "Bring up from silence", "adjust": "Stop when the desired texture appears; compare against the dry version at a similar total level."}], "listen": {"better": "The voice carries the intended character and still belongs in the record.", "tooFar": "Fuzzy S sounds, brittle upper mids, weakened punch, or warmth that is actually a build-up of mud."}, "deep": [{"title": "A color tool is optional", "text": "Channel EQ and Compressor can teach the core decisions. ChromaGlow is a newer option requiring Logic 11 or later on Apple silicon; you do not need it to make a strong vocal mix."}, {"title": "Harmonics and small speakers", "text": "Added harmonics can help a bass or low voice remain perceptible on small speakers, but this does not restore missing sub-bass. Check the whole arrangement, not just a solo effect."}], "exercise": "Create clean, subtle, and obvious color versions. Loudness-match them and choose based on the song rather than which is most impressive in solo.", "checklist": ["Desired character named", "Output level matched", "Sibilance and low notes rechecked", "Clean alternative retained"], "sources": ["chroma"]}, {"id": "space", "title": "Place the singer in a believable—or invented—space", "short": "Reverb & delay", "goal": "Choose depth, width, and rhythmic echoes while preserving the words.", "why": "Reverb suggests a surrounding space; delay repeats material at a recognizable interval. You can create intimacy with a short room, drama with a long tail, or rhythmic motion with selective echoes. The dry signal and effects share the same attention budget.", "where": "Send to an aux · Reverb > ChromaVerb / Space Designer · Delay > Tape Delay / Stereo Delay", "steps": [{"title": "Start with one space", "text": "Put a reverb on an aux, fully wet. Bring up the send from silence while the whole mix plays. Decide whether the effect is ambience or an audible feature."}, {"title": "Shape the time", "text": "Change decay for tail length and predelay for separation from the original. A longer predelay can keep words distinct, but too much sounds like a separate echo."}, {"title": "Filter the return", "text": "Reduce low-frequency build-up or high-frequency hiss on the return. Compare the actual tail after a phrase; do not blindly copy a return-EQ preset."}, {"title": "Add rhythmic delay selectively", "text": "Use synced quarter, eighth, dotted, or triplet notes as an audition. Keep feedback modest at first and automate only the words you want repeated."}, {"title": "Make room when necessary", "text": "If a beautiful tail masks the next line, lower the send, shorten decay, or place Compressor after the reverb and feed its side chain from the vocal for gentle ducking."}], "params": [{"label": "Short ambience", "start": "Try 0.3–1.0 s", "adjust": "Useful for a close room impression; source, algorithm, and tempo alter the result."}, {"label": "Audible tail", "start": "Try 1.2–2.5 s", "adjust": "A ballad or ambient production may need much longer; dense fast music may need less."}, {"label": "Predelay audition", "start": "Try 10–60 ms", "adjust": "Listen for clarity versus an unwanted gap. No single value guarantees a forward vocal."}, {"label": "Delay feedback", "start": "Try 10–25%", "adjust": "Algorithm-dependent. Raise carefully; feedback can build dramatically."}], "listen": {"better": "Space supports the phrasing; muting it reveals what it contributes.", "tooFar": "The singer recedes unintentionally, syllables overlap, low end clouds up, or sibilants splash around the mix."}, "deep": [{"title": "Damping versus output EQ", "text": "In ChromaVerb, damping changes how different frequencies decay. Output EQ changes the final tone. They can both make a reverb darker, but they do different jobs."}, {"title": "Ducking is a musical envelope", "text": "Use a vocal-triggered compressor on the effect return. Let it recover in gaps so the tail appears there. Match its output and disable unintended make-up gain so ducking really lowers the return."}, {"title": "Tempo is a starting point", "text": "Quarter-note milliseconds equal 60,000 divided by BPM. Dotted notes are 1.5 times the straight value; triplets are two-thirds. Decay does not need to equal any of them."}], "exercise": "Build an intimate version and a spacious version of one phrase using the same dry vocal. Change one setting at a time and describe which cue moved it back.", "checklist": ["Return fully wet", "Decay and predelay judged in context", "Return tone checked", "Tail into next phrase checked"], "sources": ["reverb", "routing"]}, {"id": "harmony", "title": "Make layers work as an ensemble", "short": "Doubles & harmonies", "goal": "Decide which layers reinforce the lead and which deserve their own spotlight.", "why": "A soft supporting harmony, a gospel response, a rock unison, and a co-lead duet are different arrangements. Their level, timing, brightness, and width should follow that role.", "where": "Individual vocal tracks · summing stack or BGV aux · pan and sends", "steps": [{"title": "Assign roles", "text": "Label true doubles, unison support, harmony lines, ad-libs, responses, and co-leads. Do not force every non-lead track into the background."}, {"title": "Align speech when needed", "text": "Listen to word starts, S sounds, and phrase endings. Tighten distracting flams but retain enough variation for the intended ensemble character."}, {"title": "Balance before processing", "text": "Bring up each line until its contribution is clear. Listen for a harmony that steals the melody or an important response that needs to be heard."}, {"title": "Choose tone and position", "text": "Supporting layers may need less presence or more reverb; featured lines may need clarity equal to the lead. Pan complementary parts and check the ensemble in mono."}, {"title": "Use group processing lightly", "text": "A BGV bus offers shared level and tone control. Individual outliers are often better fixed before the bus rather than making the whole ensemble react."}], "params": [{"label": "Support level", "start": "Raise from silence", "adjust": "Stop at the intended role; a fixed “dB below lead” ignores performance and arrangement."}, {"label": "Group compression", "start": "Try 1–2 dB if needed", "adjust": "Use it for shared movement, not to repair one very loud harmony."}, {"label": "Width", "start": "Real takes + intentional pan", "adjust": "Identical copies do not create performance variation; delay-based width can change in mono."}], "listen": {"better": "The stack supports the story, with clear lyrics and a believable sense of togetherness.", "tooFar": "Flammed consonants, a blurred melody, detached wide layers, or a harmony that vanishes in mono."}, "deep": [{"title": "A double is a performance", "text": "A second take varies in pitch, timing, and tone. Duplicating one file mainly increases its level until you introduce processing; artificial delays can produce comb filtering when summed."}, {"title": "Duets and choirs", "text": "Co-leads may both need to be forward and intelligible. A choir may need coherent room and broad dynamic shape more than intense editing of every voice."}], "exercise": "Compare the stack with natural timing and with tighter consonants. Ask which version better matches the genre and lyric.", "checklist": ["Every layer has a role", "Consonants and endings checked", "Lead hierarchy intentional", "Mono balance checked"], "sources": []}, {"id": "instruments", "title": "Make space across the whole band", "short": "Instrument interactions", "goal": "Balance the instruments around the musical focus without hollowing out the arrangement.", "why": "The best place for a vocal can change as guitars, keys, drums, and bass enter. Avoid solving every overlap with permanent cuts on every instrument. Sometimes only one section needs a change.", "where": "Channel EQ · Compressor side chain · groups and buses · track automation", "steps": [{"title": "Locate the collision", "text": "Loop a buried phrase and mute likely competitors one at a time. Bring each back and decide whether the conflict is level, register, rhythm, stereo placement, or tone."}, {"title": "Keep the foundation coherent", "text": "Balance kick and bass together at low volume. Choose which carries deep weight and which supplies definition; recheck notes across the song."}, {"title": "Protect transient relationships", "text": "Judge drums with overheads and room microphones. Polarity and timing changes can alter the whole kit. Avoid aligning every waveform peak just because you can."}, {"title": "Carve only what is necessary", "text": "Try a small broad move on the actual competing instrument. If the conflict happens only while the singer sings, consider automation instead of a permanent hole."}, {"title": "Use ducking carefully", "text": "For a vocal-triggered instrument compressor, start with subtle reduction. It lowers the whole signal unless you specifically use frequency-selective processing."}], "params": [{"label": "Masking experiment", "start": "Try −1 to −2 dB", "adjust": "On the competing part or range, then recheck its own important moments."}, {"label": "Subtle full-band duck", "start": "Try 1–2 dB reduction", "adjust": "Increase only for a chosen effect; hear the return between phrases."}, {"label": "Low-end choices", "start": "Compare notes, not one hit", "adjust": "Bass fundamentals and kick tone vary. A frequency chart cannot assign ownership for the whole song."}], "listen": {"better": "The words or lead line stay clear and the band retains energy when the singer stops.", "tooFar": "Hollow instruments, audible level dips, disappearing kick/bass in mono, or cymbals that dominate every chorus."}, "deep": [{"title": "Acoustic and electric guitars", "text": "Listen for acoustic body versus vocal body and pick attack versus diction. Distorted electrics are already dense; reduce unnecessary layers or level before adding more compression."}, {"title": "Piano and keyboards", "text": "A piano can span nearly the whole spectrum. Decide its register and role. Stereo balance may favor one side of the keyboard; use Stereo Pan thoughtfully if repositioning the full stereo image."}, {"title": "Pads, synths, and strings", "text": "Sustained layers can mask the space between vocal syllables. Reduce level in sung sections, shorten release, or alter the arrangement. High-passing every layer aggressively may remove the warmth you wanted."}, {"title": "Drums and percussion", "text": "Kick and snare carry impact, while cymbals and shakers can compete with consonants. Control the offending element instead of making the vocal progressively brighter."}, {"title": "Brass and winds", "text": "Their strongest midrange energy can overlap a singer. Automate responses forward in gaps and back during words. Preserve breath and attack when they are part of the style."}, {"title": "Bass and 808s", "text": "Check pitch, note length, distortion, and kick overlap together. Side-chain ducking cannot fix an out-of-tune 808 or a note that sustains through every change."}, {"title": "A supplied stereo beat", "text": "Request stems when deeper changes are needed. Small EQ or gain automation may help, but broad changes to the entire beat affect drums, bass, and instruments at once."}], "exercise": "Find one masked word. Try three separate fixes: vocal up, competing part down, small EQ on the competitor. Loudness-match the comparisons and choose the least damaging fix.", "checklist": ["Main competitor identified", "Kick and bass checked together", "Instrument-only sections preserved", "Mono interaction checked"], "sources": ["pan"]}, {"id": "automation", "title": "Make the mix follow the song", "short": "Automation & movement", "goal": "Keep the important details audible as the arrangement and performance change.", "why": "Static settings solve static problems. Automation lets the mix respond to a quiet word, a new guitar layer, a chorus, or an expressive held note. Small contextual moves can do more than another compressor.", "where": "Automation view (A by default) · parameter menu · Read / Touch / Latch", "steps": [{"title": "Choose the parameter", "text": "Use volume for placement, send level for effect amount, or a plug-in parameter for a local change. Check whether you are editing track or region automation."}, {"title": "Work a short section", "text": "At modest playback volume, bring forward lost word endings and soften distracting jumps. Draw ramps rather than abrupt steps unless the effect calls for a jump."}, {"title": "Ride the relationship", "text": "If a guitar only masks one line, lower it there. Let featured instruments or responses emerge in the gaps."}, {"title": "Automate effects musically", "text": "Open a delay send for one word, then return it down before the next. Let a long reverb bloom on a held note while keeping a busy verse clearer."}, {"title": "Return to Read", "text": "After writing a pass, put the track in Read and play the full section. Verify that later playback does not overwrite the moves."}], "params": [{"label": "Small vocal rides", "start": "Try ±0.5–2 dB", "adjust": "More may be necessary; follow audibility and expression."}, {"label": "Touch mode", "start": "Returns to existing moves after release", "adjust": "A useful way to refine a short gesture."}, {"label": "Latch mode", "start": "Keeps writing the last touched value", "adjust": "Stop playback deliberately; it can overwrite more than expected."}], "listen": {"better": "Phrases remain intelligible and transitions feel like the song grew naturally.", "tooFar": "Jumpy syllables, effects leaking into the next line, faders fighting your moves, or a constant chorus that never relaxes."}, "deep": [{"title": "Why the fader snaps back", "text": "Existing Read automation reasserts its value during playback. Edit the curve, use relative/trim automation where appropriate, or use a downstream group fader for an overall change."}, {"title": "Automation is not a substitute for all preparation", "text": "Large repeated rides may reveal poor comping, unchecked region levels, or an arrangement conflict. Revisit the cause rather than drawing hundreds of corrective points."}], "exercise": "Each person rides the same verse. Compare which words they chose to emphasize, then keep the version that best communicates the lyric.", "checklist": ["Quiet words remain audible", "Effects return after throws", "Automation in Read", "Full section replayed"], "sources": ["automation"]}, {"id": "reference", "title": "Check what survives outside your speakers", "short": "References & translation", "goal": "Compare fairly, hear the mix in different conditions, and turn observations into one useful change.", "why": "Our ears tend to favor a louder example. A mastered reference needs playback adjustment before it can teach you about balance, space, or tone. Reference the goal, not an identical curve.", "where": "Reference audio track · Utility > Gain for mono check · Level/Loudness Meter as available", "steps": [{"title": "Choose relevant comparisons", "text": "Use two or three recordings for specific qualities: vocal placement, bass relationship, or ambience. Choose similar sections and arrangement density."}, {"title": "Match playback loudness", "text": "Turn the reference down to a comparable perceived level. Confirm it does not pass through extra mix-bus processing intended only for your mix."}, {"title": "Ask one question", "text": "Compare vocal-to-band level, low-end weight, brightness, or depth one at a time. Take a short note rather than changing four processors immediately."}, {"title": "Check multiple conditions", "text": "Listen quietly, in mono, on headphones, and on a small speaker if available. Compare the same passage and identify a pattern instead of chasing every device."}, {"title": "Rest and decide", "text": "Take a break before an important approval. Agree on one high-priority change and compare it against a saved version."}], "params": [{"label": "Reference gain", "start": "Adjust by ear; meter can assist", "adjust": "A fixed −6 dB adjustment will not match every master to every mix."}, {"label": "Mono check", "start": "Temporary Gain > Mono", "adjust": "Reset it before stereo export. Listen for essential losses, not identical stereo spaciousness."}, {"label": "Listening level", "start": "Comfortable and repeatable", "adjust": "Brief changes in level can reveal balance; avoid using sustained loud playback to feel excitement."}], "listen": {"better": "The emotional hierarchy survives even when the speaker cannot reproduce all the bass or width.", "tooFar": "A vocal only works on one system, mono loses key parts, or every reference comparison triggers random changes."}, "deep": [{"title": "Mono is diagnostic", "text": "Stereo reverbs often change when summed, but severe cancellations should be investigated. Raising the reverb send may amplify the problem rather than solve it."}, {"title": "Room versus mix", "text": "A bass note that changes drastically when you move your head may be a room or monitoring problem. Cross-check headphones before rewriting the low end."}, {"title": "Album continuity", "text": "Compare representative sections across songs at a sensible playback level. Consistent vocal perspective can help, but different arrangements may need different settings to create that continuity."}], "exercise": "Both listeners write one observation on headphones and one on a small speaker. Make a change only when you agree what musical problem it solves.", "checklist": ["Reference loudness matched", "Mono reset after checking", "More than one playback checked", "Album context considered"], "sources": []}, {"id": "finish", "title": "Deliver a version everyone can identify", "short": "Bounce & handoff", "goal": "Export the right file, listen to it, and leave a clear record for the next person.", "why": "A good handoff includes the sound, the format, and the intent. Mastering is a separate judgment about the complete program; a single loudness target cannot decide whether the mix feels right.", "where": "File > Bounce > Project or Section (Command-B by default) · PCM settings", "steps": [{"title": "Confirm the destination", "text": "Ask for required format, sample rate, bit depth, naming, stems, and whether the recipient wants a premaster or a finished master. Use the actual brief when it differs from a typical example."}, {"title": "Prepare the intended path", "text": "For a premaster, remove loudness-only limiting if requested; retain intentional mix-bus processing that defines the approved mix and explain it. Provide an alternate if agreed."}, {"title": "Set the range and format", "text": "Include the full song and tail. A typical music premaster is interleaved WAV at the project sample rate and 24-bit, Normalize Off, with no clipping and comfortable margin."}, {"title": "Treat dither deliberately", "text": "Apply dither at the final reduction to a lower fixed bit depth when required, particularly for a 16-bit deliverable. Avoid multiple dither stages. A 24-bit working handoff does not imply a mandatory 16-bit noise-shaping pass."}, {"title": "Listen to the bounced file", "text": "Import or open it separately and check start, tail, stereo, edits, distortion, and missing parts. Name it with song, date, version, and mix/master status."}], "params": [{"label": "Premaster example", "start": "24-bit WAV · project sample rate", "adjust": "Follow the recipient’s specification. Headroom is about avoiding overload, not a magical −6 dBFS peak."}, {"label": "Normalization", "start": "Off for a controlled handoff", "adjust": "Preserve your chosen level rather than having export normalization change it."}, {"label": "Final loudness", "start": "Choose for music + destination", "adjust": "−14 LUFS is a platform normalization reference in some contexts, not a universal mastering requirement."}, {"label": "True peak", "start": "Measure; follow delivery spec", "adjust": "A ceiling such as −1 dBTP is a common audition point for encoded delivery, not a guarantee for all material or services."}], "listen": {"better": "The actual exported file is the intended version, with its full beginning, ending, dynamics, and effects.", "tooFar": "Truncated tails, a mono-check plug-in left active, clipping, missing effects, or a file that is loud but emotionally flattened."}, "deep": [{"title": "LUFS and dBTP answer different questions", "text": "Integrated LUFS estimates loudness across the program; true peak estimates peaks of the reconstructed waveform between samples. Two songs at the same LUFS can have very different punch and distortion."}, {"title": "Stems and multitracks", "text": "A stem is a grouped submix; multitracks are individual recorded or rendered tracks. Define common start/end points and whether effects are included. Soloing groups through a shared bus compressor may not sum back identically to the full mix."}, {"title": "Mastering Assistant is optional", "text": "It begins with Logic 10.8 and has system-dependent features. You can learn final EQ, dynamics, limiting, and metering without it. Evaluate any assisted result at matched playback loudness."}, {"title": "Close the learning loop", "text": "Write what worked, what remains uncertain, and one thing to try next session. Do not copy an entire chain to the next song without rechecking levels and musical goals."}], "exercise": "Have the other engineer verify the bounced file without looking at your project. Can they identify the version, hear the full tail, and explain what remains to do?", "checklist": ["Delivery requirements recorded", "Start and tail checked", "Export auditioned independently", "Version named and notes handed off"], "sources": ["bounce", "dither", "mastering", "loudness"]}], "genres": [{"id": "acoustic", "name": "Acoustic / folk", "tagline": "Keep the person, the story, and the room believable.", "intent": "A starting idea for intimate acoustic music: let the listener hear phrasing and physical detail without letting handling noise, plosives, or guitar resonance distract from the lyric. Some folk productions are expansive or heavily processed; follow the artist's reference.", "priorities": ["Choose the emotionally convincing take before choosing the cleanest syllables.", "Balance vocal and instrument as a conversation.", "Preserve breaths, phrase shapes, and useful room character."], "vocal": "Often close and intelligible, with consonants clear enough to carry the story. Intimacy can come from low playback-level intelligibility rather than excessive brightness.", "arrangement": "Listen for acoustic guitar strums or piano voicings that cover the voice. A softer part or different register can solve more than repeated EQ cuts.", "dynamics": "Ride quiet words and tame occasional peaks while allowing a chorus to feel bigger. A steady meter is not the goal.", "space": "Try a subtle room or short plate; compare against the recorded room. A reverb tail that fills every pause can erase intimacy.", "pitch": "Preserve intentional slides and vibrato. Correct only notes whose landing distracts in the chord context, with the artist's agreement.", "watch": "Simultaneously recorded voice and guitar may leak into both microphones. Editing, tuning, or EQ on one track can change their combined tone.", "startingPoints": [{"label": "Gentle compression audition", "value": "2:1 ratio; about 1–3 dB reduction on stronger phrases", "why": "An optional test for control without flattening the performance. Adjust threshold to the recording and compare at matched loudness."}, {"label": "Small-space audition", "value": "0.6–1.3 s decay", "why": "Compare a small sense of room against the existing ambience; slower songs or artistic references may call for more or none."}], "exercise": "Make two 30-second versions: one with only volume rides, one with rides plus gentle compression. Match their playback levels. Sophia describes which preserves the storytelling; the mentor identifies the exact phrase that changed.", "stageNotes": {"record": "Record the loudest chorus during soundcheck, then listen to the quietest verse for room and headphone spill.", "edit": "Keep useful breaths; fade cuts so the room does not switch abruptly on and off.", "pitch": "Judge a suspect note against the chord and melody, not only the pitch display.", "level": "Get the vocal and main instrument working together at a quiet monitor level first.", "eq": "Try moving a masking guitar part or lowering it before thinning the vocal.", "compress": "Let louder lines retain some rise; undo settings that make breaths compete with words.", "deess": "Treat the few harsh consonants, preserving the softness of the rest of the performance.", "tone": "Audition added saturation against the unprocessed texture; an acoustic recording does not automatically need it.", "space": "Check whether the real room already provides enough depth before adding an aux reverb.", "harmony": "Let a harmony enter as another person, with its own phrase shape rather than a perfectly copied lead.", "instruments": "Check voice and guitar together after any timing or polarity change on a shared performance.", "automation": "Ride phrase endings into audibility without making every breath equally loud.", "finish": "Compare sparse and full sections at equal playback level; preserve their emotional difference."}}, {"id": "pop", "name": "Pop", "tagline": "Make the hook effortless to follow.", "intent": "For a polished, vocal-led pop reference, prioritize a clear focal point and purposeful contrast between sections. Bedroom pop, dance pop, and orchestral pop can demand very different textures.", "priorities": ["Make every important hook word understandable.", "Give verses, pre-choruses, and choruses different density or width.", "Control bright processing across the whole vocal stack."], "vocal": "A stable lead can stay present while production changes around it. Use word rides, selective compression, and arrangement space before piling on brightness.", "arrangement": "Choose which hook owns each moment. Synth melodies, bright guitars, and backing vocals can trade places rather than compete constantly.", "dynamics": "Consistent lead level can coexist with changing intensity. Serial compression is an option when two gentle jobs sound better than one heavy job, not an obligatory chain.", "space": "Short ambience can keep the lead near; automated delay throws can create excitement between lines. Let chorus width come from supporting parts too.", "pitch": "Discuss whether the reference calls for natural correction or audible tuning. Check the actual melody and chord changes before applying a scale.", "watch": "A bright soloed vocal may turn brittle once several bright doubles, reverbs, cymbals, and synths play together.", "startingPoints": [{"label": "Lead-control audition", "value": "3:1 ratio; about 2–4 dB reduction on louder words", "why": "A practice starting point after rough word rides. Input level and delivery determine the useful threshold."}, {"label": "Delay-throw audition", "value": "1/8 or 1/4 note", "why": "Compare where repeats land between lyrics; choose by groove, not genre name."}], "exercise": "Build a verse and chorus with the same lead chain. Create the lift using supporting vocals, arrangement, and effect sends. Then check whether the lyric remains clear in mono.", "stageNotes": {"record": "Capture a clean lead, intentional doubles, and alternate hook energies as separate performances.", "edit": "Tighten distracting double consonants while preserving the lead's own phrasing.", "pitch": "Audition tuning intensity in the full chorus, including stacked notes and chord changes.", "level": "Ride weak hook words before asking a compressor to hold the entire performance still.", "eq": "Judge vocal presence while bright synths and cymbals play; the answer may be a supporting-track change.", "compress": "If using two compressors, give each a clear purpose and level-match the whole chain.", "deess": "Check combined sibilance from all layers and from the reverb return.", "tone": "Add density only until the lead reads clearly at a quiet level.", "space": "Automate a send on selected final words instead of filling every line with repeats.", "harmony": "Assign each layer a role: true double, harmony, octave, or response.", "instruments": "Clear space at important hook entrances with arrangement or small level moves.", "automation": "Use verse-to-chorus changes in width and sends while keeping the lead anchored.", "finish": "Check the loudest stacked chorus and the barest verse, including transitions between them."}}, {"id": "hiphop", "name": "Hip-hop / rap", "tagline": "Let delivery, rhythm, and words lead.", "intent": "Start from the artist's delivery: conversational rap, aggressive rap, melodic rap, and experimental hip-hop need different treatment. Keep rhythmic intent intact while integrating the vocal with the beat.", "priorities": ["Preserve rhythmic placement against the beat.", "Control changing distance, plosives, and sharp syllables.", "Separate lead, emphasis doubles, and ad-libs by role."], "vocal": "Consonant attack and sentence-level energy often drive intelligibility. Adjust individual phrases that disappear without turning every breath and mouth noise into a feature.", "arrangement": "Kick, bass, sample, and vocal may each demand the center. If working over a stereo beat, ask for stems when practical; severe EQ on the full beat can damage several elements at once.", "dynamics": "A dense or rapid delivery may need active rides and peak control. Tune release by listening for pumping between syllables and at pauses.", "space": "A comparatively dry lead with occasional repeats can preserve diction. Ad-libs may occupy a wider or more distant space if the artist wants contrast.", "pitch": "Unpitched speech rarely benefits from automatic melodic correction. On melodic parts, natural versus obvious tuning is an artistic choice agreed with the performer.", "watch": "Moving every syllable to the grid can remove the flow. Heavy saturation and compression can exaggerate already sharp consonants.", "startingPoints": [{"label": "Peak-control comparison", "value": "3:1 versus 5:1 ratio", "why": "Set each threshold for a comparable amount of reduction and match output levels; compare consonant punch rather than assuming more is better."}, {"label": "Short-delay audition", "value": "70–130 ms", "why": "Try one quiet repeat for thickness, then compare a tempo-synced throw. Keep the dry lyric easy to follow."}], "exercise": "Choose eight bars. Keep the lead unchanged while making one version with continuous doubles and another with emphasis doubles on selected words. Ask which makes the flow easier to understand.", "stageNotes": {"record": "Soundcheck the strongest line and rehearse microphone distance for sudden shouts.", "edit": "Keep the artist's intentional ahead-of-beat or behind-the-beat delivery.", "pitch": "Apply melodic correction only to material with an intended sung pitch or deliberate tuning effect.", "level": "Use phrase or region gain to reduce large jumps caused by changing mic distance.", "eq": "Treat plosives locally before applying a high-pass setting that removes the rapper's body throughout.", "compress": "Listen for breaths swelling at line endings and for the groove changing when release is too obvious.", "deess": "Protect diction: too much reduction can make fast words difficult to distinguish.", "tone": "Compare saturation at matched loudness while checking hard consonants and beat brightness.", "space": "Put delay emphasis in gaps where it can answer a line instead of obscuring the next one.", "harmony": "Align emphasis doubles only as tightly as the desired impact needs; keep ad-libs distinct.", "instruments": "When only a stereo beat is available, use modest changes and request stems for serious masking problems.", "automation": "Ride punch lines, ad-libs, and transitions separately from the main vocal.", "finish": "Audition a lyric-dense passage on a small speaker and check the beat-vocal relationship quietly."}}, {"id": "rnb", "name": "R&B / soul", "tagline": "Preserve touch, motion, and emotional detail.", "intent": "A useful starting idea is a lead that feels controlled yet expressive, surrounded by intentional harmonic depth. Contemporary R&B, vintage soul, neo-soul, and stripped live performances can point in different directions.", "priorities": ["Preserve runs, slides, vibrato, and dynamic nuance.", "Shape supporting harmonies into a deliberate arrangement.", "Let space support the groove without blurring intimate details."], "vocal": "A whisper, belt, and run may need different rides or processing. Keep expressive differences even when their listening level becomes more consistent.", "arrangement": "Electric piano, guitar, pads, and layered vocals can accumulate in the same register. Thin or simplify the backing arrangement at lead entrances.", "dynamics": "Use phrase rides for musical shape; compression can handle the remaining movement. One setting may not suit both a breathy verse and a strong chorus.", "space": "Try a short close ambience with a separate longer tail or filtered delay. Automate the long effect around the density of the lyric.", "pitch": "Check expressive scoops and passing notes against the phrase. A scale-only correction can erase intentional blue notes or bend the route into a note.", "watch": "Over-aligning layered harmonies can trade richness for an artificial, phasey sound; over-tuning runs can flatten the singer's identity.", "startingPoints": [{"label": "Phrase-control audition", "value": "2:1–3:1 ratio", "why": "Explore gentle control after rides; compare sustained vowels and the start of runs, using a threshold suited to the take."}, {"label": "Reverb pre-delay audition", "value": "20–60 ms", "why": "On a reverb with pre-delay, compare whether separation before the tail helps diction or produces an unwanted detached echo."}], "exercise": "Choose one expressive run. Listen dry, with gentle correction, and with stronger correction at the same level. Name which part of the singer's motion changes before choosing a version.", "stageNotes": {"record": "Capture complete emotional phrases; record harmonies with the final chord voicings in mind.", "edit": "Preserve the breath and pickup that make a run feel intentional.", "pitch": "Review passing tones and slides individually instead of forcing every moment to the nearest scale note.", "level": "Ride intimate lines into the mix without making their breath texture as loud as a belt.", "eq": "Resolve low-mid buildup across keys and harmony stacks before stripping warmth from the lead.", "compress": "Compare settings on both a sustained vowel and a fast run.", "deess": "Listen to stacked s sounds together; fix a dominant layer before dulling the whole vocal bus.", "tone": "Use added harmonics only if they retain soft delivery and the shape of vibrato.", "space": "Let tails open between lines and recede when intricate phrasing returns.", "harmony": "Balance harmony parts by chord function and intention, not identical fader positions.", "instruments": "Let bass and drums carry the groove while keys and pads make room for lead phrasing.", "automation": "Shape call-and-response between lead and backgrounds, including effect tails.", "finish": "Compare both a sparse intimate passage and the fullest stacked section."}}, {"id": "rock", "name": "Rock / alternative", "tagline": "Keep the voice urgent inside a physical band.", "intent": "For a band-led reference, make the vocal feel part of the performance while retaining enough focus to carry the song. Raw garage rock, classic rock, and polished alternative music do not share one ideal vocal sound.", "priorities": ["Keep vocal attitude and intelligibility over guitars.", "Use arrangement and fader balance to manage midrange competition.", "Preserve impact when the full band enters."], "vocal": "A vocal can be rough, smooth, dry, roomy, forward, or embedded. Agree on its place relative to guitars before choosing a processing chain.", "arrangement": "Rhythm guitars often sound huge alone but dominate the voice and snare together. Reduce redundant layers or adjust guitar tone before carving the lead excessively.", "dynamics": "Firm vocal control may suit a dense band. Keep consonant energy and avoid turning every quiet inhale into a loud event.", "space": "A short room, plate, or slap can tie the vocal to drums. Compare the tail against cymbal sustain and the guitar rhythm.", "pitch": "Correct distracting sustained landings if desired while preserving bends, rasp, and urgency. A visually imperfect note may be the strongest performance.", "watch": "Bright guitars, cymbals, vocal presence boosts, and saturation can create fatigue together even when each sounds exciting alone.", "startingPoints": [{"label": "Attack comparison", "value": "5 ms versus 25 ms", "why": "With similar gain reduction and matched output, hear how the consonant attack and urgency change. These are comparisons, not universal settings."}, {"label": "Slap audition", "value": "80–140 ms", "why": "A low-level repeat can add size; reduce it if it detaches from the band or smears quick lyrics."}], "exercise": "Find a chorus where the voice disappears. Make one version by raising the vocal and another by reducing selected guitar phrases. Match overall loudness and compare which retains band impact.", "stageNotes": {"record": "Check the loudest delivery without clipping and capture alternate intensity for key choruses.", "edit": "Keep breaths and pickups that contribute urgency; do not automatically remove every rough edge.", "pitch": "Review raspy or distorted notes by ear because detected note shapes can be unreliable.", "level": "Find the intended vocal-to-guitar balance in the busiest section first.", "eq": "Address guitar-vocal masking with a small move on the source causing the conflict.", "compress": "Check that compression keeps words present without erasing the leap into the chorus.", "deess": "Recheck after adding presence or saturation; compare in context with cymbals.", "tone": "Blend distortion only until it supports attitude; compare quiet words for loss of clarity.", "space": "Try a shared sense of room with the drums, then decide how close the lead should remain.", "harmony": "Reserve doubles or gang parts for emphasis when constant layering reduces impact.", "instruments": "Use contrasting guitar tones and registers before stacking more of the same sound.", "automation": "Lift meaningful words and manage guitar fills around the lyric.", "finish": "Check fatigue through a full loud chorus at a comfortable listening level."}}, {"id": "metal", "name": "Metal / hardcore", "tagline": "Make intensity readable without flattening the impact.", "intent": "Treat clean singing, screams, growls, and spoken passages as distinct sources with a shared artistic purpose. Dense metal and live hardcore can demand different amounts of editing and polish.", "priorities": ["Keep vocal articulation against dense distorted instruments.", "Separate clean and extreme deliveries when they need different processing.", "Preserve the rhythmic impact of riffs and drums."], "vocal": "Extreme vocals may already have a dense dynamic envelope. Additional compression is useful only if it improves stability or character; aggression is not measured by gain reduction.", "arrangement": "Wall-of-guitar mids, cymbal wash, and vocal harmonics compete. Contrast registers, tone, and phrase timing instead of making every layer maximally bright.", "dynamics": "Use rides for phrase balance and peak control for remaining spikes. Parallel compression can increase density, but judge it against lost transient impact.", "space": "Short or dark ambience can add size while retaining rhythmic precision. Longer effects may work at breakdowns, clean sections, or deliberately atmospheric moments.", "pitch": "Tune clean melodic parts only as appropriate. Noisy screams and growls may not contain a stable single pitch for Flex Pitch to track reliably.", "watch": "A gate can chop word endings or breaths; excessive high-frequency boosts can make harshness worse without improving intelligibility.", "startingPoints": [{"label": "Short-room audition", "value": "0.3–0.8 s decay", "why": "Try adding size while keeping fast riff spaces audible; atmospheric arrangements may need a different approach."}, {"label": "Density comparison", "value": "Parallel compressed path: mute, then blend upward slowly", "why": "Stop when weight improves and before consonants, drums, or phrase contrast collapse. No fixed blend percentage is required."}], "exercise": "Mix one clean-to-extreme vocal transition using separate level and processing choices. Have the other learner listen without watching the screen and identify any word or impact that disappears.", "stageNotes": {"record": "Set input gain for the loudest intended delivery and keep clean and extreme takes clearly labeled.", "edit": "Audit every gate or cut for lost breaths, consonants, and decaying screams.", "pitch": "Use pitch processing selectively on stable melodic material; do not trust detections on noisy extremes.", "level": "Balance clean and harsh sections by perceived impact, not matching meter peaks.", "eq": "Investigate the overlapping guitar and vocal midrange before adding more top end.", "compress": "Check whether the source is already dense enough; a compressor can add little useful control.", "deess": "Separate a harsh sustained texture from brief sibilance before choosing the treatment.", "tone": "Extra distortion may reduce intelligibility on an already distorted voice; compare bypass at matched level.", "space": "Let effect lengths follow the rhythmic space of each section.", "harmony": "Keep doubles intentional and check whether their consonants weaken the main articulation.", "instruments": "Judge kick, bass, guitar, and vocal together in the fastest and most sustained passages.", "automation": "Change sends and vocal rides at clean/extreme transitions rather than forcing one setting everywhere.", "finish": "Check breakdowns and fast passages for both fatigue and lost punch."}}, {"id": "electronic", "name": "Electronic / dance", "tagline": "Give the vocal a role in the groove and the drop.", "intent": "Decide whether the voice is storyteller, hook, rhythmic chop, or texture. House, techno, drum and bass, ambient electronics, and dance pop can use the same voice very differently.", "priorities": ["Define the vocal's role in each section.", "Coordinate effects and ducking with the groove.", "Check that width and low-end energy translate beyond headphones."], "vocal": "An intelligible centered lead may coexist with tuned chops or wide effects. Process separate roles separately so creative treatment does not accidentally bury the lyric.", "arrangement": "Kick, bass, lead synth, and vocal hook need a clear hierarchy. Build excitement with entries, exits, and changes of texture rather than only increasing volume.", "dynamics": "Sidechain compression can create purposeful movement. Choose the trigger and release by listening to the rhythm; pumping is an aesthetic option, not a requirement.", "space": "Tempo-synced delay, filtered returns, and section-specific reverb can connect the voice to the track. Dense drops may need less tail than sparse breakdowns.", "pitch": "Audible correction, formant changes, and repitching can be compositional tools. Keep an untreated source and verify that the resulting notes fit the harmony you want.", "watch": "Very wide layers can weaken or change in mono. Long low-frequency effect tails can blur kick and bass even when the dry voice is clear.", "startingPoints": [{"label": "Synced-delay comparison", "value": "1/8 versus dotted 1/8 note", "why": "Listen to the repeating pattern against the beat and upcoming lyric; neither value is automatically more musical."}, {"label": "Ducking experiment", "value": "About 1–3 dB of reduction on an effects return", "why": "Use the lead as a sidechain trigger to hear the tail move behind phrases; set release by the space after each line."}], "exercise": "Use one vocal phrase in three roles: dry lead, rhythmic chop, and distant texture. Keep each version's role audible when the drums and bass return.", "stageNotes": {"record": "Capture dry complete phrases plus isolated hook words if chops are part of the brief.", "edit": "Choose whether edits should lock to the grid or preserve a sung push and pull.", "pitch": "Treat tuning and formant movement as arrangement choices and keep the original recording available.", "level": "Balance the hook through both the breakdown and drop before adding more limiting.", "eq": "Clear unnecessary low-frequency energy from effects only as far as the desired tone allows.", "compress": "Use a deliberate sidechain source and listen for how its trigger changes the groove.", "deess": "Check sharp consonants after repitching, distortion, and heavy high-frequency effects.", "tone": "Design dramatic effects on alternate layers when the main lyric still needs clarity.", "space": "Automate sends and tails by section; a large breakdown reverb may overwhelm the drop.", "harmony": "Distinguish actual harmony parts from stereo effects so each has a purpose.", "instruments": "Choose who leads at the drop: the vocal hook, synth hook, or rhythm.", "automation": "Create transition energy with changes of texture, filter, send, and silence.", "finish": "Check the hook, bass, and effect width in mono and on a small speaker."}}, {"id": "country", "name": "Country / Americana", "tagline": "Make the story clear and leave room for the band's answers.", "intent": "Start with the lyric and the chosen tradition: acoustic Americana, honky-tonk, country pop, and modern arena production have different balances. Preserve the singer's accent and phrasing rather than aiming at an abstract neutral voice.", "priorities": ["Make narrative details understandable.", "Keep distinctive diction and pitch gestures.", "Coordinate vocal lines with guitar, fiddle, and steel fills."], "vocal": "A clear lead can retain warmth, grain, and twang. Excessive smoothing can remove personality; excessive presence can make consonants dominate the story.", "arrangement": "Give instrumental fills space between lines. Bright acoustics, steel, fiddle, and vocals may compete even when their individual tones are attractive.", "dynamics": "Ride softer narrative words while retaining the difference between reflective and emphatic lines. A modern dense track may need more control than a sparse acoustic performance.", "space": "A subtle room, plate, or slap can locate the voice. Choose the amount from the reference era and production rather than assuming every song needs a vintage effect.", "pitch": "Preserve scoops, bends, and regional inflection. Review sustained notes in the chord context rather than forcing every transition to a note center.", "watch": "Processing that removes all nasal or grainy character may remove the sound the artist intended. Separate a painful resonance from stylistic tone.", "startingPoints": [{"label": "Slap comparison", "value": "90–150 ms; one quiet repeat", "why": "A practice option for dimension; compare against no slap and listen for whether the narrative becomes less clear."}, {"label": "Phrase-ride exercise", "value": "Small 1–2 dB moves where needed", "why": "Learn how modest word-level changes can clarify a lyric before increasing compression."}], "exercise": "Choose a verse with instrumental fills. Automate the fills to answer the singer, then compare against a version where they stay equally loud under every word.", "stageNotes": {"record": "Capture the singer's natural diction and make the headphone mix comfortable enough for subtle delivery.", "edit": "Keep pickups and breath placement that support the line's conversational rhythm.", "pitch": "Preserve intentional slides into notes; check the note landing against the harmony.", "level": "Ride details that carry the story, especially low-energy words at phrase endings.", "eq": "Distinguish the singer's characteristic twang from a resonance that actually hurts in context.", "compress": "Compare whether control helps the story or makes every line equally emphatic.", "deess": "Treat harsh s and t sounds while retaining readable consonants and accent.", "tone": "Choose clean or colored processing from the recording's intended period and character.", "space": "Try a restrained shared space and add a slap only if it supports the chosen reference.", "harmony": "Let duet and harmony parts retain identity while their entries and endings feel intentional.", "instruments": "Shape steel, fiddle, and guitar fills around the vocal line.", "automation": "Balance the singer and answering instruments as an ongoing exchange.", "finish": "Ask someone to follow the story at a quiet listening level without reading the lyrics."}}, {"id": "jazz", "name": "Jazz / vocal ensemble", "tagline": "Preserve phrasing and the sense of musicians listening together.", "intent": "For an acoustic ensemble reference, natural interaction and believable perspective are useful priorities. Jazz also includes heavily produced and electronic forms; the session's artistic brief decides how far to process.", "priorities": ["Respect phrasing, swing, and ensemble interaction.", "Choose a believable vocal-to-band perspective.", "Preserve useful dynamic range and room continuity."], "vocal": "The lead may sit within the ensemble rather than dominate it. Retain soft attacks, breath texture, and dynamic phrasing when they serve the performance.", "arrangement": "Listen to piano, guitar, and cymbal activity around the melody. Fader balance and register often do more than surgical processing.", "dynamics": "Automation can bring out a quiet line without compressing the entire performance. Compression may be subtle or unnecessary on a well-controlled take.", "space": "Build from the recorded room. Added ambience should support one believable perspective unless the production calls for a deliberately separate vocal space.", "pitch": "Do not assume equal-tempered note centers describe every expressive pitch choice. Consult the artist before correcting bends, blue notes, or improvised lines.", "watch": "Bleed connects microphones acoustically. Aggressive edits, gates, or independent time shifts can make the room and tone change unnaturally.", "startingPoints": [{"label": "Minimal-control audition", "value": "Bypass versus 1.5:1–2:1 ratio", "why": "Compare at matched level and preserve phrase shape; the best choice may be no compressor."}, {"label": "Room comparison", "value": "Recorded room alone versus a quiet added room return", "why": "Judge continuity and depth instead of adding reverb automatically."}], "exercise": "Balance a vocal and small ensemble using only faders and panning for ten minutes. Note the specific remaining problem before adding one processor.", "stag
