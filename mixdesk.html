eNotes": {"record": "Listen to the ensemble balance and leakage while the full group plays, not only one microphone at a time.", "edit": "Prefer musical phrase boundaries and preserve continuous room tone around edits.", "pitch": "Review questionable notes with the artist's harmonic intention before changing them.", "level": "Set a believable vocal perspective with the whole ensemble playing.", "eq": "Use the minimum tonal change that solves a heard problem; retain natural instrument weight.", "compress": "Check quiet-to-loud phrasing before and after at equal playback level.", "deess": "Treat isolated harsh consonants gently so intimate articulation stays intact.", "tone": "A transparent result can be the right choice; coloration is optional.", "space": "Match added ambience to the recorded perspective rather than creating unrelated rooms by default.", "harmony": "Preserve blend and the singers' intended tuning relationships in close voicings.", "instruments": "Listen for cymbal and chordal activity covering subtle phrases before brightening the lead.", "automation": "Use gradual musical rides that follow lines and solos.", "finish": "Play a full performance to check whether dynamic shape and ensemble perspective remain coherent."}}, {"id": "classical", "name": "Classical / choir", "tagline": "Protect blend, acoustic space, and large-scale dynamics.", "intent": "For concert-style classical or choral work, the ensemble and room often form one sound. Close-miked contemporary choir or crossover production may have a different brief, so establish the intended listening perspective first.", "priorities": ["Build the balance from the principal microphones when available.", "Preserve ensemble tuning, phrasing, and room continuity.", "Keep soft-to-loud musical development meaningful."], "vocal": "Choir blend often matters more than individual vocal prominence. A soloist needs definition without sounding detached from the ensemble's acoustic.", "arrangement": "Balance sections and accompanying instruments by musical function. A supporting spot microphone should help the main picture rather than replace it unintentionally.", "dynamics": "Compression and limiting are not default requirements. Use restrained rides when needed and agree on delivery needs before reducing the ensemble's natural range.", "space": "The captured venue may be the essential ambience. If adding reverb, match distance, early reflections, and tail character rather than only choosing a long decay.", "pitch": "Flex Pitch is suited to single-note melodic material, not a complete polyphonic choir recording. Ensemble intonation is usually addressed in performance, take selection, or carefully planned repairs.", "watch": "Close spots can create timing and tonal interactions with the main array. Do not align everything blindly or gate room microphones between phrases.", "startingPoints": [{"label": "Spot-microphone audition", "value": "Mute, then raise gradually until its musical line becomes clear", "why": "This teaches support of the main image without prescribing a fader value that depends on recording gain and distance."}, {"label": "Dynamics comparison", "value": "No bus compression as the first reference", "why": "Hear the captured range before deciding whether any control is needed for the agreed release format."}], "exercise": "Create a balance from the main microphones alone, then add one spot. Listen for improved musical detail, image movement, and tonal changes; keep the spot only if its contribution helps.", "stageNotes": {"record": "Check the main microphone perspective, room noise, and the loudest passage before relying on spot microphones.", "edit": "Edit at musically compatible boundaries and audition sustained room tails across every repair.", "pitch": "Do not apply single-line pitch correction to a mixed choir; review ensemble intonation in the source performances.", "level": "Establish the main-array sound, then add spots for specific musical needs.", "eq": "Solve a definite recording problem without making every section artificially close or bright.", "compress": "Begin with no compression and justify any control by a heard problem or delivery requirement.", "deess": "Check collective consonants in context; a single close spot may be causing the apparent ensemble problem.", "tone": "Prioritize the desired concert perspective; extra saturation may obscure blend and room detail.", "space": "Retain natural decays and assess added reverb together with the venue sound.", "harmony": "Listen for section balance, vowel matching, and musical intonation rather than perfectly identical note centers.", "instruments": "Blend accompaniment into the same acoustic perspective as the singers.", "automation": "Use restrained, broad rides that respect crescendos and phrase arcs.", "finish": "Check the full dynamic arc and complete reverberation tail; obtain agreed delivery specifications."}}, {"id": "reggae", "name": "Reggae / dub", "tagline": "Let space and repetition participate in the groove.", "intent": "Start with the specific tradition and reference: roots reggae, dancehall, lovers rock, and experimental dub do not share one mix recipe. For dub-inspired production, effects can become performed arrangement elements.", "priorities": ["Protect bass and drum groove while keeping the voice understandable.", "Place repeats and tails intentionally around phrases.", "Use mutes, returns, and contrast as musical decisions."], "vocal": "A lead can be direct and warm, with effects answering selected words. Decide which passages carry the message and which invite more radical treatment.", "arrangement": "Bass, drum accents, skank guitar, organ, and voice occupy distinct rhythmic roles. Leave the spaces between these gestures audible.", "dynamics": "Control the vocal enough for stable lyric delivery while preserving rhythmic lilt. Excessively fast or pumping processing can interfere with the pocket.", "space": "Filtered delays, spring-like textures, and evolving sends are useful options, not genre requirements. A dark repeat can remain audible without competing with the next consonant.", "pitch": "Preserve bends and phrasing unless an overtly tuned sound is part of the brief. Melodic and speech-like delivery can need different treatment.", "watch": "High feedback and repeated effect routing can build level rapidly. Start low and keep the return fader accessible while experimenting.", "startingPoints": [{"label": "Delay-rhythm audition", "value": "1/4 note versus dotted 1/8 note", "why": "Listen to the new rhythm the repeats create; choose the pattern that supports this groove."}, {"label": "Feedback practice", "value": "Start at 10–20%, then adjust by ear", "why": "Learn how many repeats fit the gap before exploring longer tails; feedback behavior varies by effect."}], "exercise": "Perform a single delay send over eight bars, emphasizing only selected final words. Record or draw the automation and compare whether each repeat adds a useful response.", "stageNotes": {"record": "Capture a clean lead and any response parts with the artist's intended rhythmic placement.", "edit": "Preserve the relaxed or pushed placement that makes the delivery sit in the groove.", "pitch": "Judge pitch movement in musical context before correcting it.", "level": "Balance the lead against bass and drums before introducing dramatic effects.", "eq": "Keep effect returns from crowding low-frequency groove or obscuring the next lyric.", "compress": "Listen for changes to rhythmic lilt and to the spaces between phrases.", "deess": "Treat sharp syllables before they become distracting repeated events in the delay.", "tone": "Audition spring-like or saturated colors as artistic choices with matched playback level.", "space": "Use send automation to turn selected words into replies from the effect.", "harmony": "Keep responses and supporting harmonies distinct from the lead's narrative role.", "instruments": "Leave room for bass movement and offbeat accents instead of filling every gap.", "automation": "Practice return levels, effect sends, and arrangement mutes as part of the performance.", "finish": "Listen past the last lyric and inspect extended repeats for unwanted level buildup."}}, {"id": "indie", "name": "Indie / lo-fi", "tagline": "Choose the imperfection instead of accepting every problem.", "intent": "Decide which rough edges express the song: room noise, limited bandwidth, distortion, unstable pitch, or loose doubles can be purposeful. Indie is broad, and a clean production can be just as valid as a lo-fi one.", "priorities": ["Name the texture the artist actually wants.", "Keep the intended focal point audible.", "Separate expressive character from distracting accidents."], "vocal": "The voice might feel close and fragile or deliberately buried. Establish whether the lyric should be fully understood before trying to maximize clarity.", "arrangement": "Sparse arrangements can expose small details; dense fuzzy arrangements may need selective contrast. A clean transient or dry phrase can give a textured mix a useful anchor.", "dynamics": "Unevenness may support the performance, but one unexpectedly loud line can still distract. Try selective rides before deciding that all movement should remain.", "space": "A bedroom room sound, short slap, or conspicuous reverb can define the world of the track. Make those choices consistent enough to feel intentional.", "pitch": "Untuned, lightly repaired, and obviously synthetic vocals are all possible. Preserve an original and make the aesthetic decision with the artist.", "watch": "Adding noise and distortion to every layer can erase contrast. A copied track with a tiny delay is not the same as a separately sung double and can change in mono.", "startingPoints": [{"label": "Texture audition", "value": "Clean source plus a quietly blended colored parallel version", "why": "Learn to control texture independently of lyric definition; stop when the song loses its focal point."}, {"label": "Bandwidth comparison", "value": "Full-range versus progressively narrowed tone", "why": "Choose the narrowest sound that still conveys the intended emotion and words; there is no required cutoff."}], "exercise": "List three imperfections in a take. Keep one, reduce one, and exaggerate one. Play the result to the other learner and explain the musical purpose of each choice.", "stageNotes": {"record": "Record a usable clean take even when planning a colored result, so the degree of texture stays adjustable.", "edit": "Keep deliberate looseness but fade accidental clicks and abrupt room changes.", "pitch": "Compare a repaired version with the untouched take before deciding which feels more convincing.", "level": "Choose which words must remain legible and ride those rather than chasing perfect consistency.", "eq": "Use limited bandwidth as a deliberate texture, checking how it changes the lyric in the arrangement.", "compress": "Audition audible pumping only if it contributes to the intended character.", "deess": "Distortion can exaggerate a few consonants; fix those without polishing away every edge.", "tone": "Build one obvious color at a time and level-match before deciding it helps.", "space": "Keep the room sound intentional through edits and section changes.", "harmony": "Use genuinely separate performances when seeking the motion of loose doubles.", "instruments": "Create contrast between textured layers so the whole track does not become a uniform blur.", "automation": "Let texture or distance change for a reason, such as a lyric shift or section entrance.", "finish": "Check whether the intended roughness still communicates on a small speaker at low volume."}}, {"id": "latin", "name": "Latin styles / bilingual projects", "tagline": "Start with the specific tradition, language, and rhythmic role.", "intent": "This is a navigation category, not a single sound. Salsa, bachata, reggaetón, regional Mexican music, Latin pop, and many other traditions need different arrangements, dynamics, and vocal perspectives. Ask for representative tracks and the artist's own terminology.", "priorities": ["Identify the particular style and arrangement before choosing processing.", "Protect lyric intelligibility and natural diction in every language.", "Coordinate the voice with the actual rhythmic instruments and response parts."], "vocal": "A lead over acoustic strings and brass needs a different balance from a vocal over an electronic dembow production. Accent, rolled consonants, and expressive pitch gestures are part of the performance.", "arrangement": "Map the instruments present and their conversational roles. Brass hits, hand percussion, accordion, requinto, guitars, synths, and bass are possibilities, not a checklist for every Latin track.", "dynamics": "Choose control from the delivery and production density. An acoustic narrative performance can retain broad movement while a dense pop arrangement may require more detailed rides.", "space": "Match ambience to the intended setting: ensemble room, close pop lead, spacious ballad, or rhythmic effects. Do not select one reverb because of the category label.", "pitch": "Preserve intended ornaments and tune against the actual harmony. Use an overt correction effect only when the artist wants that character.", "watch": "Unfamiliar pronunciation can be mistaken for noise or sibilance. Ask a fluent collaborator before editing diction you do not understand.", "startingPoints": [{"label": "Reference-map exercise", "value": "Two references from the specific style", "why": "Identify vocal distance, rhythmic emphasis, and space before touching settings; compare at matched playback level."}, {"label": "Masking audition", "value": "One small level change to the competing instrument", "why": "Test whether the issue comes from an instrumental accent before changing the entire lead tone."}], "exercise": "Compare a vocal-led acoustic reference and a dense electronic reference within the artists' chosen styles. Describe three arrangement-dependent mix choices without calling either one the universal Latin sound.", "stageNotes": {"record": "Confirm language, lyric pronunciation, style, and intended delivery with the performer.", "edit": "Retain stylistic pickups and ornaments; verify unfamiliar syllables before cutting them.", "pitch": "Use the actual melodic and harmonic context, preserving intentional ornaments.", "level": "Decide how far forward the lead belongs using a reference from the specific tradition.", "eq": "Identify the actual masking source, which may be brass, strings, percussion, keys, or an electronic layer.", "compress": "Set control for the recording's density and performance rather than the broad category.", "deess": "Verify that reduction preserves meaningful consonants and natural pronunciation.", "tone": "Choose clean, warm, or distorted treatment from the artist's reference and arrangement.", "space": "Compare the intended acoustic or electronic setting before choosing room, plate, or delay.", "harmony": "Balance coro, duet, response, and pop stacks according to the roles present in this song.", "instruments": "Respect the groove's specific accents and leave room around the lyric where appropriate.", "automation": "Coordinate vocal lines and instrumental or group responses phrase by phrase.", "finish": "Have a fluent listener check the lyric and a style-familiar listener check the balance."}}, {"id": "gospel", "name": "Gospel / worship", "tagline": "Support the lead, the group, and the emotional arc.", "intent": "These overlapping contexts are not interchangeable genres. A gospel choir with call-and-response, a contemporary worship band, and an intimate devotional solo require distinct references and vocal priorities.", "priorities": ["Establish who leads each phrase: soloist, group, or congregation.", "Preserve the difference between intimate and climactic sections.", "Keep dense vocal layers clear without disconnecting the shared space."], "vocal": "A lead may need detailed rides across speech, soft singing, and powerful ad-libs. Choir or congregation recordings can be part of the musical emotion rather than simply background noise.", "arrangement": "Organ, piano, pads, guitars, drums, choir, and lead can all grow at the climax. Assign moments and registers instead of making every layer equally dominant.", "dynamics": "Shape the long build and control sudden peaks separately. More compression on a climax can reduce the very lift the performance is trying to create.", "space": "Choose a shared acoustic identity. Spacious contemporary arrangements may welcome long tails, while fast call-and-response needs enough separation for each answer to read.", "pitch": "Preserve runs and expressive inflection. Separate close-miked solo lines from mixed choir recordings; one pitch-editing approach does not suit both.", "watch": "Live bleed and audience microphones can make gates, time shifts, and edits conspicuous. Excessive brightening across a large choir stack can become fatiguing.", "startingPoints": [{"label": "Build comparison", "value": "Verse, first chorus, and final chorus at the same monitor setting", "why": "Check whether arrangement and rides create an emotional arc before adding bus compression."}, {"label": "Space contrast exercise", "value": "One short ambience plus an optional separately controlled long tail", "why": "Separate a sense of shared room from dramatic sustain so fast lyrics can remain clear."}], "exercise": "Mix a lead-to-group response so the focus clearly moves between them. Then play the entire build and check that the final response feels larger without losing the words.", "stageNotes": {"record": "Label solo, choir, congregation, and room microphones; capture their combined sound during soundcheck.", "edit": "Keep room continuity through repairs, especially around applause, responses, and sustained group notes.", "pitch": "Treat a solo run differently from a polyphonic choir recording and preserve intentional inflection.", "level": "Move the focus between leader and response group while preserving the shared performance.", "eq": "Listen to the sum of choir, keys, cymbals, and lead before adding broad brightness.", "compress": "Control isolated peaks while checking that later choruses still feel larger.", "deess": "Find whether one close microphone or many layers cause collective sibilance.", "tone": "Choose color according to the specific gospel, worship, or devotional reference.", "space": "Keep words readable in fast responses and let sustained sections carry longer tails when appropriate.", "harmony": "Balance choir sections and harmony lines by musical role, preserving collective energy.", "instruments": "Reduce competing fills or dense voicings when lead and choir need the foreground.", "automation": "Shape the full build as well as the moment-to-moment call-and-response.", "finish": "Check the complete emotional arc, live-room continuity, and intelligibility of the final climax."}}], "problems": [{"id": "clipped-recording", "title": "The recording crackles on loud words", "category": "Recording", "symptom": "Loud syllables sound crunchy even after you turn the track down.", "check": ["Bypass processing and listen to the original recording at a comfortable level. Does the distortion remain?", "Compare the interface input meter with Logic's output meter. A red output caused by mixing is different from distortion already recorded at the mic, preamp, or converter."], "try": ["If the distortion is only from a plug-in or the output, reduce level before that stage and compare.", "If overload is recorded into the file, use a clean alternate take or re-record with lower hardware input gain. Rehearse the loudest section when setting gain; leave room for a louder real performance.", "A repair tool may disguise small faults, but ordinary gain reduction cannot restore waveform information lost through clipping. Lowering the channel fader does not lower the interface's recording gain."], "avoid": "Do not put a limiter on the playback track and assume it protects the mic input or repairs an already clipped take.", "verify": "The original dry recording remains clean through the loudest phrase, and no later stage adds unwanted distortion.", "lesson": "record"}, {"id": "room-noise", "title": "The vocal sounds roomy, hissy, or full of bleed", "category": "Recording", "symptom": "Room reflections, fan noise, headphone spill, or hiss compete with the performance.", "check": ["Listen to a silent gap and a held vowel separately. Noise only in gaps is easier to reduce than reflections or bleed overlapping the singing.", "Bypass compression and bright EQ. They may be making an existing problem more audible rather than causing it."], "try": ["For the next take, reduce noise at its source, lower headphone spill, and try a quieter mic position. Move closer only as far as plosives and bass buildup allow; use a pop filter.", "For an existing take, lower distracting gaps with region gain or volume automation and use fades. Keep natural ambience where an abrupt silence would sound strange.", "Try gentle Noise Gate attenuation only if it helps. Set attack, hold, and release so quiet starts and endings survive. A gate cannot remove room sound while the singer is active."], "avoid": "Do not keep adding reverb to hide a reverberant recording, or hard-gate every breath without listening.", "verify": "Check phrase beginnings and endings in the full mix. The cleanup should attract less attention than the original noise.", "lesson": "record"}, {"id": "hum-buzz", "title": "A steady hum or buzz is audible", "category": "Recording", "symptom": "A pitched electrical buzz remains even when nobody is performing.", "check": ["At a low monitor level, test one source and cable at a time. See whether the noise changes with a guitar's position, a cable swap, or a nearby power supply being moved.", "Use Channel EQ's analyzer to inspect the noise, but confirm by ear. Mains hum may appear around 50 or 60 Hz and its harmonics; not every buzz is mains hum."], "try": ["Fix the source first: try a known-good cable, appropriate balanced connections, and distance from noisy power supplies or lighting.", "If the noise is already recorded, try a small narrow Channel EQ cut at a confirmed offending frequency. Add further cuts only when they audibly help.", "Edit or lower noisy gaps separately. If the buzz masks important notes throughout, another take may be the cleanest solution."], "avoid": "Never remove an electrical safety earth to troubleshoot hum. Do not notch a guessed frequency if it removes useful bass or vocal body.", "verify": "Compare the quietest passage and the fullest passage; the improvement should not make the instrument hollow.", "lesson": "record"}, {"id": "monitor-delay", "title": "The singer hears an echo or delay while recording", "category": "Recording", "symptom": "The headphone vocal arrives late, sounds doubled, or has a hollow quality.", "check": ["Check whether both interface direct monitoring and Logic software monitoring are active. Two paths can cause doubling or comb filtering.", "Check for Bluetooth headphones, a large I/O buffer, and latency-inducing plug-ins on the track, its buses, and Stereo Out."], "try": ["Use wired headphones and choose one monitoring path. When monitoring directly through the interface, turn off the duplicate software-monitoring path.", "When monitoring through Logic, try a smaller I/O Buffer Size in Audio settings and use Record > Low Latency Mode. If playback crackles or overloads, raise the buffer one step.", "Low Latency Mode may bypass processing or sends. Restore your normal mixing state afterward and check that the cue mix still works."], "avoid": "Do not drag every new region earlier to solve a monitoring problem; that can create a timing error in a correctly recorded performance.", "verify": "Record and replay a short rhythmic phrase. Confirm both that the performer can sing comfortably and that the recorded timing is correct.", "lesson": "record"}, {"id": "plosive", "title": "P and B sounds make a low thump", "category": "Editing", "symptom": "A short burst of bass jumps out at the start of a word.", "check": ["Confirm the thump is in the dry recording, rather than the kick or a compressor reacting to the word.", "Find the exact burst. It may occupy only part of the consonant, so the whole word may not need changing."], "try": ["For the next take, use a pop filter and adjust mic angle or distance so air does not hit the capsule directly.", "On a duplicate or saved alternative, isolate the affected portion with edits and fades; reduce its region gain a little.", "If a low-frequency burst remains, process only that short region with Channel EQ through Selection-Based Processing when available, or place it on a duplicate track with appropriate filtering. Adjust the filter until the pop reduces without thinning the vowel."], "avoid": "Do not apply a long fade across the entire word or a high cutoff across the whole vocal just to fix one pop.", "verify": "The consonant remains intelligible and the word still starts on time, without a new click at the edit.", "lesson": "edit"}, {"id": "edit-click", "title": "A click appears at an edit or comp boundary", "category": "Editing", "symptom": "A tiny tick appears where two regions meet or where audio was trimmed.", "check": ["Zoom in and audition both sides. Is the click at the boundary, or is it a mouth noise already inside the take?", "Check whether the edit cuts through a vowel, note decay, or room sound."], "try": ["Move the edit to a less exposed moment when possible, then add a short fade or crossfade. Begin with a few milliseconds and adjust by ear.", "When crossfading different takes, listen for doubled consonants and pitch overlap; a longer crossfade is not always smoother.", "For a mouth click within a word, use another take or a very small edit only if speech remains intact. Preserve the original."], "avoid": "Do not apply the same fade length to every event or delete part of a word just because the waveform looks unusual.", "verify": "Loop across the join, then play the whole phrase in context. There should be no tick, dip, double attack, or interrupted ambience.", "lesson": "edit"}, {"id": "uneven-vocal", "title": "Some words vanish while others jump out", "category": "Vocal balance", "symptom": "The vocal fader never seems to be in the right place for the whole phrase.", "check": ["Listen with processing bypassed, then in the mix. Separate recorded level changes from instruments masking particular words.", "Watch whether the compressor clamps down on one loud syllable and remains active through the quiet syllable that follows."], "try": ["Use region gain before the compressor to reduce large phrase-to-phrase differences. Preserve intentional dynamic changes.", "Use modest compression for the remaining movement; set the threshold against the actual recording rather than a fixed input number.", "Use volume automation after processing to place important words in the arrangement. If words disappear only when another part enters, adjust that part too."], "avoid": "Do not demand that every phrase fall inside a fixed 3 dB window or force a compressor to solve every musical balance change.", "verify": "At a comfortable low playback level, the lyric stays understandable while a quiet verse still feels quieter than a strong chorus.", "lesson": "level"}, {"id": "harsh-vocal", "title": "The voice hurts on strong vowels", "category": "Vocal tone", "symptom": "The vocal sounds biting or shouty even when S sounds are under control.", "check": ["Lower the monitor volume first. Compare the dry take with EQ, saturation, and compression bypassed one at a time.", "Determine whether the harshness is constant, appears only on loud notes, or comes from competing guitars, cymbals, or synths."], "try": ["If a boost or saturation stage caused it, reduce that processing first.", "For a steady tonal problem, try a small Channel EQ cut around the offending area, often somewhere in the upper mids. Search while listening to the mix and use only enough cut to help.", "If only a few words hurt, lower them with region gain or automate a gentle EQ change. A permanent deep cut can make all the other words dull."], "avoid": "Do not assume all harshness is sibilance or automatically cut 3 kHz on every singer.", "verify": "The strong note feels comfortable without losing its emotion or becoming harder to understand.", "lesson": "eq"}, {"id": "sharp-s", "title": "S, SH, and T sounds are too sharp", "category": "Vocal tone", "symptom": "Consonants spit forward or trigger a bright reverb tail.", "check": ["Listen to a line with sibilance and a line with sustained vowels. Confirm the problem is the consonant, not broad brightness.", "Bypass air boosts and saturation. Check whether the dry vocal is acceptable but the reverb return exaggerates it."], "try": ["In DeEsser 2, use Filter Solo briefly to locate the sibilant range, then turn Solo off. Set threshold and Max Reduction so the consonants soften while vowels remain natural.", "Start with Relative mode when the singer's level changes substantially, and compare Split versus Wide by ear. Tune the detector to this recording rather than a gender-based preset rule.", "For just a few bad S sounds, use region gain. If only the effect tail hisses, de-ess before the reverb on its aux or darken that return."], "avoid": "Do not force a fixed amount of reduction on every consonant. On older Logic versions without DeEsser 2, manual region gain remains a precise stock option.", "verify": "The words remain clear and natural in context, including quiet lines and the brightest chorus.", "lesson": "deess"}, {"id": "lisping", "title": "De-essing makes the singer sound lispy", "category": "Vocal tone", "symptom": "S sounds disappear, consonants blur, or the entire voice becomes dull during words.", "check": ["Bypass every de-esser, including those on vocal buses and effect returns. Confirm which stage changes the consonant.", "Check whether the reduction meter moves on vowels or through whole phrases."], "try": ["Reduce Max Reduction, then adjust threshold so only the offending sounds trigger useful attenuation.", "Retune the detector frequency and compare Split with Wide. A narrower affected range may preserve more of the voice, but still needs listening.", "If two de-essers are working hard, use less total processing or replace the worst events with manual gain edits."], "avoid": "Do not automatically shift the frequency upward: first locate which frequency and amount of reduction are causing the damage.", "verify": "Compare a sibilant word with bypass at matched level. It should sound like the same person saying the same consonant, more comfortably.", "lesson": "deess"}, {"id": "dull-vocal", "title": "The vocal is dull or covered by a blanket", "category": "Vocal tone", "symptom": "Words lack definition or the voice has little air.", "check": ["Bypass de-essing, low-pass filtering, and compression in turn. Check whether the dullness is actually processing damage.", "Listen briefly without the competing instruments. A clear solo vocal that disappears in the mix may need arrangement or level changes."], "try": ["Undo excessive filtering or gain reduction first. Try a slightly slower compressor attack if consonants have lost their edge.", "If the source truly needs brightness, try a small broad presence boost for clarity or a high shelf for air; these solve different problems.", "When masking is the cause, lower or reshape the competing part during the lyric before adding more top end to the voice."], "avoid": "Do not keep boosting high frequencies into strong de-essing. A shelf may also reveal hiss, room sound, and S sounds.", "verify": "At matched level, words become easier to follow without the singer sounding brittle or noisy.", "lesson": "tone"}, {"id": "boomy-vocal", "title": "Low notes or close words become boomy", "category": "Vocal tone", "symptom": "Some words have too much bass or low-mid weight.", "check": ["Listen on another trusted system or headphones to separate recorded boom from your room's bass buildup.", "Check whether the problem follows a particular note, closer mic distance, a plosive, or a whole section."], "try": ["For future takes, aim for more consistent mic distance and try small placement changes before EQ.", "For broad excess, try a gentle low shelf or broad low-mid cut in Channel EQ. Use a high-pass filter for unwanted rumble, keeping it low enough to preserve useful body.", "For just a few notes, automate a shelf or lower those regions. Treat a plosive locally rather than thinning the entire performance."], "avoid": "Do not choose a high-pass cutoff from the singer's gender or push it upward until every bass note disappears.", "verify": "The vocal keeps weight in the full mix, and the problem notes no longer overpower nearby words.", "lesson": "eq"}, {"id": "thin-vocal", "title": "The voice sounds thin or hollow", "category": "Vocal tone", "symptom": "The singer has lost body, even though the vocal may still be loud.", "check": ["Bypass high-pass filters and low-mid cuts throughout the track and vocal buses.", "Mute doubled tracks and parallel paths one at a time. Hollow sound can come from timing or polarity relationships, not missing bass."], "try": ["Restore body removed by unnecessary filtering first.", "If two versions of the same performance interfere, compare their timing and processing. Remove an accidental duplicate before trying more EQ.", "If the source itself needs weight, try a small broad low-frequency or low-mid boost, or subtle stock saturation, while checking against bass and guitars."], "avoid": "Do not add a large 120 Hz shelf to every thin voice. That may amplify noise or disguise a phase problem.", "verify": "The voice gains believable body without boom, and it stays stable when the mix is summed to mono.", "lesson": "eq"}, {"id": "tuning-artifacts", "title": "Tuning sounds robotic, watery, or wrong", "category": "Pitch and timing", "symptom": "The voice glitches, jumps between notes, or loses its natural movement.", "check": ["Compare the untouched take. Identify whether the problem follows a large pitch move, a note boundary, vibrato, or a breath misidentified as a note.", "Confirm the intended note against the actual chords. A scale setting can exclude expressive or borrowed notes that belong in the song."], "try": ["In Flex Pitch, reduce or reset the affected edit and correct only what sounds wrong. Preserve scoops and vibrato when they serve the performance.", "With the Pitch Correction plug-in, verify the allowed notes and try a slower Response for a more natural transition. Fast response may be an intentional effect in pop, trap, or electronic music.", "For a large repair that will not sound convincing, use another take or re-record the phrase."], "avoid": "Do not tune breaths, spoken consonants, or every note to the nearest visible grid line. 'Nobody should hear tuning' is a style choice, not a universal rule.", "verify": "Check the transition into and out of the edited note with the chords playing. The result should fit the agreed natural or stylized sound.", "lesson": "pitch"}, {"id": "harmony-flams", "title": "Doubles and harmonies sound messy or too perfect", "category": "Pitch and timing", "symptom": "Consonants arrive in a cluster, endings smear, or the stack sounds lifeless after alignment.", "check": ["Decide whether these are supporting doubles, independent harmonies, a duet, or an ensemble. They do not all need the same treatment.", "Listen for the exact mismatch: word onset, vowel, note change, consonant, or ending. Compare against the unedited version."], "try": ["Align the distracting events with small region or Flex Time edits. Preserve slight variation where it creates natural width and energy.", "Lower or shorten extra S and T sounds on supporting parts when they blur the lead. Keep them when the backing singer has an independent phrase.", "If alignment removed the feel, restore some timing variation or use a different take. Adjust stack level before adding more processing."], "avoid": "Do not force every harmony to be darker, thinner, more compressed, and perfectly aligned. Featured duets, gospel, choir, and folk ensembles may need distinct voices.", "verify": "The words read clearly, the harmony supports its intended role, and the performance still feels alive.", "lesson": "harmony"}, {"id": "guitar-masking", "title": "Guitars cover the lyric", "category": "Dense mixes", "symptom": "The voice is clear alone but disappears when guitars enter.", "check": ["Lower the guitar group briefly. If the words return, test balance and arrangement before changing vocal tone.", "Identify which part and register compete. Sustained distorted chords, acoustic pick attack, and a busy lead line need different solutions."], "try": ["Try a small guitar fader reduction, complementary panning, or simplifying a part during the lyric.", "If an overlap remains, use a small broad Channel EQ cut on the competing guitar where the lyric becomes clearer. Do not assume 3 kHz is always the answer.", "For section-specific conflict, automate guitar level. Optional gentle Compressor sidechain ducking from the vocal can help; remember it lowers the whole guitar, not only the masked frequency band."], "avoid": "Do not permanently scoop all guitars or boost vocal presence indefinitely. An intro without vocals may need different settings.", "verify": "The lyric reads in the chorus, while the guitars still carry the song's intended weight between lines.", "lesson": "instruments"}, {"id": "kick-bass", "title": "Kick and bass blur together", "category": "Dense mixes", "symptom": "The low end feels cloudy, weak, or much louder than the rest of the song.", "check": ["Listen to each part, then both together. Check note length and rhythm before EQ; long bass or 808 tails can overlap the next kick.", "Check on headphones as well as the room monitors. If correlated layers lose bass when combined, investigate timing or polarity; do not assume every kick and bass need alignment."], "try": ["Choose which part leads the lowest octave in this arrangement and balance the other around it.", "Shorten an overly long sound or use small complementary Channel EQ moves. Preserve enough upper harmonics for the bass to be audible on small speakers.", "If overlap remains, use subtle kick-triggered Compressor ducking on bass. Set release so bass recovers musically before the next event; heavier pumping may be intentional in dance music."], "avoid": "Do not high-pass every bass source at a fixed frequency or boost sub-bass because a phone cannot reproduce it.", "verify": "Kick attack and bass notes remain distinct, with consistent weight across notes and no unintended pumping.", "lesson": "instruments"}, {"id": "mono-loss", "title": "A part disappears or turns hollow in mono", "category": "Stereo and routing", "symptom": "Stereo sounds wide, but a mono check removes important vocal, guitar, or low-end information.", "check": ["Use the stereo Utility > Gain plug-in's Mono button for a temporary sum check. Compare relative balance and tone rather than demanding identical stereo loudness.", "Mute widening, short delays, doubled paths, and multi-mic sources one at a time to locate the loss. A correlation meter is a clue, not a pass/fail target."], "try": ["Reduce the widening or delayed duplicate responsible for cancellation, or preserve a clear dry center alongside the effect.", "For related mic recordings, compare polarity using Gain's Phase Invert button and inspect timing. Keep the combination that serves the recording; a polarity flip cannot correct every time offset.", "Recheck the full mix after each change and turn the temporary Mono check off before a stereo export."], "avoid": "Do not raise a wide reverb just because it partly cancels in mono, or assume all mono differences are faults. Significant loss of essential information deserves investigation.", "verify": "The song's lead, groove, and important notes remain clear in mono, even though width naturally disappears.", "lesson": "reference"}, {"id": "distant-vocal", "title": "Reverb pushes the singer too far away", "category": "Space and effects", "symptom": "The vocal is lush in solo but distant or hard to understand in the song.", "check": ["Mute effect returns to confirm that the dry vocal has the right level and tone.", "Check the amount of early reflections, decay, predelay, and the existing room sound in the recording."], "try": ["Lower the send first. Shorten decay when tails overlap new phrases; reduce early reflections if they create too much apparent distance.", "Try a little more predelay to separate the dry syllable from the tail. Stop if it becomes a distracting echo.", "Filter the return with Channel EQ, automate less effect during busy phrases, or use a vocal-triggered Compressor after the reverb for gentle ducking. A filtered delay may suit the arrangement better than more reverb."], "avoid": "Do not treat a fixed send value as a wetness target. Source level, aux gain, plug-in output, and song density all change the result.", "verify": "The vocal occupies the intended distance and the next phrase stays readable. An ambient or dream-pop vocal may deliberately sit further back.", "lesson": "space"}, {"id": "pumping", "title": "Compression pumps, breathes, or flattens the performance", "category": "Dynamics", "symptom": "The level surges between words, room noise rises, or the groove loses impact.", "check": ["Bypass compressors and limiters one at a time at matched listening level. Check the track, buses, and Stereo Out.", "Watch gain reduction through a loud event and the following quiet moment. Check whether bass or plosives are driving the detector."], "try": ["Reduce the amount of compression by raising threshold or lowering ratio. Level a few extreme words before the compressor.", "Adjust release to the phrase: too short can create audible modulation; too long can hold down following words. Compare Auto release where available.", "If low-frequency bursts drive unwanted reduction, fix the bursts or carefully filter the compressor's detector. Use a slower attack if you need more transient articulation, and recheck peaks."], "avoid": "Do not chase a required total of 5–7 dB reduction or insist on two compressors. Intentional pumping is valid when it is part of the agreed sound.", "verify": "At equal loudness, the processed version is easier to place while retaining the intended breath, punch, and dynamics.", "lesson": "compress"}, {"id": "silent-send", "title": "The reverb or delay send does nothing", "category": "Stereo and routing", "symptom": "Turning the send knob produces no audible effect.", "check": ["Follow the path: source meter, send bus number, matching aux input, aux meter, aux output, Stereo Out. Check mute, solo, bypass, and fader states.", "Check whether the send is down, Low Latency Mode has disabled it, or a post-fader send is fed by a lowered source fader."], "try": ["Match the send's bus destination to the aux input. Route the aux to the intended output or mix bus.", "For a conventional effect aux, set the reverb or delay fully wet and begin with the send low; raise it gradually.", "Use Post Fader or Post Pan when the effect should follow source volume. Pre Fader is useful for an independent cue or creative effect, but it can remain audible when the source fader is lowered."], "avoid": "Do not create more buses at random. Fix and name one complete signal path first.", "verify": "The aux meter reacts, the effect is audible at the expected level, and muting the return removes only that effect contribution.", "lesson": "setup"}, {"id": "runaway-feedback", "title": "A send creates a howl or runaway level", "category": "Stereo and routing", "symptom": "An effect builds on itself, or a mic produces a sudden sustained squeal.", "check": ["Immediately lower the monitor level and mute the suspect path before investigating.", "Distinguish acoustic feedback from speakers reaching the mic, a routing loop between auxes, and deliberately high delay feedback."], "try": ["While recording with a mic, use headphones and keep room speakers out of the monitoring loop.", "Trace each return's sends and output. Remove a return feeding its own input bus, directly or through another aux, unless you intentionally designed and controlled that feedback network.", "Reset delay feedback to a modest value and bring the return back up slowly. Keep an easy mute available when exploring self-oscillation as an effect."], "avoid": "Do not keep turning up a quiet-looking send while an unexplained route is active.", "verify": "Playback and silence both remain stable, with no unexplained buildup after the source stops.", "lesson": "setup"}, {"id": "two-track-beat", "title": "The vocal will not fit a finished stereo beat", "category": "Dense mixes", "symptom": "The instrumental is already loud and dense, leaving little apparent space for a new voice.", "check": ["Turn the beat down before processing. Check whether the problem is simply its mastered level relative to the vocal.", "Listen for clipping already in the beat, a competing lead instrument, or excessive brightness. Ask whether clean stems or an unmastered instrumental are available."], "try": ["Build the vocal balance against a quieter beat and keep room at the stereo output.", "If stems are available, adjust the specific competing part. With only stereo audio, try small broad EQ moves or brief volume automation when the lyric needs space.", "Optional gentle vocal-triggered Compressor ducking can help, but it changes the whole beat. Compare the drums and groove carefully before keeping it."], "avoid": "Do not assume EQ or a limiter can fully undo clipping or mastering already printed into the beat. Avoid deep permanent cuts that damage the instrumental everywhere.", "verify": "The vocal is understandable and belongs to the beat, while drum impact and musical energy remain intact.", "lesson": "instruments"}, {"id": "loudness-race", "title": "The mix feels quiet beside a released song", "category": "Finishing", "symptom": "You keep pushing the limiter because the commercial reference sounds more impressive.", "check": ["Turn down the reference until perceived loudness is similar. Keep the reference out of your mix-bus processing and exclude it from exports.", "Measure integrated LUFS over the complete song and inspect true peak with an appropriate meter. A sample-peak reading, a loud chorus reading, and whole-song loudness describe different things."], "try": ["Judge tonal balance, vocal placement, punch, and space at matched loudness before choosing final loudness.", "Use Loudness Meter for integrated measurement and MultiMeter's True Peak mode where available. Reset the measurement before a full pass.", "For a mix going to another mastering engineer, supply a clean, unclipped file and follow their delivery request. For a self-master, choose dynamics deliberately and check current delivery specifications; -14 LUFS is not a universal artistic or mastering requirement."], "avoid": "Do not sacrifice the kick, vocal, or chorus lift just to hit one LUFS number. Normalization does not repair distortion or make every song feel equally punchy.", "verify": "A level-matched comparison still favors the processing, the exported file sounds clean, and its format and measured limits meet the actual destination's requirements.", "lesson": "finish"}], "glossary": [{"term": "Signal flow", "definition": "The route audio takes through a session, including tracks, plug-ins, sends, buses, and the final output.", "example": "Trace a vocal from its audio region through EQ and compression to the stereo output.", "lesson": "setup"}, {"term": "Insert", "definition": "An effect placed directly in a channel's signal path. Its position determines which processing happens before or after it.", "example": "An EQ before compression changes what the compressor hears; an EQ afterward changes the compressed result.", "lesson": "setup"}, {"term": "Send", "definition": "A separate feed from a channel to another destination, usually with its own level control. It can operate alongside the channel's main output.", "example": "Keep the dry vocal at the stereo output while sending a little of it to a reverb aux.", "lesson": "space"}, {"term": "Output routing", "definition": "The destination for a channel's main signal. Changing it redirects that signal; a send creates an additional feed.", "example": "Route all drum tracks to a drum group, then route that group to the stereo output.", "lesson": "setup"}, {"term": "Bus", "definition": "An internal audio route that carries one or more signals to another channel or destination.", "example": "Several harmony sends can use one bus to reach a shared reverb aux.", "lesson": "setup"}, {"term": "Aux channel", "definition": "A channel that receives routed audio, often for shared effects or group processing.", "example": "Put reverb on an aux so multiple tracks can share the same simulated room.", "lesson": "space"}, {"term": "Gain", "definition": "An increase or decrease in signal level. Where gain changes occur matters because they can affect how later processors respond.", "example": "Reducing level before a compressor can reduce compression; lowering the channel fader afterward usually changes the listening balance.", "lesson": "level"}, {"term": "Fader / volume", "definition": "A channel control that adjusts its level at that point in the signal path. Perceived loudness also depends on frequency, dynamics, and listening conditions.", "example": "Lower the guitar fader to make room for the vocal without changing the guitar's recorded waveform.", "lesson": "level"}, {"term": "Headroom", "definition": "The space between a signal's current level and a relevant overload or processing limit.", "example": "Leave recording peaks below the converter's maximum so an unexpectedly loud phrase does not clip.", "lesson": "level"}, {"term": "Clipping", "definition": "Distortion caused when a signal exceeds a system's available range and its peaks are constrained. Hard clipping creates abrupt waveform changes.", "example": "A clipped microphone input may stay distorted even after you lower the playback fader.", "lesson": "record"}, {"term": "Saturation", "definition": "Nonlinear processing that adds harmonics and often rounds peaks. It usually changes progressively with input level rather than imposing an abrupt hard limit.", "example": "A small amount can make a bass easier to hear on small speakers; too much can blur its attack.", "lesson": "tone"}, {"term": "Peak level", "definition": "The highest measured signal level over a period. Peak readings describe brief extremes rather than sustained energy or perceived loudness.", "example": "A snare can peak higher than a sustained pad while still sounding quieter overall.", "lesson": "level"}, {"term": "Average level", "definition": "A measure of signal level over time rather than its highest instant. Results depend on the averaging method and time window.", "example": "Compression can raise sustained level after compensation even when the highest peaks stay similar.", "lesson": "level"}, {"term": "dBFS", "definition": "Decibels relative to digital full scale. On a sample-peak meter, 0 dBFS is the maximum representable sample level in a fixed-point digital signal.", "example": "A sample peak at −12 dBFS sits 12 decibels below full scale; it does not describe perceived loudness.", "lesson": "level"}, {"term": "dBTP", "definition": "Decibels of true peak relative to full scale. True-peak metering estimates reconstructed waveform peaks that may fall between digital samples.", "example": "A mix can show safe sample peaks while its true peaks exceed them.", "lesson": "finish"}, {"term": "LUFS", "definition": "A loudness measurement using frequency weighting and standardized averaging. Integrated LUFS describes a whole measured passage; short-term and momentary readings describe shorter windows.", "example": "Compare integrated loudness across full songs, then listen for whether transitions and vocal balance still feel right.", "lesson": "finish"}, {"term": "Latency", "definition": "The delay between an input or action and the resulting sound. Buffers, conversion, and some plug-ins contribute to it.", "example": "If a singer hears a distracting echo while recording, check monitoring routes, buffer settings, and processing delay.", "lesson": "record"}, {"term": "Sample rate", "definition": "The number of digital audio samples captured or played per second. It determines the highest frequency a sampled system can represent.", "example": "Keep the session and delivery specifications consistent; a higher sample rate cannot repair a poorly recorded vocal.", "lesson": "record"}, {"term": "Bit depth", "definition": "The precision available for storing sample levels. In fixed-point audio, greater bit depth allows a lower quantization noise floor.", "example": "Confirm the requested export bit depth before making the final delivery files.", "lesson": "finish"}, {"term": "Comping", "definition": "Combining chosen sections from multiple takes into one performance while preserving musical continuity.", "example": "Use the first take's verse and the third take's chorus, checking breaths and phrase transitions.", "lesson": "edit"}, {"term": "Crossfade", "definition": "An overlap in which one audio section fades out as another fades in, helping smooth an edit.", "example": "Add a short crossfade at a vocal edit, then check that it does not smear a consonant.", "lesson": "edit"}, {"term": "Region gain", "definition": "A level adjustment attached to an audio region before channel processing. It changes the level reaching effects such as compression.", "example": "Turn down one unusually loud phrase with region gain so the compressor receives a more consistent performance.", "lesson": "edit"}, {"term": "Fader automation", "definition": "Recorded or drawn changes to a channel's fader over time. It controls musical balance after earlier processing in the channel path.", "example": "Lift the last word of a line without using region gain to change how hard that word hits the compressor.", "lesson": "automation"}, {"term": "Pitch correction", "definition": "Processing that changes a performance's pitch toward selected notes or a musical target. Timing and strength shape how natural or obvious it sounds.", "example": "Correct a distracting note gently, or use rapid correction deliberately for a stylized vocal effect.", "lesson": "pitch"}, {"term": "Formants", "definition": "Resonant frequency patterns that help define vowel sounds and vocal character. They are related to vocal-tract shape rather than simply the sung note.", "example": "A pitch shift can sound unnaturally small or deep if the formant character changes too much.", "lesson": "pitch"}, {"term": "EQ", "definition": "Equalization: changing the balance of frequency regions in a sound with filters or bands.", "example": "Reduce a muddy low-mid buildup while checking that the singer still sounds full in the mix.", "lesson": "eq"}, {"term": "High-pass filter", "definition": "A filter that attenuates low frequencies below its transition region while allowing higher frequencies through. Its slope controls how quickly attenuation increases.", "example": "Reduce unwanted microphone rumble, stopping before the vocal loses useful weight.", "lesson": "eq"}, {"term": "Masking", "definition": "When one sound makes another harder to hear because their energy overlaps in frequency, time, or both.", "example": "A bright guitar strum may hide vocal consonants even when the vocal meter shows plenty of level.", "lesson": "instruments"}, {"term": "Q / bandwidth", "definition": "A way to describe how narrow or broad a filter's effect is. For a typical bell band, higher Q affects a narrower frequency region.", "example": "Use a narrow bell to investigate a ringing tone and a broader curve for overall tonal shaping.", "lesson": "eq"}, {"term": "Dynamic EQ", "definition": "EQ whose band gain changes in response to signal level or a detector signal. It controls selected frequency regions only when needed.", "example": "Reduce a harsh upper-mid band only on forceful phrases while leaving softer phrases more open.", "lesson": "eq"}, {"term": "Compressor", "definition": "A processor that reduces level according to signal strength and settings. Threshold, ratio, attack, and release determine how it controls dynamics.", "example": "Use compression to steady vocal phrases, then compare at matched listening loudness.", "lesson": "compress"}, {"term": "Threshold", "definition": "The detector level around which dynamics processing begins to act. The knee and processor design affect how gradually the action starts.", "example": "Lowering a compressor's threshold usually makes it affect more of the performance.", "lesson": "compress"}, {"term": "Ratio", "definition": "A compressor setting describing the relationship between input and output level increases above threshold once its response has settled.", "example": "At 4:1, a 4 dB input increase above threshold becomes about a 1 dB output increase in an idealized response.", "lesson": "compress"}, {"term": "Attack", "definition": "How quickly a dynamics processor moves toward its intended gain reduction after detecting a qualifying signal. Exact timing behavior varies by design.", "example": "A slower compressor attack may let more of a drum's initial hit through.", "lesson": "compress"}, {"term": "Release", "definition": "How quickly a dynamics processor returns from gain reduction as its detector signal falls. The timing affects movement, sustain, and pumping.", "example": "If compression keeps the next vocal phrase pinned down, try a quicker release and listen again.", "lesson": "compress"}, {"term": "Multiband compression", "definition": "Compression applied independently to frequency bands separated by crossovers. Dynamic EQ instead changes selected EQ filters; the approaches can overlap in purpose.", "example": "Control an unstable low end without making every kick hit pull down the entire mix.", "lesson": "compress"}, {"term": "De-esser", "definition": "A dynamics processor designed to reduce excessive sibilance, often by detecting high-frequency energy and reducing a frequency band or the whole signal.", "example": "Tame sharp S sounds while checking that the singer's consonants remain clear.", "lesson": "deess"}, {"term": "Phase", "definition": "The position of a repeating waveform within its cycle. Relative phase affects reinforcement and cancellation when related signals combine.", "example": "Two microphones on one guitar can sound hollow together because their arrival times create frequency-dependent phase differences.", "lesson": "instruments"}, {"term": "Polarity", "definition": "The positive-versus-negative orientation of a waveform. Inverting polarity flips its sign; it does not move the recording in time.", "example": "Try polarity inversion when combining microphones, but check timing too: inversion cannot fix every frequency-dependent cancellation.", "lesson": "instruments"}, {"term": "Mono compatibility", "definition": "How well a mix retains its important sounds and balance when left and right channels are combined into mono.", "example": "Collapse a wide harmony effect to mono and check that the words do not disappear.", "lesson": "reference"}, {"term": "Stereo width", "definition": "The perceived spread of sound between and beyond the speakers, influenced by level, timing, and tonal differences between channels.", "example": "Two separately performed harmony takes can create useful width when panned apart.", "lesson": "harmony"}, {"term": "Panning", "definition": "Controlling a sound's placement across the stereo field. A stereo channel's control may adjust balance or stereo positioning depending on its mode.", "example": "Pan supporting guitar parts apart to create room around a centered lead vocal.", "lesson": "harmony"}, {"term": "Reverb", "definition": "The dense reflections and decay that follow a sound in a space, or processing that simulates them.", "example": "A short room can connect dry recordings; a long hall can create distance and drama.", "lesson": "space"}, {"term": "Delay", "definition": "One or more delayed copies of a sound. Time, feedback, filtering, and level control the spacing, repetition, and character.", "example": "Automate a delay send on the final word of a line so its echoes fill the gap.", "lesson": "space"}, {"term": "Limiter", "definition": "A dynamics processor intended to restrict peaks near a set ceiling. True-peak protection depends on the limiter's design and settings.", "example": "Catch occasional output peaks, then check that louder settings do not flatten the song's punch.", "lesson": "finish"}, {"term": "Stems", "definition": "Exported audio files representing grouped parts of a production, such as drums, vocals, or guitars. Agree on grouping and processing before delivery.", "example": "Deliver aligned drum, bass, instrument, lead-vocal, and backing-vocal stems with their shared start point clearly specified.", "lesson": "finish"}, {"term": "Multitracks", "definition": "Separate audio exports of individual tracks for rebuilding or remixing a session. Specify whether effects, edits, and automation should be included.", "example": "Export each microphone and instrument separately from the same start point so another engineer can align them.", "lesson": "finish"}, {"term": "Dither", "definition": "Low-level noise added before reducing fixed-point bit depth to make quantization error less correlated with the signal. It is normally part of final conversion.", "example": "When creating a lower-bit-depth final file, follow the delivery workflow and avoid unintentionally applying dither multiple times.", "lesson": "finish"}], "sources": [{"id": "routing", "title": "Apple · Send effects and aux routing", "url": "https://support.apple.com/nl-nl/guide/logicpro/lgcp8ea0091c/10.7/mac/11.0", "note": "Send destinations and pre-fader, post-fader, and post-pan behavior."}, {"id": "latency", "title": "Apple · Input monitoring latency", "url": "https://support.apple.com/en-gb/105040", "note": "Buffer size, wired monitoring, and Low Latency Mode."}, {"id": "pitch", "title": "Apple · Flex Pitch editing and hotspots", "url": "https://support.apple.com/guide/logicpro/edit-pitch-and-timing-with-flex-pitch-lgcpc53e6bef/10.7/mac/11.0", "note": "Verified positions of pitch drift, vibrato, gain, fine pitch, and formant controls."}, {"id": "eq", "title": "Apple · Channel EQ parameters", "url": "https://support.apple.com/en-ie/guide/logicpro/lgcef1edc1d7/mac", "note": "Filter shapes, frequency, gain, Q, and analyzer behavior."}, {"id": "compress", "title": "Apple · Compressor controls", "url": "https://support.apple.com/nl-nl/guide/logicpro/lgcead9636ef/mac", "note": "Models, threshold, ratio, timing, knee, make-up gain; some controls vary by model."}, {"id": "compress-use", "title": "Apple · Using Compressor", "url": "https://support.apple.com/en-gb/guide/logicpro/lgcef1bec9f3/12.3/mac/15.6", "note": "Detector response, knee, and side-chain concepts. Guide version differs from older Logic Pro X installations."}, {"id": "deess", "title": "Apple · DeEsser 2", "url": "https://support.apple.com/guide/logicpro/deesser-2-controls-lgcef1bec850/10.7/mac/11.0", "note": "Relative/Absolute modes, filtering, Split/Wide range, and maximum reduction."}, {"id": "reverb", "title": "Apple · Using ChromaVerb", "url": "https://support.apple.com/en-mide/101842", "note": "Main controls, damping, and output EQ."}, {"id": "pan", "title": "Apple · Pan, balance, and Stereo Pan", "url": "https://support.apple.com/guide/logicpro/set-channel-strip-pan-or-balance-positions-lgcpbc21a438/10.7/mac/11.0", "note": "Differences between mono panning, stereo balance, and Stereo Pan."}, {"id": "automation", "title": "Apple · Automation modes", "url": "https://support.apple.com/guide/logicpro/choose-automation-modes-lgcpb1a6ab26/12.3/mac/15.6", "note": "Read, Touch, Latch, Write, Trim, and Relative behavior."}, {"id": "bounce", "title": "Apple · PCM bounce options", "url": "https://support.apple.com/guide/logicpro/pcm-bounce-options-lgcpb7e35135/10.7/mac/11.0", "note": "PCM format, bit depth, and dithering options."}, {"id": "dither", "title": "Apple · Dithering algorithms", "url": "https://support.apple.com/guide/logicpro/about-dithering-algorithms-lgcp44da971f/10.7/mac/11.0", "note": "Word-length reduction and avoiding repeated dither."}, {"id": "chroma", "title": "Apple · ChromaGlow", "url": "https://support.apple.com/en-ie/guide/logicpro/lgcp0a30400b/mac", "note": "Optional saturation tool requiring Apple silicon."}, {"id": "mastering", "title": "Apple · Logic Pro 10.8 additions", "url": "https://support.apple.com/en-az/guide/logicpro/lgcp55247cb8/mac", "note": "Mastering Assistant introduction."}, {"id": "compatibility", "title": "Apple · Feature availability by hardware", "url": "https://support.apple.com/en-la/120406", "note": "Intel and Rosetta restrictions for ChromaGlow and some Mastering Assistant characters."}, {"id": "versions", "title": "Apple · Logic Pro 10.4 release history", "url": "https://support.apple.com/en-us/101173", "note": "ChromaVerb and Vintage EQ in 10.4; DeEsser 2 in 10.4.5."}, {"id": "loudness", "title": "Spotify · Loudness normalization", "url": "https://support.spotify.com/bj-en/artists/article/loudness-normalization/", "note": "Platform-specific playback normalization and mastering guidance; not a universal specification for every release."}, {"title": "Apple: Get started with the Logic Pro Audio Track Editor", "url": "https://support.apple.com/en-au/guide/logicpro/lgcpb4640a57/10.7/mac/11.0", "note": "Supports non-destructive Audio Track Editor operations and choosing Flex Pitch in the editor. Version-specific labels may differ from the installed Logic Pro X version."}, {"title": "Apple: Channel strip types in Logic Pro", "url": "https://support.apple.com/en-gb/guide/logicpro/lgcpbc2192ea/10.7/mac/11.0", "note": "Supports aux channel strips as effect-send returns and grouping destinations."}, {"title": "Apple: Stereo Delay in Logic Pro", "url": "https://support.apple.com/en-asia/guide/logicpro/lgcef18b892f/10.7/mac/11.0", "note": "Supports millisecond or tempo-synced note delay times, feedback, and filtering. Suggested values in genre profiles are listening experiments, not fixed settings."}, {"title": "Apple: Quantize pitch in the Audio Track Editor in Logic Pro", "url": "https://support.apple.com/en-ge/guide/logicpro/lgcp8836920c/10.7/mac/11.0", "note": "Supports single-note/monophonic suitability of Flex Pitch quantization and the limitations with chords or unpitched sounds; basis for choir and extreme-vocal cautions."}, {"title": "Apple: Before recording audio in Logic Pro", "url": "https://support.apple.com/guide/logicpro/before-recording-audio-lgcpb19de615/10.7/mac/11.0", "note": "Recording preparation; distinguishes monitoring level from recording level and explains direct versus software monitoring. Versioned 10.7 page is appropriate background for Logic Pro X users."}, {"title": "Apple: Reduce sibilance in Logic Pro", "url": "https://support.apple.com/en-mide/102006", "note": "DeEsser 2 frequency, threshold, Max Reduction, Relative and Absolute modes, Split/Wide, and filter choices. Diagnostic content avoids treating gender-based ranges as universal."}, {"title": "Apple: Gain plug-in", "url": "https://support.apple.com/nl-nl/guide/logicpro/lgcef2d8c650/mac", "note": "Utility > Gain includes Mono and Phase Invert controls; stereo instances expose Mono. Polarity reversal changes combinations of related signals, not the sound of an isolated source."}, {"title": "Apple: Loudness Meter", "url": "https://support.apple.com/nl-nl/guide/logicpro/lgce12d9d256/mac", "note": "Metering > Loudness Meter; momentary, short-term, and integrated loudness; Reset and Start/Pause for a complete measurement."}, {"title": "Apple: MultiMeter level and loudness", "url": "https://support.apple.com/en-gb/guide/logicpro/lgcef24f3f21/mac", "note": "Distinguishes peak/RMS, true-peak options, LU-I and LU-S. True peak is a separate diagnostic from integrated loudness."}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('desk-data').textContent);
const {lessons,genres,problems,glossary,sources}=DATA;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const palette=['#d9f4eb','#f6c9d7','#ffeaa1','#dceafa','#e8def7','#ffd8bd'];
const stageColors=[['#fff1b8','#ffc93c'],['#cff5e1','#4fd1a1'],['#e4d9ff','#a98bff'],['#ffdcc8','#ff9a62'],['#cdebff','#58b8ff'],['#ffd3e4','#ff6fa8'],['#e4f7b8','#a3dc3c'],['#ffe3b8','#ffaa2b'],['#d5dcff','#7d91ff'],['#ffd6dc','#ff7a8a'],['#c9f2ee','#2ec4b6'],['#f3d4ff','#cf7dff'],['#d2f5f9','#3cc3dc'],['#fff1b8','#ffc93c'],['#cff5e1','#4fd1a1'],['#ffd3e4','#ff6fa8']];
const displayTitles=['Set up the <em>mix</em>','Capture the <em>feeling</em>','Clean <em>up</em>','Give it <em>space</em>','Pitch & <em>pocket</em>','Level by <em>hand</em>','Shape the <em>EQ</em>','<em>Compress</em>','De-<em>ess</em>','Tone & <em>texture</em>','Room, plate, <em>delay</em>','Build the <em>harmonies</em>','Fit the <em>band</em>','<em>Ride</em> it','Trust your <em>ears</em>','Check & <em>bounce</em>'];
const KEY='vocal-mix-desk-field-guide-v1';
const NOTE_KEYS=['heard','tried','changed'];
const NOTE_LABELS=['What we heard','What we tried','What changed / ask next'];
const sections=[['learn','01','Mixing workflow'],['genres','02','Genre guides'],['problems','03','Find a fix'],['lab','04','Practice lab'],['glossary','05','Glossary'],['notebook','06','Session notebook']];
let storageOK=true, toastTimer, route={view:'learn',id:'setup'}, filter='All', localQuery='', lab={threshold:-18,ratio:4,makeup:0,input:-10,bpm:120,band:3};
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const clip=(v,n)=>typeof v==='string'?v.slice(0,n):'';
const fresh=(name='First listening session',learner='Sophia + mentor',genre='all')=>({id:uid(),name,learner,genre,brief:'',reference:'',checks:{},notes:{},created:new Date().toISOString()});
function cleanSession(x){
 if(!x||typeof x!=='object'||typeof x.name!=='string') return null;
 const s=fresh(clip(x.name,120)||'Untitled session',clip(x.learner,80)||'Sophia + mentor',genres.some(g=>g.id===x.genre)?x.genre:'all');
 s.id=clip(x.id,80)||uid();s.brief=clip(x.brief,8000);s.reference=clip(x.reference,3000);s.created=clip(x.created,60)||s.created;
 for(const l of lessons){
  for(let i=0;i<l.checklist.length;i++){const k=l.id+':'+i;if(x.checks?.[k]===true)s.checks[k]=true;}
  s.notes[l.id]={};for(const k of NOTE_KEYS)s.notes[l.id][k]=clip(x.notes?.[l.id]?.[k],10000);
 }
 return s;
}
let state;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw?.version===1&&Array.isArray(raw.sessions)){const sessions=raw.sessions.slice(0,100).map(cleanSession).filter(Boolean);if(sessions.length)state={version:1,sessions,active:sessions.some(s=>s.id===raw.active)?raw.active:sessions[0].id};}}
catch(e){storageOK=false;}
if(!state){const s=fresh();state={version:1,sessions:[s],active:s.id};}
const session=()=>state.sessions.find(s=>s.id===state.active)||state.sessions[0];
const genre=()=>genres.find(g=>g.id===session().genre);
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4200);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}document.querySelectorAll('.saved').forEach(el=>el.textContent=storageOK?'Saved in this browser':'Storage unavailable · export to keep notes');}
function checklistCount(l){return l.checklist.filter((_,i)=>session().checks[l.id+':'+i]).length;}
function renderNavigation(){
 $('#mainnav').innerHTML=sections.map(([v,n,t])=>`<button data-view="${v}" ${route.view===v?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${n}</span>${t}</button>`).join('');
 $('#lessonnav').innerHTML=lessons.map((l,i)=>`<button style="--bubble:${stageColors[i][1]}" data-lesson="${l.id}" ${route.view==='learn'&&route.id===l.id?'aria-current="step"':''}><span class="num">${checklistCount(l)===l.checklist.length?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(l.short)}</span></button>`).join('');
 $('#genreSelect').innerHTML='<option value="all">Any style / explore</option>'+genres.map(g=>`<option value="${g.id}" ${session().genre===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
 const total=lessons.reduce((n,l)=>n+l.checklist.length,0),done=lessons.reduce((n,l)=>n+checklistCount(l),0);
 $('#progressText').textContent=`${done} / ${total}`;$('#progressFill').style.width=done/total*100+'%';$('.progress').setAttribute('aria-valuenow',done);$('.progress').setAttribute('aria-valuemax',total);
}
function context(){return `<div class="contextline"><span>TECH CENTER &nbsp; / &nbsp; LOGIC PRO FIELD GUIDE</span><button data-view="notebook">${esc(session().name)}</button></div>`;}
function footer(){return `<div class="footerline"><span>Listen. Change one thing. Compare at equal loudness.</span><button class="textlink" data-view="sources">Sources, Logic versions &amp; using this desk</button></div>`;}
function pageTitle(kicker,title,description){return `<div class="hero-simple"><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>`;}
function sourceLinks(ids){return ids.map(id=>sources.find(s=>s.id===id)).filter(Boolean).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('');}
function render(){
 const colorIndex=route.view==='learn'?Math.max(0,lessons.findIndex(l=>l.id===route.id)):Math.max(0,sections.findIndex(s=>s[0]===route.view))*2+1;
 const color=stageColors[colorIndex%stageColors.length];$('body').setAttribute('style',`--page:${color[0]};--accent:${color[1]}`);
 renderNavigation();
 const views={learn:renderLesson,genres:renderGenres,problems:renderProblems,glossary:renderGlossary,lab:renderLab,notebook:renderNotebook,sources:renderSources,search:renderSearch};
 $('#main').innerHTML=context()+(views[route.view]||renderLesson)()+footer();
 if(route.view==='lab')updateLab();
 document.title=(route.view==='learn'?(lessons.find(l=>l.id===route.id)?.short||'Mixing workflow'):sections.find(s=>s[0]===route.view)?.[2]||'Field guide')+' · Vocal Mix Desk';
}
function navigate(view,id='',push=true){
 route={view,id};filter='All';localQuery='';
 if(push)history.pushState(null,'','#'+view+(id?'/'+encodeURIComponent(id):''));
 render();closeMenu();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});
}

function renderLab(){return pageTitle('Learn a relationship; try it in Logic','The practice lab','Explore a simplified compression curve, tempo-based delay times, and frequency neighborhoods. These visual tools do not play or process audio.')+`<div class="stack"><section class="panel"><div class="eyebrow">01 / Dynamics</div><h2>What does the ratio actually do?</h2><p class="small muted">A hard-knee, steady-state model. Real compressors also respond over time and may add color.</p><div class="labgrid"><div><svg class="graph" viewBox="0 0 560 350" id="compGraph" role="img" aria-label="Compression transfer curve: input level on the horizontal axis, output level on the vertical axis"></svg><div class="readouts"><div class="readout">Input<strong id="inputRead"></strong></div><div class="readout">Output<strong id="outputRead"></strong></div><div class="readout">Gain reduction<strong id="grRead"></strong></div></div></div><div>${[['threshold','Threshold',-36,0,1,'dBFS'],['ratio','Ratio',1,10,.5,':1'],['makeup','Make-up gain',0,18,.5,'dB'],['input','Input level',-48,0,1,'dBFS']].map(([id,label,min,max,step,unit])=>`<label class="slider" for="lab-${id}"><span>${label}<output id="value-${id}"></output></span><input id="lab-${id}" data-lab="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${lab[id]}"></label>`).join('')}<button class="btn small" id="resetComp">Reset example</button><p class="labmessage" id="compMessage" aria-live="polite"></p></div></div><div class="note">Try this: threshold −18 dBFS, input −10 dBFS, ratio 4:1, make-up 0 dB. The input is 8 dB over threshold; the output is 2 dB over threshold (−16 dBFS), so reduction is 6 dB.</div></section>
