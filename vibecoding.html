<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Coding — Sign In</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="sheet.css">
<style>
  /* ---- Vibe Coding's own "bent": terminal lime ---- */
  :root{ --bgc:#dcf8cc; --ac:#7ee03a; --stripe:#2f8f1f; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>
<script src="names.js"></script>
<script src="milestones.js"></script>
<script src="sheet.js"></script>

<div class="ttc-wrap" id="app"></div>

<script>
/* Vibe Coding: twice a month, launching March 2027. Demo on the TV, then open build.
   Edit the questions right here. How the list works is explained at the top of sheet.js. */
TTCSheet.mount({
  title: "Vibe Coding",
  table: "vibecoding_visits",
  program: "vibecoding",          // A&P milestones on (wording lives in milestones.js)
  eyebrow: "Kings Highway · Vibe Coding",
  headline: ["Sign in to", "vibe code"],
  hereLabel: "building right now",
  listTitle: "Building today",
  toast: "Signed in. Go build.",
  fields: [
    { key:"stage", label:"where are you at today", type:"choice",
      options:["Watching demo","Building my own"] },
    { key:"building", label:"what are you building", type:"text", placeholder:"tool or app name" },
    { key:"returning_builder", label:"been to vibe coding before", type:"choice",
      options:["First time","Returning builder"],
      hint:"Returning builders earn a flash drive." },
  ]
});
</script>
</body>
</html>
