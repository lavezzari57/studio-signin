<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program Calendar</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* ---- CALENDAR's own "bent": fresh green wash + ink. Same Studio Sticker DNA. ---- */
  :root{ --bgc:#d9f2df; --ac:#2fb36a; }

  .lead { margin: 4px 0 16px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 16px; justify-content:space-between; }
  .lead .ttl h2 { font-family:var(--display); font-weight:800; font-size:clamp(34px,8vw,60px); line-height:.9; letter-spacing:-.035em; margin:6px 0 4px; }
  .lead .ttl h2 em { font-style:normal; display:inline-block; background:var(--ac); color:#fff; border:var(--b); border-radius:.2em; padding:0 .14em .04em; transform:rotate(-2deg); box-shadow:var(--shadow-sticker); }
  .hours { font-family:var(--mono); font-size:13px; color:var(--muted); }

  .bar2 { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .seg { display:inline-flex; border:var(--b); border-radius:999px; overflow:hidden; box-shadow:var(--shadow-sticker-sm); }
  .seg button { font:inherit; font-family:var(--display); font-weight:800; cursor:pointer; border:0; background:var(--paper); color:var(--ink); padding:10px 18px; }
  .seg button[aria-selected="true"] { background:var(--ink); color:var(--paper); }
  .spacer { flex:1; }
  .mnav { display:inline-flex; align-items:center; gap:10px; }
  .mnav button { font:inherit; font-family:var(--display); font-weight:800; cursor:pointer; width:48px; height:48px; border:var(--b); border-radius:50%; background:var(--paper); box-shadow:var(--shadow-sticker-sm); }
  .mnav button:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .mnav button[disabled]{ opacity:.35; pointer-events:none; }
  .mlabel { font-family:var(--display); font-weight:800; font-size:20px; min-width:150px; text-align:center; }

  .legend { display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:16px; }
  .lg { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .dot { width:15px; height:15px; border-radius:5px; border:2px solid var(--ink); }

  .grid-wrap { background:var(--paper); border:var(--b); border-radius:var(--radius); box-shadow:var(--shadow-sticker); overflow:hidden; }
  .dow { display:grid; grid-template-columns:repeat(7,1fr); background:color-mix(in srgb, var(--ac) 16%, var(--paper)); border-bottom:var(--b); }
  .dow span { font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:center; padding:9px 0; }
  .cells { display:grid; grid-template-columns:repeat(7,1fr); }
  .cell { min-height:94px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; display:flex; flex-direction:column; gap:4px; }
  .cell:nth-child(7n){ border-right:0; }
  .cell.out { background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(30,26,43,.03) 6px,rgba(30,26,43,.03) 12px); }
  .cell .dnum { font-family:var(--display); font-weight:700; font-size:14px; color:var(--muted); }
  .cell.today .dnum { background:var(--ink); color:var(--paper); border-radius:50%; width:26px; height:26px; display:grid; place-items:center; }
  .ev { font-size:11.5px; font-weight:600; line-height:1.15; border:2px solid var(--ink); border-radius:7px; padding:2px 5px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-shadow:1.5px 1.5px 0 var(--ink); }
  .more { font-family:var(--mono); font-size:10.5px; color:var(--muted); cursor:pointer; }

  .list { display:flex; flex-direction:column; gap:14px; }
  .daygroup { background:var(--paper); border:var(--b); border-radius:var(--radius); box-shadow:var(--shadow-sticker); overflow:hidden; }
  .daygroup h4 { font-family:var(--display); font-weight:800; font-size:17px; margin:0; padding:12px 16px; background:color-mix(in srgb, var(--ac) 14%, var(--paper)); border-bottom:var(--b); }
  .li { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:flex-start; cursor:pointer; }
  .li:last-child{ border-bottom:0; }
  .li .time { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:74px; padding-top:2px; }
  .li .body b { font-family:var(--display); font-size:16px; }
  .li .chip { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; border:2px solid var(--ink); border-radius:999px; padding:1px 8px; margin-left:8px; vertical-align:middle; }

  .status { font-family:var(--mono); font-size:12.5px; color:var(--muted); margin:16px 0 0; }
  .tvbtn { position:fixed; right:16px; bottom:16px; z-index:30; }

  h2.modal-h { font-family:var(--display); font-weight:800; letter-spacing:-.02em; margin:0 0 4px; }
  .modal-meta { font-family:var(--mono); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

  /* =======================================================================
     TV WALL MODE — fills the screen, big grid + live rail, motion.
     ======================================================================= */
  @keyframes omfall { 0%{transform:translate3d(0,-14vh,0) rotate(0)} 100%{transform:translate3d(5vw,114vh,0) rotate(320deg)} }
  @keyframes omrise { 0%{transform:translate3d(0,112vh,0) scale(1);opacity:0} 18%{opacity:.5} 100%{transform:translate3d(4vw,-12vh,0) scale(.5);opacity:0} }
  @keyframes tickmove { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
  @keyframes cardIn { 0%{opacity:0;transform:translateY(14px) rotate(-1deg)} 100%{opacity:1;transform:translateY(0) rotate(0)} }
  @keyframes pulseDot { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }

  body.tv { overflow:hidden; height:100vh; }
  body.tv .ttc-topbar, body.tv .bar2, body.tv .legend, body.tv .status, body.tv .tvbtn { display:none; }
  body.tv .ttc-wrap { max-width:none; margin:0; padding:0; height:100vh; }

  .tv-stage { display:none; }
  body.tv .tv-stage { display:grid; grid-template-columns: 62% 38%; height:100vh; position:relative; overflow:hidden; }
  body.tv #app > *:not(.tv-stage) { display:none; }

  .tv-orn { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .tv-orn i { position:absolute; border-radius:50%; display:block; }

  .tv-left { position:relative; z-index:1; padding:2.6vh 1.6vw 2.2vh 2.4vw; display:flex; flex-direction:column; min-width:0; }
  .tv-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:1.6vh; flex:0 0 auto; }
  .tv-head .k { font-family:var(--mono); font-size:1.1vh; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .tv-head h1 { font-family:var(--display); font-weight:800; font-size:4.6vh; letter-spacing:-.03em; margin:.3vh 0 0; line-height:.95; }
  .tv-head h1 em { font-style:normal; background:var(--ac); color:#fff; border:var(--b); border-radius:.16em; padding:0 .12em .04em; transform:rotate(-2deg); display:inline-block; box-shadow:var(--shadow-sticker); }
  .tv-head .clock { text-align:right; font-family:var(--display); font-weight:800; }
  .tv-head .clock .t { font-size:4.4vh; line-height:1; letter-spacing:-.02em; }
  .tv-head .clock .d { font-family:var(--mono); font-size:1.3vh; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:.4vh; }

  .tv-grid { flex:1 1 auto; display:flex; flex-direction:column; background:var(--paper); border:var(--b); border-radius:1.4vh; box-shadow:var(--shadow-sticker); overflow:hidden; min-height:0; }
  .tv-dow { display:grid; grid-template-columns:repeat(7,1fr); background:color-mix(in srgb,var(--ac) 16%,var(--paper)); border-bottom:var(--b); }
  .tv-dow span { font-family:var(--mono); font-size:1.1vh; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; padding:1vh 0; }
  .tv-cells { flex:1 1 auto; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; min-height:0; }
  .tv-cell { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:.7vh .6vw; display:flex; flex-direction:column; gap:.4vh; overflow:hidden; min-width:0; }
  .tv-cell:nth-child(7n){ border-right:0; }
  .tv-cell.out { background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(30,26,43,.03) 8px,rgba(30,26,43,.03) 16px); }
  .tv-cell .dn { font-family:var(--display); font-weight:700; font-size:1.5vh; color:var(--muted); }
  .tv-cell.today { background:color-mix(in srgb,var(--ac) 12%,var(--paper)); }
  .tv-cell.today .dn { background:var(--ink); color:var(--paper); border-radius:50%; width:3vh; height:3vh; display:grid; place-items:center; font-size:1.5vh; }
  .tv-ev { font-size:1.15vh; font-weight:700; line-height:1.1; border:2px solid var(--ink); border-radius:.6vh; padding:.2vh .4vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-shadow:1px 1px 0 var(--ink); }
  .tv-more { font-family:var(--mono); font-size:1vh; color:var(--muted); }

  .tv-right { position:relative; z-index:1; background:color-mix(in srgb,var(--ac) 10%,var(--bgc)); border-left:var(--b); padding:2.6vh 1.8vw 0; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .tv-right .sec-k { font-family:var(--mono); font-size:1.2vh; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:.8vh; display:flex; align-items:center; gap:.6vw; }
  .tv-right .sec-k .live { width:1vh; height:1vh; border-radius:50%; background:var(--ac); border:2px solid var(--ink); animation:pulseDot 1.6s ease-in-out infinite; }
  .tv-today { flex:0 0 auto; margin-bottom:2vh; }
  .tv-card { background:var(--paper); border:var(--b); border-radius:1.2vh; box-shadow:var(--shadow-sticker-sm); padding:1.2vh 1.1vw; margin-bottom:1vh; animation:cardIn .5s ease both; }
  .tv-card .cd-top { display:flex; align-items:center; gap:.6vw; margin-bottom:.4vh; }
  .tv-card .cd-kind { font-family:var(--mono); font-size:1vh; letter-spacing:.06em; text-transform:uppercase; border:2px solid var(--ink); border-radius:999px; padding:.1vh .5vw; }
  .tv-card .cd-time { font-family:var(--mono); font-size:1.2vh; color:var(--muted); margin-left:auto; }
  .tv-card .cd-title { font-family:var(--display); font-weight:800; font-size:2.3vh; line-height:1; letter-spacing:-.02em; }
  .tv-card .cd-loc { font-family:var(--mono); font-size:1.2vh; color:var(--muted); margin-top:.4vh; }
  .tv-card.big .cd-title { font-size:2.8vh; }
  .tv-empty { font-family:var(--display); font-weight:700; font-size:2vh; color:var(--muted); }

  .tv-week { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .tv-week .scroller { flex:1 1 auto; overflow:hidden; position:relative; }
  .tv-week .scroll-inner { display:flex; flex-direction:column; gap:1vh; }

  /* bottom ticker crawl */
  .tv-ticker { position:absolute; left:0; right:0; bottom:0; z-index:3; height:5.2vh; background:var(--ink); color:var(--paper); display:flex; align-items:center; overflow:hidden; border-top:var(--b); }
  .tv-ticker .tag { flex:0 0 auto; background:var(--ac); color:#fff; font-family:var(--display); font-weight:800; font-size:1.8vh; padding:0 1.2vw; height:100%; display:flex; align-items:center; letter-spacing:.02em; border-right:var(--b); }
  .tv-ticker .crawl { flex:1 1 auto; overflow:hidden; white-space:nowrap; }
  .tv-ticker .crawl .run { display:inline-block; white-space:nowrap; animation:tickmove 40s linear infinite; font-family:var(--display); font-weight:700; font-size:1.9vh; padding-left:100%; }
  .tv-ticker .crawl .run span { margin:0 2.4vw; }
  .tv-ticker .crawl .run .kdot { display:inline-block; width:1.2vh; height:1.2vh; border-radius:50%; border:2px solid var(--paper); margin-right:.5vw; vertical-align:middle; }
  body.tv .tv-left, body.tv .tv-right { padding-bottom:6vh; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>

<div class="ttc-wrap" id="app"></div>
<button class="ttc-btn tvbtn" id="tvbtn">TV mode</button>

<script>
TTCBar.mount("Program Calendar");

/* EVENTS:START */
const EVENTS = [
  { id:"studio-orientation", title:"Studio Orientation", kind:"program", date:"2026-09-01", startTime:"14:00", endTime:"18:30", location:"Studio", blurb:"Learn the studio gear and the rules for using it. Drop in any Tuesday. You need this before you use the studio on your own.", recurrence:{freq:"weekly",weekday:2,until:"2026-10-27"}, skipDates:[] },
  { id:"linkedin-workshop", title:"LinkedIn Workshop", kind:"program", date:"2026-09-01", startTime:"14:00", endTime:"14:45", location:"Teen Tech Center", blurb:"Set up a LinkedIn profile and learn what to put on it. For ages 16 and up. Takes about 45 minutes.", recurrence:{freq:"biweekly",weekday:2,until:"2026-10-27"}, skipDates:[] },
  { id:"resume-workshop", title:"Resume Workshop", kind:"program", date:"2026-09-08", startTime:"14:00", endTime:"14:45", location:"Teen Tech Center", blurb:"Start or update your resume and get it read by someone before you send it out. Takes about 45 minutes.", recurrence:{freq:"biweekly",weekday:2,until:"2026-10-20"}, skipDates:[] },
  { id:"music-video", title:"Music Video Program", kind:"program", date:"2026-10-20", startTime:"15:00", endTime:"17:00", location:"Studio", blurb:"Plan, shoot and edit a music video in a group of four to six. You need Studio Orientation first.", recurrence:{freq:"weekly",weekday:2,until:"2026-10-27"}, skipDates:[] },
  { id:"cal", title:"CAL", kind:"program", date:"2026-09-03", startTime:"15:00", endTime:"17:00", location:"Teen Tech Center", blurb:"CAL meets every Thursday afternoon. Bring the project you are working on or start a new one.", recurrence:{freq:"weekly",weekday:4,until:"2026-10-29"}, skipDates:[] },
  { id:"youth-council", title:"Youth Council", kind:"program", date:"2026-09-10", startTime:"17:00", endTime:"19:00", location:"Teen Tech Center", blurb:"Help decide what programs and events run here. Meets every other Thursday evening.", recurrence:{freq:"biweekly",weekday:4,until:"2026-10-22"}, skipDates:[] },
  { id:"open-mic", title:"Open Mic", kind:"event", date:"2026-10-01", startTime:"17:00", endTime:"19:00", location:"Teen Tech Center", blurb:"Perform music, poetry or comedy. Five minutes or two pieces per performer. Sign up in advance.", recurrence:{freq:"biweekly",weekday:4,until:"2026-10-29"}, skipDates:[] },
  { id:"ftc-robotics-mon", title:"FTC Robotics", kind:"program", date:"2026-09-14", startTime:"14:00", endTime:"17:00", location:"Across the Hall", blurb:"Build and code a competition robot with the team. Meets across the hall on Mondays and Wednesdays.", recurrence:{freq:"weekly",weekday:1,until:"2026-10-26"}, skipDates:["2026-09-21","2026-10-12"] },
  { id:"ftc-robotics-wed", title:"FTC Robotics", kind:"program", date:"2026-09-16", startTime:"14:00", endTime:"17:00", location:"Across the Hall", blurb:"Build and code a competition robot with the team. Meets across the hall on Mondays and Wednesdays.", recurrence:{freq:"weekly",weekday:3,until:"2026-10-28"}, skipDates:[] },
  { id:"cookmobile", title:"Cookmobile", kind:"event", date:"2026-09-28", startTime:"16:00", endTime:"18:00", location:"Teen Tech Center", blurb:"Cook a full meal and eat together. Space is limited so say you are coming.", recurrence:{freq:"weekly",weekday:1,until:"2026-10-19"}, skipDates:["2026-10-12"] },
  { id:"music-video-signup", title:"Music Video Sign Up Closes", kind:"deadline", date:"2026-10-20", startTime:null, endTime:null, location:"Teen Tech Center", blurb:"Last day to join the Music Video Program group. Ask in the Teen Tech Center to get your name on the list.", recurrence:null, skipDates:[] },
  { id:"closure-labor-day", title:"Closed for Labor Day", kind:"closure", date:"2026-09-07", startTime:null, endTime:null, location:"Teen Tech Center", blurb:"The center is closed today.", recurrence:null, skipDates:[] },
  { id:"closure-rosh-hashanah", title:"Closed for Rosh Hashanah", kind:"closure", date:"2026-09-12", startTime:null, endTime:null, location:"Teen Tech Center", blurb:"The library is closed today so the center is closed too.", recurrence:null, skipDates:[] },
  { id:"closure-yom-kippur", title:"Closed for Yom Kippur", kind:"closure", date:"2026-09-21", startTime:null, endTime:null, location:"Teen Tech Center", blurb:"The center is closed today.", recurrence:null, skipDates:[] },
  { id:"closure-indigenous-peoples", title:"Closed for Indigenous Peoples Day", kind:"closure", date:"2026-10-12", startTime:null, endTime:null, location:"Teen Tech Center", blurb:"The center is closed today. Also called Columbus Day.", recurrence:null, skipDates:[] }
];
/* EVENTS:END */

const RANGE = { start:"2026-09", end:"2026-10" };
const STORE_KEY = "khbb-ttc-calendar-v2";
const HOURS = "Tue 2–6:30 · Wed 2–5:30 · Thu 2–7 · Fri 1:30–5:30";
const KINDS = {
  program:  { label:"Program",  color:"var(--lav)" },
  event:    { label:"Event",    color:"var(--ac)"  },
  deadline: { label:"Deadline", color:"var(--sal)" },
  closure:  { label:"Closed",   color:"var(--muted)" }
};

const TABLE = "calendar_events";
// map a DB row -> the event shape the UI uses
function fromRow(r){
  return { id:r.id, title:r.title, kind:r.kind, date:r.date, startTime:r.start_time, endTime:r.end_time,
    location:r.location, blurb:r.blurb,
    recurrence: r.rec_freq ? { freq:r.rec_freq, weekday:r.rec_weekday, until:r.rec_until } : null,
    skipDates: r.skip_dates || [] };
}
// map the UI shape -> a DB row
function toRow(e){
  return { title:e.title, kind:e.kind, date:e.date, start_time:e.startTime||null, end_time:e.endTime||null,
    location:e.location||null, blurb:e.blurb||null,
    rec_freq: e.recurrence?e.recurrence.freq:null, rec_weekday: e.recurrence?e.recurrence.weekday:null,
    rec_until: e.recurrence?e.recurrence.until:null, skip_dates: e.skipDates||[] };
}
// Start with the baked-in events so the wall shows SOMETHING if the DB is briefly
// unreachable; replaced by live rows as soon as the first fetch returns.
let events = EVENTS;
let online = false;
async function fetchEvents(){
  try{
    const rows = await TTC.select(TABLE, "order=date.asc");
    events = rows.map(fromRow);
    online = true;
  }catch(e){ online = false; }
}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{ const[y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const monthKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const pretty=hm=>{ if(!hm)return""; let[h,m]=hm.split(":").map(Number); const ap=h>=12?"pm":"am"; h=h%12||12; return `${h}:${pad(m)}${ap}`; };
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cssColor(v){ // resolve a var() to a real color for inline SVG/ornaments
  const t=document.createElement("span"); t.style.color=v; document.body.appendChild(t);
  const c=getComputedStyle(t).color; t.remove(); return c;
}

function occurrences(ev, from, to){
  const out=[];
  const add=dstr=>{ if(dstr>=from && dstr<=to && !(ev.skipDates||[]).includes(dstr)) out.push(Object.assign({}, ev, {date:dstr})); };
  if(!ev.recurrence){ add(ev.date); return out; }
  const step = ev.recurrence.freq==="biweekly"?14:7;
  let cur = fromISO(ev.date); const until = ev.recurrence.until? fromISO(ev.recurrence.until): fromISO(to);
  let guard=0;
  while(cur<=until && guard++<400){ add(iso(cur)); cur=new Date(cur.getTime()+step*86400000); }
  return out;
}
function eventsForMonth(mk){
  const from=`${mk}-01`; const [y,m]=mk.split("-").map(Number); const to=`${mk}-${pad(new Date(y,m,0).getDate())}`;
  const all=[]; events.forEach(ev=>all.push(...occurrences(ev,from,to)));
  return all;
}
function eventsForRange(fromD, toD){
  const from=iso(fromD), to=iso(toD); const all=[];
  events.forEach(ev=>all.push(...occurrences(ev,from,to)));
  return all.sort((a,b)=> a.date===b.date ? (a.startTime||"").localeCompare(b.startTime||"") : a.date.localeCompare(b.date));
}

let view="month";
let month = monthKey(new Date())>=RANGE.start && monthKey(new Date())<=RANGE.end ? monthKey(new Date()) : RANGE.start;
const app=document.getElementById("app");

function clampMonth(mk){ return mk<RANGE.start?RANGE.start : mk>RANGE.end?RANGE.end : mk; }
function shiftMonth(mk,delta){ let[y,m]=mk.split("-").map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} return `${y}-${pad(m)}`; }
function monthName(mk){ const[y,m]=mk.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }

/* ---------------- interactive (iPad/laptop) view ---------------- */
function render(){
  if(document.body.classList.contains("tv")){ renderTV(); return; }
  const occ = eventsForMonth(month).sort((a,b)=> a.date===b.date ? (a.startTime||"").localeCompare(b.startTime||"") : a.date.localeCompare(b.date));
  app.innerHTML =
    `<div class="lead">
       <div class="ttl"><span class="mono">Kings Highway · Teen Tech Center</span><h2>What's <em>on</em></h2></div>
       <div class="hours">${HOURS}</div>
     </div>
     <div class="bar2">
       <div class="seg">
         <button data-view="month" aria-selected="${view==='month'}">Month</button>
         <button data-view="list" aria-selected="${view==='list'}">List</button>
       </div>
       <span class="spacer"></span>
       <div class="mnav">
         <button id="prev" ${month<=RANGE.start?'disabled':''}>‹</button>
         <span class="mlabel">${monthName(month)}</span>
         <button id="next" ${month>=RANGE.end?'disabled':''}>›</button>
       </div>
     </div>
     <div class="legend">${Object.entries(KINDS).map(([k,v])=>`<span class="lg"><span class="dot" style="background:${v.color}"></span>${v.label}</span>`).join("")}</div>` +
    (view==="month"? monthGrid(occ) : listView(occ)) +
    (TTC.isStaff()? `<div style="margin-top:16px"><button class="ttc-btn ttc-btn-primary" id="addEv">+ Add event</button></div>` : "") +
    `<p class="status ${online?'':'bad'}">${online?'Live — synced with the center.':'Connecting…'} ${TTC.isStaff()?'Staff mode: tap an event to edit or remove it.':''}</p>`;
  wire();
}
function monthGrid(occ){
  const[y,m]=month.split("-").map(Number);
  const first=new Date(y,m-1,1); const startDow=first.getDay(); const days=new Date(y,m,0).getDate();
  const todayISO=iso(new Date());
  const byDay={}; occ.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cell out"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${month}-${pad(d)}`; const list=byDay[ds]||[]; const shown=list.slice(0,3);
    cells+=`<div class="cell ${ds===todayISO?'today':''}"><span class="dnum">${d}</span>`+
      shown.map(e=>`<span class="ev" data-ev="${e.id}" data-date="${e.date}" style="background:${KINDS[e.kind].color}${e.kind==='closure'?';color:#fff':''}">${esc(e.title)}</span>`).join("")+
      (list.length>3?`<span class="more" data-day="${ds}">+${list.length-3} more</span>`:"")+`</div>`;
  }
  const trailing=(7-((startDow+days)%7))%7; for(let i=0;i<trailing;i++) cells+=`<div class="cell out"></div>`;
  return `<div class="grid-wrap"><div class="dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span>${d}</span>`).join("")}</div><div class="cells">${cells}</div></div>`;
}
function listView(occ){
  if(!occ.length) return `<div class="daygroup"><div class="li"><div class="body">Nothing scheduled this month.</div></div></div>`;
  const byDay={}; occ.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  return `<div class="list">`+Object.keys(byDay).sort().map(ds=>{
    const d=fromISO(ds); const hd=d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
    return `<div class="daygroup"><h4>${hd}</h4>`+byDay[ds].map(e=>
      `<div class="li" data-ev="${e.id}" data-date="${e.date}">
         <div class="time">${e.startTime?pretty(e.startTime)+(e.endTime?"–"+pretty(e.endTime):""):"all day"}</div>
         <div class="body"><b>${esc(e.title)}</b><span class="chip" style="background:${KINDS[e.kind].color}${e.kind==='closure'?';color:#fff':''}">${KINDS[e.kind].label}</span><div style="color:var(--muted);font-size:14px;margin-top:2px">${esc(e.location||"")}</div></div>
       </div>`).join("")+`</div>`;
  }).join("")+`</div>`;
}
function wire(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>{ month=clampMonth(shiftMonth(month,-1)); render(); };
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ month=clampMonth(shiftMonth(month,1)); render(); };
  document.querySelectorAll("[data-ev]").forEach(el=>el.onclick=()=>openEvent(el.dataset.ev, el.dataset.date));
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{ view="list"; render(); });
  const add=document.getElementById("addEv"); if(add) add.onclick=()=>openEditor(null);
}
function openEvent(id, date){
  const ev=events.find(e=>e.id===id); if(!ev)return;
  const when = ev.startTime? `${pretty(ev.startTime)}${ev.endTime?" – "+pretty(ev.endTime):""}` : "All day";
  const dstr = fromISO(date||ev.date).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const staffBtns = TTC.isStaff()
    ? `<div style="display:flex;gap:10px;margin-bottom:8px">
         <button class="ttc-btn" id="ev-edit" style="flex:1">Edit</button>
         <button class="ttc-btn ttc-btn-danger" id="ev-del" style="flex:1">Remove</button>
       </div>` : "";
  TTCBar.modal(
    `<div class="modal-meta">${KINDS[ev.kind].label} · ${esc(ev.location||"")}</div>
     <h2 class="modal-h">${esc(ev.title)}</h2>
     <div class="modal-meta" style="margin-bottom:10px">${dstr} · ${when}${ev.recurrence?" · repeats":""}</div>
     <p style="margin:0 0 14px;line-height:1.5">${esc(ev.blurb||"")}</p>
     ${staffBtns}
     <button class="ttc-btn" data-close style="width:100%">Close</button>`,
    () => {
      const ed=document.getElementById("ev-edit"); if(ed) ed.onclick=()=>openEditor(ev, date);
      const dl=document.getElementById("ev-del"); if(dl) dl.onclick=()=>confirmDelete(ev, date);
    }
  );
}

/* ---- add / edit form (staff) ---- */
function openEditor(ev, occDate){
  const isNew=!ev; const e = ev || { kind:"program", date:iso(new Date()), location:"Teen Tech Center", skipDates:[] };
  const rep = !!e.recurrence;
  TTCBar.modal(
    `<h2 class="modal-h">${isNew?"Add event":"Edit event"}</h2>
     <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px;max-height:64vh;overflow:auto">
       <label class="ef"><span>Title</span><input id="e-title" type="text" value="${esc(e.title||"")}" placeholder="e.g. Open Mic Night"></label>
       <label class="ef"><span>Type</span>
         <select id="e-kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${e.kind===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
       <label class="ef"><span>Date</span><input id="e-date" type="date" value="${esc(e.date||"")}"></label>
       <div style="display:flex;gap:10px">
         <label class="ef" style="flex:1"><span>Start</span><input id="e-start" type="time" value="${esc(e.startTime||"")}"></label>
         <label class="ef" style="flex:1"><span>End</span><input id="e-end" type="time" value="${esc(e.endTime||"")}"></label>
       </div>
       <div class="modal-meta" style="margin-top:-6px">Leave times blank for an all-day item (deadlines, closures).</div>
       <label class="ef"><span>Location</span><input id="e-loc" type="text" value="${esc(e.location||"")}"></label>
       <label class="ef"><span>Details</span><textarea id="e-blurb" rows="2" placeholder="one or two sentences">${esc(e.blurb||"")}</textarea></label>
       <label style="display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer">
         <input type="checkbox" id="e-rep" ${rep?"checked":""} style="width:24px;height:24px"> Repeats weekly
       </label>
       <div id="e-repbox" style="${rep?"":"display:none"};display:flex;gap:10px">
         <label class="ef" style="flex:1"><span>Every</span>
           <select id="e-freq"><option value="weekly" ${e.recurrence?.freq==="weekly"?"selected":""}>Week</option><option value="biweekly" ${e.recurrence?.freq==="biweekly"?"selected":""}>Other week</option></select></label>
         <label class="ef" style="flex:1"><span>Until</span><input id="e-until" type="date" value="${esc(e.recurrence?.until||"")}"></label>
       </div>
       <div class="err" id="e-err" style="color:var(--bad);font-size:14px;min-height:18px"></div>
     </div>
     <div style="display:flex;gap:10px;margin-top:12px">
       <button class="ttc-btn" data-close style="flex:1">Cancel</button>
       <button class="ttc-btn ttc-btn-primary" id="e-save" style="flex:1">${isNew?"Add it":"Save"}</button>
     </div>`,
    () => {
      // inject label styling once
      if(!document.getElementById("ef-style")){ const s=document.createElement("style"); s.id="ef-style";
        s.textContent=".ef{display:flex;flex-direction:column;gap:6px}.ef>span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.ef input,.ef select,.ef textarea{font:inherit;min-height:46px;padding:8px 12px;border:var(--b);border-radius:var(--radius-sm);background:#fff;color:var(--ink)}"; document.head.appendChild(s); }
      document.getElementById("e-rep").onchange=ev2=>{ document.getElementById("e-repbox").style.display = ev2.target.checked?"flex":"none"; };
      document.getElementById("e-save").onclick=()=>saveEditor(ev, occDate);
    }
  );
}

async function saveEditor(orig, occDate){
  const g=id=>document.getElementById(id);
  const title=g("e-title").value.trim();
  const date=g("e-date").value;
  if(!title){ g("e-err").textContent="Give it a title."; return; }
  if(!date){ g("e-err").textContent="Pick a date."; return; }
  const repeats=g("e-rep").checked;
  const rec = repeats ? { freq:g("e-freq").value, weekday:fromISO(date).getDay(), until:g("e-until").value||null } : null;
  const payload = {
    title, kind:g("e-kind").value, date,
    startTime:g("e-start").value||null, endTime:g("e-end").value||null,
    location:g("e-loc").value.trim()||null, blurb:g("e-blurb").value.trim()||null,
    recurrence: rec, skipDates: orig?.skipDates || []
  };
  g("e-save").disabled=true; g("e-err").textContent="Saving…";
  try{
    if(orig){ await TTC.update(TABLE, orig.id, toRow(payload)); }
    else { await TTC.insert(TABLE, toRow(payload)); }
    await fetchEvents(); TTCBar.closeModal(); refreshView(); TTC.toast(orig?"Saved.":"Added to the calendar.");
  }catch(e){ g("e-err").textContent="Couldn't save — check the WiFi."; g("e-save").disabled=false; }
}

function confirmDelete(ev, occDate){
  const recurring = !!ev.recurrence;
  TTCBar.modal(
    `<h2 class="modal-h">Remove "${esc(ev.title)}"?</h2>` +
    (recurring
      ? `<p style="margin:6px 0 14px">This one repeats. Remove just this day (${fromISO(occDate||ev.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}), or the whole series?</p>
         <div style="display:flex;flex-direction:column;gap:10px">
           <button class="ttc-btn" id="del-one" style="width:100%">Just this day</button>
           <button class="ttc-btn ttc-btn-danger" id="del-all" style="width:100%">The whole series</button>
           <button class="ttc-btn" data-close style="width:100%">Cancel</button>
         </div>`
      : `<p style="margin:6px 0 14px">This can't be undone.</p>
         <div style="display:flex;gap:10px">
           <button class="ttc-btn" data-close style="flex:1">Cancel</button>
           <button class="ttc-btn ttc-btn-danger" id="del-all" style="flex:1">Remove it</button>
         </div>`),
    () => {
      const one=document.getElementById("del-one");
      if(one) one.onclick=async()=>{ // add this occurrence to skip_dates
        const skips=(ev.skipDates||[]).concat([occDate||ev.date]);
        try{ await TTC.update(TABLE, ev.id, { skip_dates:skips }); await fetchEvents(); TTCBar.closeModal(); refreshView(); TTC.toast("Removed that day."); }
        catch(e){ TTC.toast("Couldn't remove it."); }
      };
      const all=document.getElementById("del-all");
      if(all) all.onclick=async()=>{ try{ await TTC.remove(TABLE, ev.id); await fetchEvents(); TTCBar.closeModal(); refreshView(); TTC.toast("Removed."); } catch(e){ TTC.toast("Couldn't remove it."); } };
    }
  );
}

function refreshView(){ if(document.body.classList.contains("tv")) renderTV(); else render(); }

/* ---------------- TV WALL MODE ---------------- */
let tvClock=null, tvCycle=null, tvMonthHop=null, tvCycleIdx=0;

function renderTV(){
  const now = new Date();
  const todayISO = iso(now);
  // today's events
  const today = eventsForRange(now, now);
  // rolling look-ahead: the next 7 days starting tomorrow (never empty mid-week)
  const tomorrow = new Date(now.getTime()+86400000);
  const lookEnd = new Date(now.getTime()+7*86400000);
  const week = eventsForRange(tomorrow, lookEnd);

  app.insertAdjacentHTML("afterbegin","");
  // build once; keep the stage and just refresh dynamic bits on cycles
  app.innerHTML = `
    <div class="tv-stage">
      <div class="tv-orn" id="tvOrn"></div>
      <div class="tv-left">
        <div class="tv-head">
          <div>
            <div class="k">Kings Highway · Teen Tech Center</div>
            <h1>What's <em>on</em></h1>
          </div>
          <div class="clock"><div class="t" id="tvTime"></div><div class="d" id="tvDate"></div></div>
        </div>
        ${tvGrid(todayISO)}
      </div>
      <div class="tv-right">
        <div class="tv-today">
          <div class="sec-k"><span class="live"></span> Today</div>
          <div id="tvTodayCards">${tvTodayCards(today)}</div>
        </div>
        <div class="tv-week">
          <div class="sec-k">Coming up next</div>
          <div class="scroller"><div class="scroll-inner" id="tvWeek">${tvWeekCards(week)}</div></div>
        </div>
      </div>
      ${tvTicker(week.length?week:today)}
    </div>`;
  paintClock();
  spawnOrnaments();
  startTVTimers(today, week);
}

function tvGrid(todayISO){
  const mk = monthKey(new Date())>=RANGE.start && monthKey(new Date())<=RANGE.end ? monthKey(new Date()) : month;
  const[y,m]=mk.split("-").map(Number);
  const startDow=new Date(y,m-1,1).getDay(); const days=new Date(y,m,0).getDate();
  const occ=eventsForMonth(mk); const byDay={}; occ.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="tv-cell out"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${mk}-${pad(d)}`; const list=byDay[ds]||[]; const shown=list.slice(0,3);
    cells+=`<div class="tv-cell ${ds===todayISO?'today':''}"><span class="dn">${d}</span>`+
      shown.map(e=>`<span class="tv-ev" style="background:${KINDS[e.kind].color}${e.kind==='closure'?';color:#fff':''}">${esc(e.title)}</span>`).join("")+
      (list.length>3?`<span class="tv-more">+${list.length-3}</span>`:"")+`</div>`;
  }
  const trailing=(7-((startDow+days)%7))%7; for(let i=0;i<trailing;i++) cells+=`<div class="tv-cell out"></div>`;
  return `<div class="tv-grid"><div class="tv-dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span>${d}</span>`).join("")}</div><div class="tv-cells">${cells}</div></div>`;
}
function card(e, big){
  const when = e.startTime? `${pretty(e.startTime)}${e.endTime?"–"+pretty(e.endTime):""}` : "All day";
  return `<div class="tv-card ${big?'big':''}">
    <div class="cd-top"><span class="cd-kind" style="background:${KINDS[e.kind].color}${e.kind==='closure'?';color:#fff':''}">${KINDS[e.kind].label}</span><span class="cd-time">${when}</span></div>
    <div class="cd-title">${esc(e.title)}</div>
    <div class="cd-loc">${esc(e.location||"")}</div>
  </div>`;
}
function tvTodayCards(today){
  if(!today.length) return `<div class="tv-empty">Open hours only today — no scheduled programs.</div>`;
  return today.map(e=>card(e,true)).join("");
}
function tvWeekCards(week){
  if(!week.length) return `<div class="tv-empty" style="font-size:1.6vh">Nothing else scheduled in the next week — the center is still open during the hours shown.</div>`;
  const byDay={}; week.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  return Object.keys(byDay).sort().map(ds=>{
    const dl=fromISO(ds).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
    return `<div><div class="sec-k" style="margin:.4vh 0 .6vh;font-size:1.1vh">${dl}</div>${byDay[ds].map(e=>card(e,false)).join("")}</div>`;
  }).join("");
}
function tvTicker(list){
  const items = list.length? list : eventsForRange(new Date(), new Date(new Date().getTime()+13*86400000));
  const run = items.map(e=>{
    const d=fromISO(e.date).toLocaleDateString(undefined,{weekday:"short"});
    const t=e.startTime?pretty(e.startTime):"all day";
    return `<span><span class="kdot" style="background:${KINDS[e.kind].color}"></span>${esc(e.title)} · ${d} ${t}${e.location?" · "+esc(e.location):""}</span>`;
  }).join("");
  return `<div class="tv-ticker"><div class="tag">Coming up</div><div class="crawl"><div class="run">${run}${run}</div></div></div>`;
}

function paintClock(){
  const now=new Date();
  const tEl=document.getElementById("tvTime"), dEl=document.getElementById("tvDate");
  if(tEl) tEl.textContent = now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  if(dEl) dEl.textContent = now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
function spawnOrnaments(){
  const orn=document.getElementById("tvOrn"); if(!orn)return; orn.innerHTML="";
  const cols=[KINDS.program.color,KINDS.event.color,KINDS.deadline.color,"var(--ac)"];
  for(let i=0;i<10;i++){
    const el=document.createElement("i");
    const size=4+Math.random()*9; // vw
    const rise=Math.random()>.5;
    el.style.width=size+"vw"; el.style.height=size+"vw";
    el.style.left=(Math.random()*90)+"%";
    el.style.background=cssColor(cols[i%cols.length]);
    el.style.opacity=(0.1+Math.random()*0.16).toFixed(2);
    const dur=(18+Math.random()*26).toFixed(1);
    el.style.animation=`${rise?'omrise':'omfall'} ${dur}s linear ${(-Math.random()*20).toFixed(1)}s infinite`;
    orn.appendChild(el);
  }
}
function startTVTimers(today, week){
  clearInterval(tvClock); clearInterval(tvCycle); clearInterval(tvMonthHop);
  tvClock = setInterval(paintClock, 1000*20);
  // gentle "card flip": re-trigger the cardIn animation on today's cards every 7s
  tvCycle = setInterval(()=>{
    const cards=document.querySelectorAll("#tvTodayCards .tv-card");
    if(!cards.length) return;
    tvCycleIdx=(tvCycleIdx+1)%cards.length;
    const c=cards[tvCycleIdx]; c.style.animation="none"; void c.offsetWidth; c.style.animation="cardIn .55s ease both";
  }, 7000);
  // full refresh every 10 min so "today/this week" stays correct as time passes
  tvMonthHop = setInterval(()=>{ if(document.body.classList.contains("tv")) renderTV(); }, 10*60*1000);
}
function stopTVTimers(){ clearInterval(tvClock); clearInterval(tvCycle); clearInterval(tvMonthHop); }

/* enter/exit */
function enterTV(){ document.body.classList.add("tv"); document.getElementById("tvbtn").textContent="Exit TV"; renderTV(); }
function exitTV(){ document.body.classList.remove("tv"); stopTVTimers(); document.getElementById("tvbtn").textContent="TV mode"; render(); }
document.getElementById("tvbtn").onclick=()=>{ document.body.classList.contains("tv")?exitTV():enterTV(); };
// double-tap/click anywhere in TV to exit (no visible chrome on the wall)
document.addEventListener("dblclick",()=>{ if(document.body.classList.contains("tv")) exitTV(); });

// first paint from baked-in events, then load the live ones
render();
const wantTV = /[?&]tv\b/.test(location.search);
if(wantTV) enterTV();
fetchEvents().then(()=>refreshView());

// live sync: re-pull from the DB periodically so adds/edits on another device show up.
// TV polls faster (it's a passive wall display); interactive view polls gently and
// skips while a modal/editor is open so it doesn't yank the form away.
setInterval(async ()=>{
  if(document.querySelector(".ttc-scrim")) return;        // editor open
  await fetchEvents(); refreshView();
}, 30000);

// re-render when staff mode flips (so the + Add event button + edit affordances appear)
TTCBar.onStaffChange(()=>refreshView());
</script>
