<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Video — Sign In</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="sheet.css">
<style>
  /* ---- Music Video's own "bent": teal screen glow, like an edit bay ---- */
  :root{ --bgc:#cdf3ee; --ac:#12b5a5; --ac-text:#fff; --stripe:#0b7d73; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>
<script src="names.js"></script>
<script src="sheet.js"></script>

<div class="ttc-wrap" id="app"></div>

<script>
/* Music Video Program: weekly Tuesdays. Session shape is demo, then guided, then open build.
   Edit the questions right here. How the list works is explained at the top of sheet.js. */
TTCSheet.mount({
  title: "Music Video",
  table: "musicvideo_visits",
  eyebrow: "Kings Highway · Music Video Program",
  headline: ["Sign in to", "music video"],
  hereLabel: "on set right now",
  listTitle: "On set today",
  toast: "Signed in. Go make something.",
  fields: [
    { key:"orientation_done", label:"done your studio orientation", type:"choice", list:false,
      options:["Yes","Not yet"],
      hint:"Studio Orientation comes first. Not done yet? Grab a staff member." },
    { key:"stage", label:"where are you at today", type:"chips",
      options:["Watching demo","Guided","Open build"] },
    { key:"working_on", label:"what are you working on", type:"choice",
      options:["Song","Video edit","Both"] },
    { key:"project", label:"project or video name", type:"text", placeholder:"what's it called?" },
    { key:"collaborators", label:"who are you working with (optional)", type:"text", placeholder:"names of your group" },
  ]
});
</script>
</body>
</html>
