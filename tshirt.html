<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-Shirt Making — Sign In</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="sheet.css">
<style>
  /* ---- T-Shirt Making's own "bent": tomato red, like screen-print ink ---- */
  :root{ --bgc:#ffd8d0; --ac:#ff5a3c; --ac-text:#fff; --stripe:#c23a20; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>
<script src="names.js"></script>
<script src="sheet.js"></script>

<div class="ttc-wrap" id="app"></div>

<script>
/* T-Shirt Making. Edit the questions right here. How the list works is explained at the top of sheet.js. */
TTCSheet.mount({
  title: "T-Shirt Making",
  table: "tshirt_visits",
  eyebrow: "Kings Highway · T-Shirt Making",
  headline: ["Sign in to", "t-shirts"],
  hereLabel: "pressing right now",
  listTitle: "Making shirts today",
  toast: "Signed in. Go make something.",
  fields: [
    { key:"stage", label:"what are you doing today", type:"chips",
      options:["Designing","Printing / pressing","Finishing"] },
    { key:"project", label:"what's going on your shirt", type:"text", placeholder:"design or idea" },
    { key:"notes", label:"anything staff should know (optional)", type:"longtext", placeholder:"size, colors, help needed" },
  ]
});
</script>
</body>
</html>
