<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kings Highway Teen Tech Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .hub-head { text-align:center; padding: 10px 16px 6px; }
  .hub-head .eyebrow { color: var(--ink2); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:12px; }
  .hub-head h1 { font-family: var(--font-display); font-size: 30px; margin: 4px 0 2px; }
  .hub-head .sub { color: var(--ink2); font-size: 15px; }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 18px; }
  .tile {
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    min-height: 140px; padding: 16px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
    text-decoration:none; color: var(--ink); cursor:pointer;
  }
  .tile:active { transform: translateY(1px); }
  .tile .emoji { font-size: 34px; line-height:1; }
  .tile .name { font-family: var(--font-display); font-size: 19px; font-weight:600; margin-top: 10px; }
  .tile .blurb { color: var(--ink2); font-size: 13.5px; margin-top: 2px; }
  .tile .bar { position:absolute; left:0; top:0; bottom:0; width:5px; border-radius: var(--radius) 0 0 var(--radius); background: var(--c, var(--accent)); }
  .tile.soon { opacity: .62; }
  .tile.soon .pill { align-self:flex-start; margin-top:10px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
                     color: var(--ink2); background: var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }

  .staffnote { text-align:center; color: var(--ink2); font-size: 13.5px; margin: 22px 0 0; }
  .brandrow { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:26px; opacity:.5; flex-wrap:wrap; }
  .brandrow span { font-size:12px; color:var(--ink2); }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>

<div class="ttc-wrap">
  <header class="hub-head">
    <div class="eyebrow">Best Buy Teen Tech Center · Kings Highway</div>
    <h1>Sign-In Hub</h1>
    <div class="sub">Pick a program. Staff code unlocks every sheet at once.</div>
  </header>

  <main class="grid" id="grid" aria-label="Programs"></main>

  <p class="staffnote" id="staffnote"></p>

  <div class="brandrow">
    <span>The Clubhouse Network</span><span>·</span><span>Brooklyn Public Library</span>
  </div>
</div>

<script>
  // The top bar: on the hub the home button just reloads the hub, which is fine.
  TTCBar.mount("Sign-In Hub");
  // Hide the redundant home button on the hub itself.
  document.querySelector(".ttc-home").style.visibility = "hidden";

  const grid = document.getElementById("grid");
  TTC.PROGRAMS.forEach(p => {
    const live = !!p.file;
    const el = document.createElement(live ? "a" : "div");
    el.className = "tile" + (live ? "" : " soon");
    el.style.setProperty("--c", p.color);
    if (live) el.href = p.file;
    el.innerHTML =
      '<div class="bar"></div>' +
      '<div class="emoji">' + p.emoji + '</div>' +
      '<div>' +
        '<div class="name">' + p.name + '</div>' +
        '<div class="blurb">' + p.blurb + '</div>' +
        (live ? '' : '<div class="pill">coming soon</div>') +
      '</div>';
    grid.appendChild(el);
  });

  function paintNote() {
    const note = document.getElementById("staffnote");
    note.textContent = TTC.isStaff()
      ? "Staff mode is on — tap any program and you can edit, remove, or export without re-entering the code."
      : "Tap the Staff button up top to unlock editing and export across all sheets.";
  }
  paintNote();
  TTCBar.onStaffChange(paintNote);
</script>
</body>
</html>
