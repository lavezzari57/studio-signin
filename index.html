<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kings Highway Teen Tech Center</title>
<link rel="stylesheet" href="theme.css">
<style>
  .hub-head { padding: 8px 2px 4px; }
  .hub-head .eyebrow { font-family:var(--mono); color:var(--muted); font-weight:500; letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
  .hub-head h1 { font-family:var(--display); font-weight:800; font-size:clamp(44px,11vw,88px); line-height:.88; letter-spacing:-.04em; margin:8px 0 10px; }
  .hub-head h1 em { font-style:normal; display:inline-block; background:var(--ac); color:#fff; border:var(--b); border-radius:.16em; padding:0 .12em .04em; transform:rotate(-2deg); box-shadow:var(--shadow-sticker); }
  .hub-head .sub { color:var(--ink); font-size:17px; font-weight:500; max-width:40ch; }
  .hub-head .sub b { font-weight:700; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; margin-top:26px; }
  .tile {
    position:relative; display:flex; flex-direction:column; gap:14px;
    min-height:184px; padding:20px; border-radius:var(--radius);
    background:var(--paper); border:var(--b); box-shadow:var(--shadow-sticker);
    text-decoration:none; color:var(--ink); cursor:pointer;
    transition:transform .06s, box-shadow .06s;
  }
  .tile:hover  { transform:translate(-2px,-3px); box-shadow:8px 9px 0 var(--ink); }
  .tile:active { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  .tile .ico {
    width:66px; height:66px; border-radius:16px; border:var(--b);
    display:grid; place-items:center; background:var(--c,var(--ac));
    box-shadow:var(--shadow-sticker-sm); flex:0 0 auto;
  }
  .tile .ico svg { width:46px; height:46px; display:block; }
  .tile .name { font-family:var(--display); font-weight:800; font-size:23px; letter-spacing:-.02em; line-height:1; }
  .tile .blurb { color:var(--muted); font-size:14px; margin-top:-6px; }
  .tile .spring { flex:1; }
  .tile.soon { opacity:.72; }
  .tile.soon .ico { background:var(--paper); }
  .tile.soon .pill { align-self:flex-start; font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
                     color:var(--muted); background:var(--bgc); border:2px solid var(--ink); border-radius:999px; padding:3px 10px; }

  .staffnote { margin:26px 2px 0; font-family:var(--mono); font-size:13px; color:var(--muted); }
  .brandrow { display:flex; align-items:center; gap:12px; margin-top:22px; padding:0 2px; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex-wrap:wrap; }
  .brandrow .sep { opacity:.5; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>

<div class="ttc-wrap">
  <header class="hub-head">
    <div class="eyebrow">Best Buy Teen Tech Center</div>
    <h1>Kings <em>Highway</em></h1>
    <div class="sub">Pick what you're here for. <b>Staff code unlocks every sheet at once.</b></div>
  </header>

  <main class="grid" id="grid" aria-label="Programs"></main>

  <p class="staffnote" id="staffnote"></p>
  <div class="brandrow"><span>The Clubhouse Network</span><span class="sep">/</span><span>Brooklyn Public Library</span></div>
</div>

<script>
/* ---- hand-drawn Studio Sticker icons, keyed by program id ----
   One style: 2.6px round strokes, no fill, currentColor. White on the
   colored chip. A new program with no icon here falls back to a dot grid. */
const STROKE = 'fill="none" stroke="#1e1a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  studio: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="15" y="5" width="10" height="19" rx="5"/><path d="M11 19a9 9 0 0 0 18 0"/><path d="M20 28v6M14 34h12"/><path d="M18 11h4M18 15h4"/></g></svg>`,
  ftc: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="11" y="15" width="18" height="15" rx="3"/><circle cx="16.5" cy="22" r="1.6"/><circle cx="23.5" cy="22" r="1.6"/><path d="M20 15V9M20 9a2.5 2.5 0 1 0 0-.01"/><path d="M11 21H7M29 21h4M16 30v3M24 30v3"/></g></svg>`,
  calendar: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="7" y="9" width="26" height="24" rx="3"/><path d="M7 16h26M14 5v7M26 5v7"/><path d="M13 22h3M19 22h3M25 22h2M13 27h3M19 27h3"/></g></svg>`,
  podcasting: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M11 20a9 9 0 0 1 18 0"/><rect x="7" y="20" width="6" height="10" rx="3"/><rect x="27" y="20" width="6" height="10" rx="3"/><path d="M29 30a9 9 0 0 1-9 5"/></g></svg>`,
  printer: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M13 16V7h14v9"/><rect x="7" y="16" width="26" height="11" rx="2"/><rect x="13" y="25" width="14" height="9" rx="1.5"/><circle cx="27" cy="21" r="1.3"/></g></svg>`,
  art: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M20 6c-8 0-14 5.5-14 13 0 5 4 7 7 7 2 0 2.5 1.3 2.5 2.7C15.5 32 17 35 20 35c8 0 14-6 14-14S28 6 20 6Z"/><circle cx="14" cy="17" r="1.6"/><circle cx="20" cy="13" r="1.6"/><circle cx="26" cy="17" r="1.6"/></g></svg>`,
};
const FALLBACK = `<svg viewBox="0 0 40 40"><g ${STROKE}><circle cx="13" cy="13" r="2"/><circle cx="20" cy="13" r="2"/><circle cx="27" cy="13" r="2"/><circle cx="13" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><circle cx="27" cy="20" r="2"/><circle cx="13" cy="27" r="2"/><circle cx="20" cy="27" r="2"/><circle cx="27" cy="27" r="2"/></g></svg>`;

TTCBar.mount("Sign in");
document.querySelector(".ttc-home").style.visibility = "hidden";  // no home button on the hub

const grid = document.getElementById("grid");
TTC.PROGRAMS.forEach(p => {
  const live = !!p.file;
  const el = document.createElement(live ? "a" : "div");
  el.className = "tile" + (live ? "" : " soon");
  el.style.setProperty("--c", p.color);
  if (live) el.href = p.file;
  el.innerHTML =
    `<div class="ico">${ICONS[p.id] || FALLBACK}</div>` +
    `<div class="name">${p.name}</div>` +
    `<div class="blurb">${p.blurb}</div>` +
    `<div class="spring"></div>` +
    (live ? "" : `<div class="pill">coming soon</div>`);
  grid.appendChild(el);
});

function paintNote(){
  document.getElementById("staffnote").textContent = TTC.isStaff()
    ? "Staff mode on — open any program to edit, remove, or export."
    : "Tap Staff up top to unlock editing + export across every sheet.";
}
paintNote(); TTCBar.onStaffChange(paintNote);
</script>
</body>
</html>
