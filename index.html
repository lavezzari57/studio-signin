<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kings Highway Teen Tech Center</title>
<link rel="stylesheet" href="theme.css">
<style>
  .hub-head { padding: 8px 2px 4px; }
  .hub-head .eyebrow { font-family:var(--mono); color:var(--muted); font-weight:500; letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
  .hub-head h1 { font-family:var(--display); font-weight:800; font-size:clamp(44px,11vw,88px); line-height:.88; letter-spacing:-.04em; margin:8px 0 10px; }
  .hub-head h1 em { font-style:normal; display:inline-block; background:var(--ac); color:#fff; border:var(--b); border-radius:.16em; padding:0 .12em .04em; transform:rotate(-2deg); box-shadow:var(--shadow-sticker); }
  .hub-head .sub { color:var(--ink); font-size:17px; font-weight:500; max-width:40ch; }
  .hub-head .sub b { font-weight:700; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; margin-top:26px; }
  .tile {
    position:relative; display:flex; flex-direction:column; gap:14px;
    min-height:184px; padding:20px; border-radius:var(--radius);
    background:var(--paper); border:var(--b); box-shadow:var(--shadow-sticker);
    text-decoration:none; color:var(--ink); cursor:pointer;
    transition:transform .06s, box-shadow .06s;
  }
  .tile:hover  { transform:translate(-2px,-3px); box-shadow:8px 9px 0 var(--ink); }
  .tile:active { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  .tile .ico {
    width:66px; height:66px; border-radius:16px; border:var(--b);
    display:grid; place-items:center; background:var(--c,var(--ac));
    box-shadow:var(--shadow-sticker-sm); flex:0 0 auto;
  }
  .tile .ico svg { width:46px; height:46px; display:block; }
  .tile .name { font-family:var(--display); font-weight:800; font-size:23px; letter-spacing:-.02em; line-height:1; }
  .tile .blurb { color:var(--muted); font-size:14px; margin-top:-6px; }
  .tile .spring { flex:1; }
  .tile.soon { opacity:.72; }
  .tile.soon .ico { background:var(--paper); }
  .pill { align-self:flex-start; font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
          color:var(--muted); background:var(--bgc); border:2px solid var(--ink); border-radius:999px; padding:3px 10px; }
  .pill.guide { color:var(--ink); background:var(--sky); }
  .pill.event { color:var(--ink); background:var(--sal); }

  /* the + New sheet tile */
  .tile-add { font:inherit; text-align:left; align-items:flex-start; background:var(--paper); border-style:dashed; cursor:pointer; }
  .tile-add .plus { width:66px; height:66px; border-radius:16px; border:2.5px dashed var(--ink); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:40px; line-height:1; color:var(--ink); }
  .tile-add .name { margin-top:14px; }

  /* delete ✕ on a generated tile (staff) */
  .tile-del { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; border:2px solid var(--ink); background:var(--paper); color:var(--bad); font-weight:800; font-size:14px; cursor:pointer; line-height:1; box-shadow:2px 2px 0 var(--ink); }
  .tile-del:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }

  .staffnote { margin:26px 2px 0; font-family:var(--mono); font-size:13px; color:var(--muted); }
  .brandrow { display:flex; align-items:center; gap:12px; margin-top:22px; padding:0 2px; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex-wrap:wrap; }
  .brandrow .sep { opacity:.5; }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="staffbar.js"></script>

<div class="ttc-wrap">
  <header class="hub-head">
    <div class="eyebrow">Best Buy Teen Tech Center</div>
    <h1>Kings <em>Highway</em></h1>
    <div class="sub">Pick what you're here for. <b>Staff code unlocks every sheet at once.</b></div>
  </header>

  <main class="grid" id="grid" aria-label="Programs"></main>

  <p class="staffnote" id="staffnote"></p>
  <div class="brandrow"><span>The Clubhouse Network</span><span class="sep">/</span><span>Brooklyn Public Library</span></div>
</div>

<script>
/* ---- hand-drawn Studio Sticker icons, keyed by program id ----
   One style: 2.6px round strokes, no fill, currentColor. White on the
   colored chip. A new program with no icon here falls back to a dot grid. */
const STROKE = 'fill="none" stroke="#1e1a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  studio: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="15" y="5" width="10" height="19" rx="5"/><path d="M11 19a9 9 0 0 0 18 0"/><path d="M20 28v6M14 34h12"/><path d="M18 11h4M18 15h4"/></g></svg>`,
  ftc: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="11" y="15" width="18" height="15" rx="3"/><circle cx="16.5" cy="22" r="1.6"/><circle cx="23.5" cy="22" r="1.6"/><path d="M20 15V9M20 9a2.5 2.5 0 1 0 0-.01"/><path d="M11 21H7M29 21h4M16 30v3M24 30v3"/></g></svg>`,
  calendar: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="7" y="9" width="26" height="24" rx="3"/><path d="M7 16h26M14 5v7M26 5v7"/><path d="M13 22h3M19 22h3M25 22h2M13 27h3M19 27h3"/></g></svg>`,
  podcasting: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M11 20a9 9 0 0 1 18 0"/><rect x="7" y="20" width="6" height="10" rx="3"/><rect x="27" y="20" width="6" height="10" rx="3"/><path d="M29 30a9 9 0 0 1-9 5"/></g></svg>`,
  printer: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M13 16V7h14v9"/><rect x="7" y="16" width="26" height="11" rx="2"/><rect x="13" y="25" width="14" height="9" rx="1.5"/><circle cx="27" cy="21" r="1.3"/></g></svg>`,
  art: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M20 6c-8 0-14 5.5-14 13 0 5 4 7 7 7 2 0 2.5 1.3 2.5 2.7C15.5 32 17 35 20 35c8 0 14-6 14-14S28 6 20 6Z"/><circle cx="14" cy="17" r="1.6"/><circle cx="20" cy="13" r="1.6"/><circle cx="26" cy="17" r="1.6"/></g></svg>`,
  youthcouncil: `<svg viewBox="0 0 40 40"><g ${STROKE}><circle cx="13" cy="13" r="4"/><circle cx="27" cy="13" r="4"/><path d="M6 27a7 7 0 0 1 14 0M20 27a7 7 0 0 1 14 0"/><path d="M9 33h22"/></g></svg>`,
  musicvideo: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="6" y="15" width="28" height="18" rx="3"/><path d="M6 15l3-8 25 3-1 5"/><path d="M14 8l2 7M22 9l2 6"/><path d="M17 20v8l7-4z"/></g></svg>`,
  openmic: `<svg viewBox="0 0 40 40"><g ${STROKE}><circle cx="25" cy="13" r="7"/><path d="M20 18L8 33l3 2 13-13"/><path d="M21 9l8 8"/></g></svg>`,
  peerpanel: `<svg viewBox="0 0 40 40"><g ${STROKE}><circle cx="20" cy="10" r="4"/><path d="M12 22a8 8 0 0 1 16 0"/><path d="M6 22h28v5H6z"/><path d="M10 27v7M30 27v7"/></g></svg>`,
  askajob: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M7 9h26a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H19l-8 7v-7H7a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z"/><path d="M16 15a4 4 0 1 1 5.5 3.7c-1 .5-1.5 1-1.5 2.3"/><path d="M20 24v.2"/></g></svg>`,
  linkedin: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="6" y="13" width="28" height="20" rx="3"/><path d="M15 13V9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4"/><path d="M6 22h28M18 22v3h4v-3"/></g></svg>`,
  vibecoding: `<svg viewBox="0 0 40 40"><g ${STROKE}><rect x="5" y="8" width="30" height="20" rx="3"/><path d="M15 15l-4 3 4 3M25 15l4 3-4 3M21 13l-2 10"/><path d="M14 34h12M20 28v6"/></g></svg>`,
  report: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M7 33h26"/><rect x="9" y="20" width="5" height="9" rx="1"/><rect x="17.5" y="13" width="5" height="16" rx="1"/><rect x="26" y="7" width="5" height="22" rx="1"/></g></svg>`,
  tshirt: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M14 6l-9 5 4 8 4-2v17h14V17l4 2 4-8-9-5c-1 3-3.5 4.5-6 4.5S15 9 14 6z"/></g></svg>`,
  mixdesk: `<svg viewBox="0 0 40 40"><g ${STROKE}><path d="M12 6v28M20 6v28M28 6v28"/><rect x="8.5" y="12" width="7" height="6" rx="2"/><rect x="16.5" y="20" width="7" height="6" rx="2"/><rect x="24.5" y="10" width="7" height="6" rx="2"/></g></svg>`,
};
const FALLBACK = `<svg viewBox="0 0 40 40"><g ${STROKE}><circle cx="13" cy="13" r="2"/><circle cx="20" cy="13" r="2"/><circle cx="27" cy="13" r="2"/><circle cx="13" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><circle cx="27" cy="20" r="2"/><circle cx="13" cy="27" r="2"/><circle cx="20" cy="27" r="2"/><circle cx="27" cy="27" r="2"/></g></svg>`;

TTCBar.mount("Sign in");
document.querySelector(".ttc-home").style.visibility = "hidden";  // no home button on the hub

const grid = document.getElementById("grid");
const EVENT_TABLE = "event_sheets";
let eventSheets = [];   // generated event sheets from the DB

// colors a generated sheet can pick from (its "bent")
const PALETTE = [
  { name:"Purple", v:"var(--lav)" }, { name:"Green", v:"var(--mint)" },
  { name:"Gold",   v:"var(--yel)" }, { name:"Coral", v:"var(--sal)" },
  { name:"Blue",   v:"var(--sky)" }, { name:"Pink",  v:"var(--ac)" },
];

function tileEl(opts){
  // opts: {href, color, icon, name, blurb, pill, onDelete}
  const el = document.createElement(opts.href ? "a" : "div");
  el.className = "tile" + (opts.soon ? " soon" : "");
  el.style.setProperty("--c", opts.color);
  if (opts.href) el.href = opts.href;
  el.innerHTML =
    `<div class="ico">${opts.icon}</div>` +
    `<div class="name">${opts.name}</div>` +
    `<div class="blurb">${opts.blurb||""}</div>` +
    `<div class="spring"></div>` +
    (opts.pill || "");
  if (opts.onDelete){
    const d = document.createElement("button");
    d.className = "tile-del"; d.textContent = "✕"; d.title = "Remove this event sheet";
    d.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); opts.onDelete(); };
    el.appendChild(d);
  }
  return el;
}

function renderGrid(){
  grid.innerHTML = "";
  // 1) permanent programs from config
  TTC.PROGRAMS.forEach(p => {
    if (p.staff && !isStaff()) return;   // staff-only tiles (the A&P report)
    const live = !!p.file;
    grid.appendChild(tileEl({
      href: live ? p.file : null, soon: !live, color: p.color,
      icon: ICONS[p.id] || FALLBACK, name: p.name, blurb: p.blurb,
      pill: live ? (p.guide ? `<div class="pill guide">guide</div>` : "") : `<div class="pill">coming soon</div>`
    }));
  });
  // 2) generated event sheets from the DB
  eventSheets.forEach(s => {
    grid.appendChild(tileEl({
      href: `event.html?id=${encodeURIComponent(s.id)}`, color: s.color || "var(--ac)",
      icon: ICON_EVENT, name: s.name, blurb: s.question ? "Asks: " + s.question : "Event sign-in",
      pill: `<div class="pill event">event</div>`,
      onDelete: isStaff() ? () => deleteSheet(s) : null
    }));
  });
  // 3) the "+ New sign-in sheet" tile (staff only)
  if (isStaff()){
    const add = document.createElement("button");
    add.className = "tile tile-add";
    add.innerHTML = `<div class="plus">+</div><div class="name">New sign-in sheet</div><div class="blurb">For an event or pop-up</div>`;
    add.onclick = openCreator;
    grid.appendChild(add);
  }
}
const isStaff = () => TTC.isStaff();
const ICON_EVENT = `<svg viewBox="0 0 40 40"><g fill="none" stroke="#1e1a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14h24M8 14l2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2l2-16"/><path d="M14 14V9a6 6 0 0 1 12 0v5"/></g></svg>`;

async function loadEventSheets(){
  try{ const rows = await TTC.select(EVENT_TABLE, "archived=eq.false&order=created_at.asc"); eventSheets = rows; }
  catch(e){ eventSheets = []; }
  renderGrid();
}

/* ---- create a new event sheet ---- */
function openCreator(){
  TTCBar.modal(
    `<h2 style="font-family:var(--display);font-weight:800;margin:0 0 10px">New sign-in sheet</h2>
     <div style="display:flex;flex-direction:column;gap:12px">
       <label class="cf"><span>Event name</span><input id="c-name" type="text" placeholder="e.g. Robotics Expo" autocomplete="off"></label>
       <label class="cf"><span>One question to ask (optional)</span><input id="c-q" type="text" placeholder="e.g. Which school are you from?" autocomplete="off"></label>
       <div class="cf"><span>Color</span><div id="c-colors" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
       <div class="err" id="c-err" style="color:var(--bad);font-size:14px;min-height:18px"></div>
     </div>
     <div style="display:flex;gap:10px;margin-top:12px">
       <button class="ttc-btn" data-close style="flex:1">Cancel</button>
       <button class="ttc-btn ttc-btn-primary" id="c-make" style="flex:1">Make it</button>
     </div>`,
    () => {
      if(!document.getElementById("cf-style")){ const st=document.createElement("style"); st.id="cf-style";
        st.textContent=".cf{display:flex;flex-direction:column;gap:6px}.cf>span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.cf input{font:inherit;min-height:48px;padding:10px 14px;border:var(--b);border-radius:var(--radius-sm);background:#fff;color:var(--ink)}.swatch{width:44px;height:44px;border-radius:12px;border:var(--b);cursor:pointer;box-shadow:var(--shadow-sticker-sm)}.swatch[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}"; document.head.appendChild(st); }
      let chosen = PALETTE[0].v;
      const box = document.getElementById("c-colors");
      PALETTE.forEach((c,i)=>{ const b=document.createElement("button"); b.className="swatch"; b.style.background=c.v; b.title=c.name; b.setAttribute("aria-pressed", i===0); b.onclick=()=>{ chosen=c.v; box.querySelectorAll(".swatch").forEach(s=>s.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); }; box.appendChild(b); });
      document.getElementById("c-name").focus();
      document.getElementById("c-make").onclick = async () => {
        const name = document.getElementById("c-name").value.trim();
        const q = document.getElementById("c-q").value.trim() || null;
        if(!name){ document.getElementById("c-err").textContent = "Give the event a name."; return; }
        document.getElementById("c-make").disabled = true; document.getElementById("c-err").textContent = "Making it…";
        try{
          const created = await TTC.insert(EVENT_TABLE, { name, question:q, color:chosen });
          TTCBar.closeModal(); await loadEventSheets(); TTC.toast(`"${name}" is live.`);
          // jump straight into the new sheet
          location.href = `event.html?id=${encodeURIComponent(created.id)}`;
        }catch(e){ document.getElementById("c-err").textContent = "Couldn't make it — check the WiFi."; document.getElementById("c-make").disabled = false; }
      };
    }
  );
}

function deleteSheet(s){
  TTCBar.modal(
    `<h2 style="font-family:var(--display);font-weight:800;margin:0 0 8px">Remove "${s.name}"?</h2>
     <p style="margin:0 0 14px">This takes the tile off the hub. The sign-ins people already did stay in the database.</p>
     <div style="display:flex;gap:10px">
       <button class="ttc-btn" data-close style="flex:1">Cancel</button>
       <button class="ttc-btn ttc-btn-danger" id="d-yes" style="flex:1">Remove it</button>
     </div>`,
    () => { document.getElementById("d-yes").onclick = async () => {
      try{ await TTC.update(EVENT_TABLE, s.id, { archived:true }); TTCBar.closeModal(); await loadEventSheets(); TTC.toast("Removed."); }
      catch(e){ TTC.toast("Couldn't remove it."); }
    }; }
  );
}

function paintNote(){
  document.getElementById("staffnote").textContent = isStaff()
    ? "Staff mode on — open any program to edit, or tap + to make an event sheet."
    : "Tap Staff up top to unlock editing, export, and making event sheets.";
}

renderGrid(); paintNote(); loadEventSheets();
TTCBar.onStaffChange(()=>{ renderGrid(); paintNote(); });
</script>
</body>
</html>
